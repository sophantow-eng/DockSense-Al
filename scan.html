<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d9488">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<title>สแกนทะเบียน · DockSense AI</title>
<script>
(function(){function show(m){var d=document.getElementById("ds-err");if(!d){d=document.createElement("div");d.id="ds-err";d.style.cssText="position:fixed;left:0;right:0;top:0;z-index:999;background:#dc2626;color:#fff;padding:10px 14px;font:14px/1.4 sans-serif;white-space:pre-wrap";(document.body||document.documentElement).appendChild(d)}d.textContent+=m+"\n"}
window.addEventListener("error",function(e){var t=e.target;if(t&&t!==window&&(t.src||t.href))show("โหลดไฟล์ไม่สำเร็จ: "+(t.src||t.href));else show("JS error: "+e.message)},true);
window.addEventListener("unhandledrejection",function(e){show("Error: "+((e.reason&&e.reason.message)||e.reason))});})();
</script>
</head>
<body style="padding-bottom:20px">
<header class="top"><a href="index.html" class="btn ghost" style="padding:8px 12px">← กลับ</a><div class="brand"><span class="logo"></span>สแกนทะเบียนรถ</div><button class="ghost" id="themeBtn">◐</button></header>
<main class="wrap" style="max-width:560px">
  <div id="loading" class="empty"><span class="spin dk"></span></div>
  <div id="denied" class="empty hide">🔒 บัญชีนี้ไม่มีสิทธิ์บันทึกทะเบียน<br>ติดต่อผู้ดูแลระบบเพื่อขอสิทธิ์เจ้าหน้าที่</div>

  <!-- 1 กล้อง -->
  <section id="s-pick" class="hide">
    <div class="cam"><video id="video" playsinline muted></video><div class="frame"></div>
      <div id="camErr" class="hide" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px"></div>
      <button class="flip" id="flip" aria-label="สลับกล้อง">🔄</button><button class="shutter" id="shoot" aria-label="ถ่ายภาพ">📷</button></div>
    <p class="muted" style="text-align:center">วางป้ายทะเบียนให้อยู่ในกรอบประ</p>
    <div class="grid g2">
      <label class="btn ghost" style="margin:0;color:var(--text);font-size:14px">🖼️ เลือกจากคลังภาพ<input id="gal" type="file" accept="image/*" class="hide"></label>
      <label class="btn ghost" style="margin:0;color:var(--text);font-size:14px">📱 ใช้กล้องของเครื่อง<input id="nat" type="file" accept="image/*" capture="environment" class="hide"></label>
    </div>
  </section>

  <!-- 2 ครอป -->
  <section id="s-crop" class="hide">
    <p class="muted">ลากกรอบให้ครอบเฉพาะป้ายทะเบียน เพื่อให้ AI อ่านแม่นยำขึ้น</p>
    <div style="display:flex;justify-content:center;background:#000;border-radius:14px;padding:8px"><div class="cropbox" id="cbox"><img id="cimg" alt="ภาพต้นฉบับ" draggable="false"><div class="crect" id="crect"><div class="hd" data-m="nw" style="left:-14px;top:-14px"></div><div class="hd" data-m="ne" style="right:-14px;top:-14px"></div><div class="hd" data-m="sw" style="left:-14px;bottom:-14px"></div><div class="hd" data-m="se" style="right:-14px;bottom:-14px"></div></div></div></div>
    <div class="grid g3" style="margin-top:12px"><button class="ghost" id="cRetake">ถ่ายใหม่</button><button class="ghost" id="cFull">ใช้ภาพเต็ม</button><button id="cOk">ใช้ส่วนที่เลือก</button></div>
  </section>

  <!-- 3 ตรวจสอบ -->
  <section id="s-review" class="hide">
    <img id="pv" class="pv" alt="ภาพป้ายทะเบียน">
    <div id="ocrState" class="card" style="margin-top:12px"></div>
    <div class="card">
      <label>เลขทะเบียน *</label><input id="fPlate" class="platein" placeholder="เช่น 1กก 1234" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <div class="grid g2"><div><label>จังหวัด</label><input id="fProv" list="provs"></div><div><label>ประเภทรถ</label><select id="fType"></select></div></div>
      <label>หมายเหตุ</label><input id="fNote">
      <p class="muted">วันและเวลาบันทึกอัตโนมัติจากเวลาจริงของระบบ (Asia/Bangkok)</p>
    </div>
    <div class="actbar"><button class="ghost" id="rRetake">ถ่ายใหม่</button><button id="rSave">ยืนยันและบันทึก</button></div>
  </section>

  <!-- 4 สำเร็จ -->
  <section id="s-done" class="hide card" style="text-align:center"><div style="font-size:54px">✅</div><h1 id="dPlate" style="margin:4px 0"></h1><div id="dInfo"></div><p id="dRep" class="badge" style="display:block;padding:10px;border-radius:12px;margin:12px 0"></p>
    <div class="grid g2"><a class="btn ghost" href="index.html">กลับหน้าหลัก</a><button id="dNext">สแกนคันถัดไป</button></div></section>
</main>
<datalist id="provs"></datalist>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
const $ = (s) => document.querySelector(s), esc = DS.esc, db = DS.db;
let me = null, session = null, stream = null, facing = "environment", blob = null, ocrRes = null, rawUrl = "";
const urls = []; const mk = (b) => { const u = URL.createObjectURL(b); urls.push(u); return u; };
const show = (id) => ["pick", "crop", "review", "done"].forEach((s) => $("#s-" + s).classList.toggle("hide", s !== id));
$("#themeBtn").onclick = DS.toggleTheme;
$("#provs").innerHTML = DS.PROVINCES.map((p) => `<option value="${p}">`).join("");
$("#fType").innerHTML = '<option value="">ไม่ระบุ</option>' + DS.VEHICLE_TYPES.map((t) => `<option>${t}</option>`).join("");

(async () => {
  const a = await DS.requireAuth();
  if (!a || !a.profile) { location.href = "index.html"; return; }
  me = a.profile; session = a.session; $("#loading").classList.add("hide");
  if (!DS.can(me, "write")) { $("#denied").classList.remove("hide"); return; }
  startCam(); show("pick");
})();

/* ---------- กล้อง ---------- */
function stopCam() { if (stream) stream.getTracks().forEach((t) => t.stop()); stream = null; }
async function startCam() {
  stopCam(); $("#camErr").classList.add("hide");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return camErr("เปิดกล้องผ่านหน้าเว็บไม่ได้ (ต้องเปิดผ่าน HTTPS) ใช้ปุ่มด้านล่างแทนได้");
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    $("#video").srcObject = stream; await $("#video").play().catch(() => {});
  } catch (e) { camErr(e.name === "NotAllowedError" ? "ไม่ได้รับอนุญาตให้ใช้กล้อง กรุณาอนุญาตในการตั้งค่าเบราว์เซอร์" : e.name === "NotFoundError" ? "ไม่พบกล้องในอุปกรณ์นี้" : "เปิดกล้องไม่สำเร็จ: " + e.message); }
}
function camErr(m) { const el = $("#camErr"); el.textContent = m; el.classList.remove("hide"); }
addEventListener("pagehide", stopCam);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopCam();
  else if (!$("#s-pick").classList.contains("hide") && !stream) startCam();
});
$("#flip").onclick = () => { facing = facing === "environment" ? "user" : "environment"; startCam(); };
$("#shoot").onclick = () => {
  const v = $("#video"); if (!v.videoWidth) return DS.toast("กล้องยังไม่พร้อม", "info");
  const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext("2d").drawImage(v, 0, 0);
  c.toBlob((b) => b && toCrop(b), "image/jpeg", 0.92);
};
["gal", "nat"].forEach((id) => ($("#" + id).onchange = (e) => { const f = e.target.files[0]; e.target.value = ""; if (f) toCrop(f); }));

/* ---------- ครอป ---------- */
let r = { x: 0.1, y: 0.3, w: 0.8, h: 0.4 }, drag = null; const MIN = 0.1, cl = (v, a, b) => Math.min(b, Math.max(a, v));
function toCrop(b) { stopCam(); rawUrl = mk(b); $("#cimg").src = rawUrl; r = { x: 0.1, y: 0.3, w: 0.8, h: 0.4 }; paint(); show("crop"); }
function paint() { const s = $("#crect").style; s.left = r.x * 100 + "%"; s.top = r.y * 100 + "%"; s.width = r.w * 100 + "%"; s.height = r.h * 100 + "%"; }
$("#crect").addEventListener("pointerdown", (e) => { e.stopPropagation(); e.target.setPointerCapture(e.pointerId); drag = { m: e.target.dataset.m || "move", sx: e.clientX, sy: e.clientY, r: { ...r } }; });
$("#cbox").addEventListener("pointermove", (e) => {
  if (!drag) return; const b = $("#cbox").getBoundingClientRect(), dx = (e.clientX - drag.sx) / b.width, dy = (e.clientY - drag.sy) / b.height; let { x, y, w, h } = drag.r;
  if (drag.m === "move") { x = cl(x + dx, 0, 1 - w); y = cl(y + dy, 0, 1 - h); }
  else {
    if (drag.m.includes("w")) { const nx = cl(x + dx, 0, x + w - MIN); w += x - nx; x = nx; } else w = cl(w + dx, MIN, 1 - x);
    if (drag.m.includes("n")) { const ny = cl(y + dy, 0, y + h - MIN); h += y - ny; y = ny; } else h = cl(h + dy, MIN, 1 - y);
  }
  r = { x, y, w, h }; paint();
});
addEventListener("pointerup", () => (drag = null));
function doCrop(full) {
  const i = $("#cimg"), c = full ? { x: 0, y: 0, w: 1, h: 1 } : r, sw = i.naturalWidth * c.w, sh = i.naturalHeight * c.h, k = Math.min(1, 1600 / Math.max(sw, sh));
  const cv = document.createElement("canvas"); cv.width = Math.round(sw * k); cv.height = Math.round(sh * k);
  cv.getContext("2d").drawImage(i, i.naturalWidth * c.x, i.naturalHeight * c.y, sw, sh, 0, 0, cv.width, cv.height);
  cv.toBlob((b) => { blob = b; $("#pv").src = mk(b); ocrRes = null; ["fPlate", "fProv", "fNote"].forEach((x) => ($("#" + x).value = "")); $("#fType").value = ""; show("review"); runOcr(); }, "image/jpeg", 0.88);
}
$("#cOk").onclick = () => doCrop(false); $("#cFull").onclick = () => doCrop(true);
const retake = () => { show("pick"); startCam(); }; $("#cRetake").onclick = retake; $("#rRetake").onclick = retake; $("#dNext").onclick = retake;

/* ---------- OCR ---------- */
async function runOcr() {
  const st = $("#ocrState"); st.innerHTML = '<div class="row" style="justify-content:flex-start"><span class="spin dk" style="flex:none"></span><div><b>AI กำลังอ่านป้ายทะเบียน...</b><div class="muted">ใช้เวลาประมาณ 2-5 วินาที</div></div></div>';
  $("#rSave").disabled = true; $("#fPlate").style.borderColor = "";
  try {
    const x = await DS.readPlate(blob); ocrRes = x; $("#fPlate").value = x.plate || ""; $("#fProv").value = x.province || ""; $("#fType").value = DS.VEHICLE_TYPES.includes(x.vehicle_type) ? x.vehicle_type : "";
    const c = x.confidence != null ? Math.round(x.confidence * 100) : null;
    const badge = c != null ? `<span class="badge ${c >= 85 ? "ok" : c >= 60 ? "warn" : "bad"}">ความมั่นใจ ${c}%</span>` : "";
    if (!x.found) st.innerHTML = "⚠️ AI ไม่พบป้ายทะเบียนในภาพ กรุณากรอกเองหรือถ่ายใหม่";
    else if (x.needs_review) {
      // AI ไม่ชัวร์ (อ่านสองรอบไม่ตรงกัน / รูปแบบป้ายผิดปกติ) → ให้เทียบกับภาพป้ายก่อนบันทึก
      const alts = (x.alternatives || []).filter((a) => a && a !== x.plate);
      st.innerHTML = `<b style="color:var(--danger)">⚠️ AI ยังไม่ชัวร์ — กรุณาเทียบกับภาพป้ายแล้วแก้ให้ถูกก่อนบันทึก</b> ${badge}` +
        (alts.length ? `<div class="muted" style="margin:8px 0 4px">AI อ่านได้อีกแบบ — แตะเพื่อใช้แทน:</div><div class="row" style="justify-content:flex-start;flex-wrap:wrap;gap:8px">${alts.map((a) => `<button type="button" class="ghost alt" data-v="${esc(a)}">${esc(a)}</button>`).join("")}</div>` : "");
      st.querySelectorAll(".alt").forEach((b) => (b.onclick = () => { $("#fPlate").value = b.dataset.v; DS.toast("เปลี่ยนเป็น " + b.dataset.v, "info"); }));
      $("#fPlate").style.borderColor = "var(--danger)";
    } else st.innerHTML = `✅ AI อ่านได้${x.provider === "gemini" ? " (อ่านยืนยัน 2 รอบตรงกัน)" : ""} — ตรวจสอบและแก้ไขได้ก่อนบันทึก ${badge}`;
  } catch (e) {
    const hint = e.code === "API_KEY_MISSING" ? "ยังไม่ได้ตั้งค่า API Key ของ OCR ที่ฝั่งเซิร์ฟเวอร์" : e.code === "API_KEY_INVALID" ? "API Key ของ OCR ใช้ไม่ได้ (ผิดหรือหมดอายุ) — ตรวจสอบใน Supabase secrets" : e.code === "NOT_DEPLOYED" ? "ยังไม่ได้ deploy Edge Function ocr-plate (ดู README.md)" : e.message;
    st.innerHTML = `<b style="color:var(--danger)">⚠️ อ่านทะเบียนอัตโนมัติไม่สำเร็จ</b><p class="muted">${esc(hint)}<br>กรอกเลขทะเบียนเองด้านล่างเพื่อบันทึกต่อได้</p><button class="ghost" id="retryOcr">ลองอ่านอีกครั้ง</button>`;
    $("#retryOcr").onclick = runOcr;
  }
  $("#rSave").disabled = false;
  if (!$("#fPlate").value) $("#fPlate").focus();
}

/* ---------- บันทึก ---------- */
$("#rSave").onclick = async (ev) => {
  const plate = $("#fPlate").value.trim(); if (!plate) return DS.toast("กรุณากรอกเลขทะเบียน", "error");
  const btn = ev.target; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> กำลังบันทึก'; let path = "";
  try {
    const { count, error: ce } = await db.from("vehicle_logs").select("id", { count: "exact", head: true }).eq("plate_norm", DS.norm(plate)); if (ce) throw ce;
    path = `${session.user.id}/${Date.now()}.jpg`;
    const up = await db.storage.from("plate-images").upload(path, blob, { contentType: "image/jpeg" }); if (up.error) throw up.error;
    const { data, error } = await db.from("vehicle_logs").insert({ plate_number: plate, province: $("#fProv").value.trim() || null, vehicle_type: $("#fType").value || null, note: $("#fNote").value.trim() || null,
      image_path: path, ocr_confidence: ocrRes ? ocrRes.confidence : null, ocr_provider: ocrRes ? ocrRes.provider : null }).select().single();
    if (error) { await db.storage.from("plate-images").remove([path]); throw error; }
    $("#dPlate").textContent = data.plate_number; $("#dInfo").innerHTML = `${esc(data.province || "")}<div class="muted">บันทึกเมื่อ ${DS.fmt.dateTime(data.capture_at)}</div>`;
    const rep = $("#dRep"); rep.className = "badge " + (count > 0 ? "warn" : ""); rep.textContent = count > 0 ? `ทะเบียนนี้เคยเข้ามาแล้ว ${count} ครั้ง (ครั้งนี้เป็นครั้งที่ ${count + 1})` : "ทะเบียนนี้เข้ามาเป็นครั้งแรก";
    show("done"); DS.toast("บันทึกทะเบียนรถเรียบร้อย"); if (navigator.vibrate) navigator.vibrate(60);
  } catch (e) { DS.toast(e.message || "บันทึกไม่สำเร็จ", "error"); }
  btn.disabled = false; btn.textContent = "ยืนยันและบันทึก";
};
</script>
</body>
</html>
