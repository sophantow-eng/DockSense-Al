<script>
(function(){function show(m){var d=document.getElementById("ds-err");if(!d){d=document.createElement("div");d.id="ds-err";d.style.cssText="position:fixed;left:0;right:0;top:0;z-index:999;background:#dc2626;color:#fff;padding:10px 14px;font:14px/1.4 sans-serif;white-space:pre-wrap";(document.body||document.documentElement).appendChild(d)}d.textContent+=m+"\n"}
window.addEventListener("error",function(e){var t=e.target;if(t&&t!==window&&(t.src||t.href))show("โหลดไฟล์ไม่สำเร็จ: "+(t.src||t.href));else show("JS error: "+e.message)},true);
window.addEventListener("unhandledrejection",function(e){show("Error: "+((e.reason&&e.reason.message)||e.reason))});})();

<body>
<!-- LOGIN -->
<div id="login" class="wrap hide" style="max-width:380px;padding-top:12vh">
  <form id="loginForm" class="card">
    <div style="text-align:center;margin-bottom:10px"><span class="logo" style="width:48px;height:48px;border-radius:14px"></span><h1 style="margin:8px 0 0">DockSense AI</h1><div class="muted">ระบบบันทึกทะเบียนรถเข้าพื้นที่</div></div>

    <div class="row" style="flex:none"><button class="ghost" id="themeBtn" aria-label="สลับธีม">◐</button><button class="ghost" id="outBtn">ออก</button></div></header>

      <div id="filters" class="card hide" style="margin-top:12px">

<script>
// ค่าโปรเจกต์ Supabase (publishable/anon key เปิดเผยในหน้าเว็บได้ เพราะข้อมูลถูกป้องกันด้วย Login + RLS)

window.DS_CONFIG = {
  SUPABASE_URL: "https://dhqvdbdqhcbymqvhpqop.supabase.co",
  // Publishable key (เปิดเผยได้) — ดูได้ที่ Supabase → Project Settings → API Keys
  SUPABASE_KEY: "sb_publishable_sLXbMjD5NWTKmyLB4YqlmQ_He_kA1LK"

</script>
<script>
/* DockSense AI — ส่วนที่ใช้ร่วมกัน (index.html + scan.html) */
(function () {
  const cfg = window.DS_CONFIG || {};
  const keyMissing = !cfg.SUPABASE_URL || !cfg.SUPABASE_KEY || /PASTE_/.test(cfg.SUPABASE_KEY);
  const db = supabase.createClient(cfg.SUPABASE_URL || "https://invalid.supabase.co", cfg.SUPABASE_KEY || "missing", {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
  });

  const TZ = "Asia/Bangkok";
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // ต้องตรงกับคอลัมน์ plate_norm ในฐานข้อมูล: upper(regexp_replace(plate_number, '[\s\-]', '', 'g'))
  const norm = (s) => String(s ?? "").toUpperCase().replace(/[\s\-]/g, "");

  /* ธีม */
  const applyTheme = (t) => { if (t === "dark") document.documentElement.setAttribute("data-theme", "dark"); else document.documentElement.removeAttribute("data-theme"); };
  try {
    const saved = localStorage.getItem("ds_theme");
    applyTheme(saved || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  } catch (e) {}
  const toggleTheme = () => {
    const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(t); try { localStorage.setItem("ds_theme", t); } catch (e) {}
  };

  /* วันเวลา (แสดงตามเวลาไทยเสมอ ปี ค.ศ.) */
  const mkf = (o) => new Intl.DateTimeFormat("th-TH-u-ca-gregory", { timeZone: TZ, ...o });
  const fD = mkf({ day: "numeric", month: "short", year: "numeric" }), fT = mkf({ hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
  const ok = (v) => v && !isNaN(new Date(v));
  const fmt = {
    date: (v) => (ok(v) ? fD.format(new Date(v)) : "-"),
    time: (v) => (ok(v) ? fT.format(new Date(v)) : "-"),
    dateTime: (v) => (ok(v) ? fD.format(new Date(v)) + " " + fT.format(new Date(v)) : "-"),
    ago: (v) => {
      if (!ok(v)) return "-";
      const s = Math.max(0, (Date.now() - new Date(v)) / 1000);
      if (s < 60) return "เมื่อสักครู่";
      if (s < 3600) return Math.floor(s / 60) + " นาทีที่แล้ว";
      if (s < 86400) return Math.floor(s / 3600) + " ชั่วโมงที่แล้ว";
      if (s < 604800) return Math.floor(s / 86400) + " วันที่แล้ว";
      return fD.format(new Date(v));
    },
  };

  /* toast */
  function toast(msg, type) {
    let box = document.querySelector(".toasts");
    if (!box) { box = document.createElement("div"); box.className = "toasts"; document.body.appendChild(box); }
    const t = document.createElement("div"); t.className = "toast" + (type && type !== "ok" ? " " + type : ""); t.textContent = msg; box.appendChild(t);
    setTimeout(() => t.remove(), type === "error" ? 5000 : 3000);
  }

  /* modal: คืน element .modal ที่มี .sb (เนื้อหา) — ปิดด้วย m.remove() */
  function modal(title, html) {
    const m = document.createElement("div"); m.className = "modal";
    m.innerHTML = `<div class="sheet"><div class="sh"><b>${esc(title)}</b><button class="x" aria-label="ปิด">✕</button></div><div class="sb">${html || ""}</div></div>`;
    m.addEventListener("click", (e) => { if (e.target === m) m.remove(); });
    m.querySelector(".x").onclick = () => m.remove();
    document.body.appendChild(m); return m;
  }

  /* รูปภาพใน bucket private → signed URL (แคชไว้) */
  const sc = new Map();
  async function signedUrl(path) {
    const hit = sc.get(path); if (hit && hit.exp > Date.now()) return hit.url;
    const { data, error } = await db.storage.from("plate-images").createSignedUrl(path, 3600); if (error) throw error;
    sc.set(path, { url: data.signedUrl, exp: Date.now() + 3300 * 1000 }); return data.signedUrl;
  }
  const thumb = (p) => (p ? `<img class="ph" data-p="${esc(p)}" alt="" loading="lazy">` : '<div class="ph"></div>');
  function hydrateImages(root) {
    (root || document).querySelectorAll("img[data-p]").forEach(async (img) => {
      const p = img.dataset.p; img.removeAttribute("data-p");
      try { img.src = await signedUrl(p); } catch (e) { img.style.visibility = "hidden"; }
    });
  }

  /* สิทธิ์: admin ทำได้ทุกอย่าง · staff บันทึก/แก้ไข · viewer ดูอย่างเดียว (RLS ในฐานข้อมูลบังคับอีกชั้น) */
  const can = (me, a) => !!me && (a === "read" ? true : a === "write" ? me.role === "admin" || me.role === "staff" : me.role === "admin");

  /* session + โปรไฟล์: คืน null ถ้ายังไม่ล็อกอิน, {session, profile:null} ถ้ายังไม่มีโปรไฟล์ */
  async function requireAuth() {
    const { data: { session }, error } = await db.auth.getSession();
    if (error || !session) return null;
    const { data: profile, error: pe } = await db.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
    if (pe) console.error("profiles:", pe);
    return { session, profile: profile || null };
  }

  /* OCR ผ่าน Edge Function (API key อยู่ฝั่งเซิร์ฟเวอร์เท่านั้น) */
  async function fnErr(error) {
    let code = "OCR_FAILED", msg = error.message || "เรียก OCR ไม่สำเร็จ";
    const ctx = error.context;
    if (error.name === "FunctionsHttpError" && ctx) {
      try { const j = await ctx.json(); msg = j.error || j.message || msg; code = j.code || code; } catch (e) {}
      if (ctx.status === 404) code = "NOT_DEPLOYED";
      else if (ctx.status === 401) { code = "UNAUTHORIZED"; msg = "เซสชันหมดอายุหรือไม่ได้รับอนุญาต กรุณาเข้าสู่ระบบใหม่"; }
    } else { code = "NOT_DEPLOYED"; msg = "เชื่อมต่อ Edge Function ไม่ได้ (ยังไม่ได้ deploy หรืออินเทอร์เน็ตมีปัญหา)"; }
    const e = new Error(msg); e.code = code; return e;
  }
  const b64 = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej(new Error("อ่านไฟล์ภาพไม่ได้")); r.readAsDataURL(blob); });
  async function readPlate(blob) {
    const { data, error } = await db.functions.invoke("ocr-plate", { body: { imageBase64: await b64(blob), mediaType: blob.type || "image/jpeg" } });
    if (error) throw await fnErr(error); return data;
  }
  async function pingOcr() {
    const { data, error } = await db.functions.invoke("ocr-plate", { body: { ping: true } });
    if (error) throw await fnErr(error); return data.provider;
  }

  const VEHICLE_TYPES = ["รถยนต์", "รถกระบะ", "รถบรรทุก", "รถจักรยานยนต์", "รถตู้", "อื่นๆ"];
  const PROVINCES = ["กรุงเทพมหานคร","กระบี่","กาญจนบุรี","กาฬสินธุ์","กำแพงเพชร","ขอนแก่น","จันทบุรี","ฉะเชิงเทรา","ชลบุรี","ชัยนาท","ชัยภูมิ","ชุมพร","เชียงราย","เชียงใหม่","ตรัง","ตราด","ตาก","นครนายก","นครปฐม","นครพนม","นครราชสีมา","นครศรีธรรมราช","นครสวรรค์","นนทบุรี","นราธิวาส","น่าน","บึงกาฬ","บุรีรัมย์","ปทุมธานี","ประจวบคีรีขันธ์","ปราจีนบุรี","ปัตตานี","พระนครศรีอยุธยา","พะเยา","พังงา","พัทลุง","พิจิตร","พิษณุโลก","เพชรบุรี","เพชรบูรณ์","แพร่","ภูเก็ต","มหาสารคาม","มุกดาหาร","แม่ฮ่องสอน","ยโสธร","ยะลา","ร้อยเอ็ด","ระนอง","ระยอง","ราชบุรี","ลพบุรี","ลำปาง","ลำพูน","เลย","ศรีสะเกษ","สกลนคร","สงขลา","สตูล","สมุทรปราการ","สมุทรสงคราม","สมุทรสาคร","สระแก้ว","สระบุรี","สิงห์บุรี","สุโขทัย","สุพรรณบุรี","สุราษฎร์ธานี","สุรินทร์","หนองคาย","หนองบัวลำภู","อ่างทอง","อำนาจเจริญ","อุดรธานี","อุตรดิตถ์","อุทัยธานี","อุบลราชธานี"];

  window.addEventListener("offline", () => toast("ออฟไลน์อยู่ — ตรวจสอบอินเทอร์เน็ต", "error"));
  window.addEventListener("online", () => toast("กลับมาออนไลน์แล้ว", "info"));

  window.DS = { db, esc, norm, toggleTheme, fmt, toast, modal, signedUrl, thumb, hydrateImages, can, requireAuth, readPlate, pingOcr, VEHICLE_TYPES, PROVINCES, TZ };

  if (keyMissing) document.addEventListener("DOMContentLoaded", () => {
    const d = document.createElement("div");
    d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:200;background:#dc2626;color:#fff;padding:10px 14px;font-size:14px;text-align:center";
    d.textContent = "ยังไม่ได้ตั้งค่า SUPABASE_KEY ใน config.js — ล็อกอินและโหลดข้อมูลไม่ได้";
    document.body.appendChild(d);
  });
})();

</script>
<script>
const $ = (s) => document.querySelector(s), esc = DS.esc, db = DS.db;
let me = null, tab = "home", rows = [], total = 0, loadingMore = false;
const PAGE = 20;
const MONTHS = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const spin = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
const errBox = (m, retry) => `<div class="empty">⚠️ เกิดข้อผิดพลาด<br><span class="muted">${esc(m)}</span>${retry ? `<br><br><button class="ghost" onclick="${retry}">ลองใหม่</button>` : ""}</div>`;

/* ---------- login ---------- */
let mode = "in";
$("#lmode").onclick = (e) => { e.preventDefault(); mode = mode === "in" ? "up" : "in";
  $("#nameWrap").classList.toggle("hide", mode === "in"); $("#lnote").classList.toggle("hide", mode === "in");
  $("#lbtn").textContent = mode === "in" ? "เข้าสู่ระบบ" : "สมัครสมาชิก"; $("#lmode").textContent = mode === "in" ? "ยังไม่มีบัญชี? สมัครสมาชิก" : "มีบัญชีแล้ว? เข้าสู่ระบบ"; };
$("#loginForm").onsubmit = async (e) => {
  e.preventDefault(); const b = $("#lbtn"); b.disabled = true; $("#lerr").classList.add("hide");
  try {
    const email = $("#lemail").value.trim(), password = $("#lpass").value;
    if (mode === "in") { const { error } = await db.auth.signInWithPassword({ email, password }); if (error) throw error; }
    else { const { data, error } = await db.auth.signUp({ email, password, options: { data: { full_name: $("#lname").value } } }); if (error) throw error;
      if (!data.session) { DS.toast("สมัครสำเร็จ กรุณายืนยันอีเมลก่อนเข้าสู่ระบบ", "info"); $("#lmode").click(); b.disabled = false; return; } }
    boot();
  } catch (x) { const el = $("#lerr"); el.textContent = /invalid login/i.test(x.message) ? "อีเมลหรือรหัสผ่านไม่ถูกต้อง" : x.message; el.classList.remove("hide"); }
  b.disabled = false;
};
$("#outBtn").onclick = async () => { await db.auth.signOut(); location.reload(); };
$("#themeBtn").onclick = DS.toggleTheme;

/* ---------- boot / tabs ---------- */
async function boot() {
  const a = await DS.requireAuth();
  if (!a) { $("#login").classList.remove("hide"); $("#app").classList.add("hide"); return; }
  if (!a.profile) { $("#app").classList.add("hide"); $("#login").classList.remove("hide"); $("#lerr").textContent = "ไม่พบโปรไฟล์ผู้ใช้ กรุณาออกจากระบบแล้วเข้าใหม่"; $("#lerr").classList.remove("hide"); await db.auth.signOut(); return; }
  me = a.profile; $("#login").classList.add("hide"); $("#app").classList.remove("hide");
  $("#fab").classList.toggle("hide", !DS.can(me, "write"));
  $("#provs").innerHTML = DS.PROVINCES.map((p) => `<option value="${p}">`).join("");
  $("#fm").innerHTML += MONTHS.map((m, i) => `<option value="${i + 1}">${m}</option>`).join("");
  const y = new Date().getFullYear(); $("#fy").innerHTML += [0,1,2,3,4,5].map((i) => `<option>${y - i}</option>`).join("");
  go("home");
  let t; db.channel("rt").on("postgres_changes", { event: "*", schema: "public", table: "vehicle_logs" }, () => { clearTimeout(t); t = setTimeout(() => reload(), 400); }).subscribe();
}
document.querySelectorAll("nav.tabs button").forEach((b) => (b.onclick = () => go(b.dataset.t)));
function go(t) {
  tab = t; document.querySelectorAll("nav.tabs button").forEach((b) => b.classList.toggle("on", b.dataset.t === t));
  ["home", "history", "search", "set"].forEach((x) => $("#t-" + x).classList.toggle("hide", x !== t)); reload();
}
function reload() { ({ home: loadHome, history: () => loadHistory(true), search: loadSearch, set: loadSettings })[tab](); }

/* ---------- home ---------- */
function bars(data, color) {
  const max = Math.max(1, ...data.map((d) => d.count)), step = Math.ceil(data.length / 6) || 1;
  return `<div class="bars">${data.map((d) => `<div class="bar" title="${esc(d.label)}: ${d.count} คัน"><i style="height:${(d.count / max) * 100}%;background:${color}"></i></div>`).join("")}</div><div class="axis">${data.map((d, i) => `<span>${i % step === 0 ? esc(d.label) : ""}</span>`).join("")}</div>`;
}
async function loadHome() {
  if (!$("#home").innerHTML) $("#home").innerHTML = spin;
  const [s, r] = await Promise.all([db.rpc("dashboard_stats"), db.from("vehicle_logs").select("*").order("capture_at", { ascending: false }).limit(8)]);
  if (s.error || r.error) { $("#home").innerHTML = errBox((s.error || r.error).message, "loadHome()"); return; }
  const d = s.data, n = (v) => Number(v).toLocaleString("th-TH");
  const st = [["รถเข้าวันนี้", d.today_total], ["ทะเบียนไม่ซ้ำวันนี้", d.today_unique], ["เดือนนี้", d.month_total], ["ปีนี้", d.year_total], ["รายการทั้งหมด", d.all_total]];
  $("#home").innerHTML = `<div class="grid g5">${st.map(([l, v]) => `<div class="card stat" style="margin:0"><b>${n(v)}</b><span class="muted">${l}</span></div>`).join("")}</div>
  <div class="card" style="margin-top:12px"><h3>จำนวนรถรายวัน (30 วัน)</h3>${bars(d.daily, "#14b8a6")}</div>
  <div class="card"><h3>รายเดือน (12 เดือน)</h3>${bars(d.monthly, "#6366f1")}</div>
  <div class="card"><h3>สถิติรายปี</h3>${d.yearly.length ? bars(d.yearly, "#f59e0b") : '<div class="empty">ยังไม่มีข้อมูล</div>'}</div>
  <div class="card"><h3>🟢 Recent Activity</h3>${r.data.length ? r.data.map(itemHtml).join("") : '<div class="empty">ยังไม่มีรายการ เริ่มสแกนทะเบียนคันแรกได้เลย</div>'}</div>`;
  bindItems($("#home"), r.data);
}
function itemHtml(l) {
  return `<div class="item" data-id="${l.id}" style="padding:8px 0;border-top:1px solid var(--line)">${DS.thumb(l.image_path)}
  <div style="flex:1;min-width:0"><span class="plate">${esc(l.plate_number)}</span><div class="muted">${esc(l.province || "-")} · ${esc(l.vehicle_type || "")}</div><div class="muted">${DS.fmt.ago(l.capture_at)} · ${DS.fmt.date(l.capture_at)} ${DS.fmt.time(l.capture_at)}</div></div></div>`;
}
function bindItems(root, list) { DS.hydrateImages(root); root.querySelectorAll(".item").forEach((el) => (el.onclick = () => showDetail(list.find((x) => x.id === el.dataset.id)))); }

/* ---------- detail / edit / delete ---------- */
async function showDetail(log, norm) {
  const m = DS.modal("รายละเอียดทะเบียน", spin), body = m.querySelector(".sb"), n = log ? log.plate_norm : norm;
  const { data: hist, error } = await db.from("vehicle_logs").select("*").eq("plate_norm", n).order("capture_at", { ascending: false }).limit(200);
  if (error) { body.innerHTML = errBox(error.message); return; }
  const head = log || hist[0]; let img = "";
  if (log && log.image_path) { try { img = `<a href="${await DS.signedUrl(log.image_path)}" target="_blank"><img class="pv" src="${await DS.signedUrl(log.image_path)}" alt="ภาพทะเบียน"></a>`; } catch (e) {} }
  const conf = log && log.ocr_confidence != null ? Math.round(log.ocr_confidence * 100) : null;
  body.innerHTML = `<div class="row" style="flex-wrap:wrap"><span class="plate" style="flex:none">${esc(head.plate_number)}</span>${conf != null ? `<span class="badge ${conf >= 85 ? "ok" : conf >= 60 ? "warn" : "bad"}" style="flex:none">ความมั่นใจ ${conf}%</span>` : ""}</div>
  ${img ? `<div style="margin:12px 0">${img}</div>` : ""}
  ${log ? `<div class="grid g2"><div><label>วันและเวลาที่ตรวจพบ</label>${DS.fmt.dateTime(log.capture_at)}</div><div><label>จังหวัด</label>${esc(log.province || "-")}</div><div><label>ประเภทรถ</label>${esc(log.vehicle_type || "-")}</div><div><label>หมายเหตุ</label>${esc(log.note || "-")}</div></div>` : ""}
  <div class="card" style="margin:12px 0"><b>ตรวจพบทั้งหมด ${hist.length} ครั้ง</b> · ล่าสุด ${DS.fmt.dateTime(hist[0].capture_at)}</div>
  <b>ประวัติการตรวจพบ</b><div style="margin-top:6px">${hist.map((h) => `<div class="item" style="padding:6px 0;border-top:1px solid var(--line);cursor:default">${DS.thumb(h.image_path)}<div style="flex:1">${DS.fmt.dateTime(h.capture_at)}<div class="muted">${esc(h.note || "")}</div></div></div>`).join("")}</div>
  ${log ? `<div class="row" style="margin-top:14px">${DS.can(me, "write") ? '<button class="ghost" id="dEdit">แก้ไข</button>' : ""}${DS.can(me, "delete") ? '<button class="danger" id="dDel">ลบ</button>' : ""}</div>` : ""}`;
  DS.hydrateImages(body);
  if ($("#dEdit")) $("#dEdit").onclick = () => { m.remove(); editLog(log); };
  if ($("#dDel")) $("#dDel").onclick = () => { m.remove(); delLog(log); };
}
function editLog(l) {
  const m = DS.modal("แก้ไขข้อมูลทะเบียน", `<label>เลขทะเบียน</label><input id="e1" value="${esc(l.plate_number)}"><label>จังหวัด</label><input id="e2" list="provs" value="${esc(l.province || "")}">
  <label>ประเภทรถ</label><select id="e3"><option value="">ไม่ระบุ</option>${DS.VEHICLE_TYPES.map((t) => `<option ${t === l.vehicle_type ? "selected" : ""}>${t}</option>`).join("")}</select>
  <label>หมายเหตุ</label><textarea id="e4" rows="2">${esc(l.note || "")}</textarea><p class="muted">วันและเวลาที่ตรวจพบแก้ไขไม่ได้ เพื่อความถูกต้องของประวัติ</p>
  <div class="row"><button class="ghost" id="e0">ยกเลิก</button><button id="es">บันทึก</button></div>`);
  m.querySelector("#e0").onclick = () => m.remove();
  m.querySelector("#es").onclick = async (ev) => {
    const plate = m.querySelector("#e1").value.trim(); if (!plate) return DS.toast("กรุณากรอกเลขทะเบียน", "error");
    ev.target.disabled = true;
    const { error } = await db.from("vehicle_logs").update({ plate_number: plate, province: m.querySelector("#e2").value.trim() || null, vehicle_type: m.querySelector("#e3").value || null, note: m.querySelector("#e4").value.trim() || null }).eq("id", l.id);
    if (error) { DS.toast(error.message, "error"); ev.target.disabled = false; } else { DS.toast("บันทึกการแก้ไขแล้ว"); m.remove(); reload(); }
  };
}
function delLog(l) {
  const m = DS.modal("ยืนยันการลบ", `<p>ต้องการลบรายการทะเบียน <b>${esc(l.plate_number)}</b> ใช่หรือไม่?<br><span class="muted">การลบไม่สามารถย้อนกลับได้</span></p><div class="row"><button class="ghost" id="d0">ยกเลิก</button><button class="danger" id="d1">ลบ</button></div>`);
  m.querySelector("#d0").onclick = () => m.remove();
  m.querySelector("#d1").onclick = async (ev) => {
    ev.target.disabled = true; const { error } = await db.from("vehicle_logs").delete().eq("id", l.id);
    if (error) { DS.toast(error.message, "error"); ev.target.disabled = false; return; }
    if (l.image_path) await db.storage.from("plate-images").remove([l.image_path]);
    DS.toast("ลบรายการแล้ว"); m.remove(); reload();
  };
}

/* ---------- history ---------- */
$("#fToggle").onclick = () => $("#filters").classList.toggle("hide");
let ft; ["fp", "fpv", "ff", "ft", "fm", "fy"].forEach((id) => ($("#" + id).oninput = () => { clearTimeout(ft); ft = setTimeout(() => loadHistory(true), 350); }));
$("#fclear").onclick = () => { ["fp", "fpv", "ff", "ft", "fm", "fy"].forEach((id) => ($("#" + id).value = "")); loadHistory(true); };
function applyF(q) {
  const v = (id) => $("#" + id).value.trim();
  if (v("fp")) q = q.ilike("plate_norm", `%${DS.norm(v("fp"))}%`);
  if (v("fpv")) q = q.ilike("province", `%${v("fpv")}%`);
  if (v("ff")) q = q.gte("capture_date", v("ff")); if (v("ft")) q = q.lte("capture_date", v("ft"));
  if (v("fm")) q = q.eq("month", +v("fm")); if (v("fy")) q = q.eq("year", +v("fy"));
  return q;
}
async function loadHistory(reset) {
  if (reset) { $("#hlist").innerHTML = spin; rows = []; }
  const { data, count, error } = await applyF(db.from("vehicle_logs").select("*", { count: "exact" }).order("capture_at", { ascending: false }).range(rows.length, rows.length + PAGE - 1));
  if (error) { $("#hlist").innerHTML = errBox(error.message, "loadHistory(true)"); return; }
  total = count || 0; rows = reset ? data : rows.concat(data);
  $("#hcount").textContent = `ทั้งหมด ${total.toLocaleString("th-TH")} รายการ`;
  $("#hlist").innerHTML = rows.length ? `<div class="card" style="padding:4px 14px">${rows.map(itemHtml).join("")}</div>` : '<div class="empty">ไม่พบรายการ<br>ลองเปลี่ยนตัวกรอง หรือเริ่มสแกนทะเบียน</div>';
  bindItems($("#hlist"), rows); $("#more").classList.toggle("hide", rows.length >= total); $("#more").textContent = `โหลดเพิ่ม (${rows.length}/${total})`;
}
$("#more").onclick = async (e) => { e.target.disabled = true; await loadHistory(false); e.target.disabled = false; };
$("#csvBtn").onclick = async (e) => {
  e.target.disabled = true;
  try {
    const all = [];
    for (let o = 0; ; o += 1000) { const { data, error } = await applyF(db.from("vehicle_logs").select("*").order("capture_at", { ascending: false }).range(o, o + 999)); if (error) throw error; all.push(...data); if (data.length < 1000) break; }
    if (!all.length) return DS.toast("ไม่มีข้อมูลให้ส่งออก", "info");
    const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const csv = ["เลขทะเบียน,จังหวัด,ประเภทรถ,วันที่,เวลา,หมายเหตุ,รหัสรายการ", ...all.map((l) => [l.plate_number, l.province, l.vehicle_type, DS.fmt.date(l.capture_at), DS.fmt.time(l.capture_at), l.note, l.id].map(q).join(","))].join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" })); a.download = `docksense-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
    DS.toast(`ส่งออก ${all.length} รายการแล้ว (เปิดด้วย Excel ได้)`);
  } catch (x) { DS.toast(x.message, "error"); } finally { e.target.disabled = false; }
};

/* ---------- search ---------- */
let st; $("#sq").oninput = () => { clearTimeout(st); st = setTimeout(loadSearch, 300); };
async function loadSearch() {
  $("#slist").innerHTML = spin; const n = DS.norm($("#sq").value);
  let q = db.from("plate_summary").select("*").order("last_seen", { ascending: false }).limit(50); if (n) q = q.ilike("plate_norm", `%${n}%`);
  const { data, error } = await q; if (error) { $("#slist").innerHTML = errBox(error.message, "loadSearch()"); return; }
  $("#slist").innerHTML = data.length ? data.map((r) => `<div class="card item" data-n="${esc(r.plate_norm)}"><span class="plate">${esc(r.plate_number)}</span><div><b>เข้ามา ${r.visit_count} ครั้ง</b><div class="muted">${esc(r.province || "")} ล่าสุด ${DS.fmt.dateTime(r.last_seen)}</div></div></div>`).join("") : '<div class="empty">ไม่พบทะเบียนที่ค้นหา<br>ลองพิมพ์เฉพาะบางส่วนของเลขทะเบียน</div>';
  $("#slist").querySelectorAll(".item").forEach((el) => (el.onclick = () => showDetail(null, el.dataset.n)));
}

/* ---------- settings ---------- */
async function loadSettings() {
  const roleTh = { admin: "ผู้ดูแลระบบ", staff: "เจ้าหน้าที่", viewer: "ผู้ชม" };
  $("#settings").innerHTML = `<div class="card"><h3>บัญชีของฉัน</h3>${esc(me.full_name || "")} · ${esc(me.email || "")}<div class="muted">สิทธิ์: ${roleTh[me.role]}</div></div>
  <div class="card"><h3>การเชื่อมต่อ AI OCR</h3><p class="muted">อ่านป้ายที่ Supabase Edge Function <code>ocr-plate</code> เพื่อไม่ให้ API Key อยู่ในหน้าเว็บ (ดูวิธี deploy ใน README.md)</p><button id="ocrTest">ทดสอบการเชื่อมต่อ</button><div id="ocrRes" style="margin-top:10px"></div></div>
  <div class="card"><h3>แจ้งเตือน Telegram <span class="badge">เร็วๆ นี้</span></h3><p class="muted">ฐานข้อมูลเตรียมตารางไว้แล้ว จะแจ้งเตือนเมื่อรถทะเบียนที่ติดตามเข้าบริษัท</p></div>
  <div class="card"><h3>ติดตั้งเป็นแอป</h3><p class="muted">Android: Chrome → เมนู ⋮ → "ติดตั้งแอป" · iPhone: Safari → แชร์ → "เพิ่มไปยังหน้าจอโฮม"</p></div><div id="users"></div>`;
  $("#ocrTest").onclick = async (e) => {
    e.target.disabled = true; const out = $("#ocrRes");
    try { const p = await DS.pingOcr(); out.innerHTML = `<span class="badge ok">✓ เชื่อมต่อสำเร็จ (ผู้ให้บริการ: ${esc(p)})</span>`; }
    catch (x) { out.innerHTML = `<span class="badge bad">✗ ${x.code === "API_KEY_MISSING" ? "ยังไม่ได้ตั้งค่า ANTHROPIC_API_KEY" : x.code === "NOT_DEPLOYED" ? "ยังไม่ได้ deploy Edge Function ocr-plate" : esc(x.message)}</span>`; }
    e.target.disabled = false;
  };
  if (DS.can(me, "admin")) {
    const { data, error } = await db.from("profiles").select("*").order("created_at");
    if (error) return;
    $("#users").innerHTML = `<div class="card"><h3>จัดการผู้ใช้งานและสิทธิ์</h3>${data.map((u) => `<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><div style="min-width:0"><b>${esc(u.full_name || "")}</b><div class="muted">${esc(u.email || "")}</div></div>
      <select data-u="${u.id}" ${u.id === me.id ? "disabled" : ""}>${["admin", "staff", "viewer"].map((r) => `<option value="${r}" ${r === u.role ? "selected" : ""}>${roleTh[r]}</option>`).join("")}</select></div>`).join("")}</div>`;
    $("#users").querySelectorAll("select").forEach((s) => (s.onchange = async () => { const { error } = await db.from("profiles").update({ role: s.value }).eq("id", s.dataset.u); error ? DS.toast(error.message, "error") : DS.toast("เปลี่ยนสิทธิ์แล้ว"); }));
  }
}
boot();
</script>
