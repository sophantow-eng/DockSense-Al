e32\u0e1e\u0e2a\u0e14\u0e2d\u0e22\u0e48\u0e32\u0e07\u0e40\u0e14\u0e35\u0e22\u0e27 \u00b7 1 = \u0e16\u0e48\u0e32\u0e22\u0e40\u0e2d\u0e07\u0e40\u0e21\u0e37\u0e48\u0e2d\u0e40\u0e2b\u0e47\u0e19\u0e23\u0e16\u0e40\u0e02\u0e49\u0e32\u0e01\u0e23\u0e2d\u0e1a \u00b7 \u226560000 = \u0e40\u0e1e\u0e34\u0e48\u0e21\u0e15\u0e23\u0e27\u0e08\u0e0b\u0e49\u0e33\u0e17\u0e38\u0e01\u0e01\u0e35\u0e48 ms (\u0e01\u0e34\u0e19\u0e42\u0e04\u0e27\u0e15\u0e32 AI)\n#define RESULT_PIN 14                        // \u0e02\u0e32\u0e41\u0e08\u0e49\u0e07\u0e1c\u0e25\u0e01\u0e25\u0e31\u0e1a DevKit: HIGH 2 \u0e27\u0e34\u0e19\u0e32\u0e17\u0e35\u0e40\u0e21\u0e37\u0e48\u0e2d\u0e23\u0e30\u0e1a\u0e1a\u0e2d\u0e48\u0e32\u0e19\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19\u0e44\u0e14\u0e49 \u00b7 -1 = \u0e44\u0e21\u0e48\u0e43\u0e0a\u0e49\nconst bool     USE_FLASH           = false;  // true = \u0e40\u0e1b\u0e34\u0e14\u0e44\u0e1f\u0e41\u0e1f\u0e25\u0e0a\u0e02\u0e32\u0e27\u0e1a\u0e19\u0e1a\u0e2d\u0e23\u0e4c\u0e14\u0e15\u0e2d\u0e19\u0e16\u0e48\u0e32\u0e22\u0e2d\u0e48\u0e32\u0e19\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19 (\u0e01\u0e25\u0e32\u0e07\u0e04\u0e37\u0e19) \u2014 \u0e2a\u0e27\u0e48\u0e32\u0e07\u0e08\u0e49\u0e32\u0e21\u0e32\u0e01\nconst uint32_t SETTLE_MS   = 300;            // \u0e23\u0e2d\u0e43\u0e2b\u0e49\u0e23\u0e16\u0e19\u0e34\u0e48\u0e07\u0e2b\u0e25\u0e31\u0e07\u0e2a\u0e31\u0e0d\u0e0d\u0e32\u0e13\u0e08\u0e32\u0e01\u0e40\u0e0b\u0e47\u0e19\u0e40\u0e0b\u0e2d\u0e23\u0e4c (DevKit \u0e23\u0e2d\u0e43\u0e2b\u0e49\u0e41\u0e25\u0e49\u0e27 \u0e08\u0e36\u0e07\u0e2a\u0e31\u0e49\u0e19\u0e44\u0e14\u0e49)\nconst uint32_t COOLDOWN_MS = 8000;           // \u0e1e\u0e31\u0e01\u0e2b\u0e25\u0e31\u0e07\u0e2d\u0e48\u0e32\u0e19\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19\u0e41\u0e15\u0e48\u0e25\u0e30\u0e04\u0e23\u0e31\u0e49\u0e07 (\u0e01\u0e31\u0e19\u0e2a\u0e48\u0e07\u0e23\u0e16\u0e04\u0e31\u0e19\u0e40\u0e14\u0e34\u0e21\u0e0b\u0e49\u0e33)\n\nconst bool     PREVIEW_ENABLED     = true;   // \u0e2a\u0e48\u0e07\u0e20\u0e32\u0e1e\u0e15\u0e31\u0e27\u0e2d\u0e22\u0e48\u0e32\u0e07\u0e40\u0e02\u0e49\u0e32\u0e40\u0e27\u0e47\u0e1a (\u0e1b\u0e38\u0e48\u0e21 \u0e14\u0e39\u0e20\u0e32\u0e1e\u0e2a\u0e14)\nconst uint32_t WATCH_INTERVAL_MS   = 250;    // \u0e0a\u0e48\u0e27\u0e07\u0e1e\u0e31\u0e01\u0e23\u0e30\u0e2b\u0e27\u0e48\u0e32\u0e07\u0e20\u0e32\u0e1e\u0e15\u0e2d\u0e19\u0e21\u0e35\u0e04\u0e19\u0e40\u0e1b\u0e34\u0e14\u0e14\u0e39 (ms) \u2014 \u0e04\u0e27\u0e32\u0e21\u0e40\u0e23\u0e47\u0e27\u0e08\u0e23\u0e34\u0e07\u0e02\u0e36\u0e49\u0e19\u0e01\u0e31\u0e1a\u0e2d\u0e34\u0e19\u0e40\u0e17\u0e2d\u0e23\u0e4c\u0e40\u0e19\u0e47\u0e15 \u0e1b\u0e01\u0e15\u0e34 2\u20134 \u0e20\u0e32\u0e1e/\u0e27\u0e34\u0e19\u0e32\u0e17\u0e35\n\nconst framesize_t FRAME_SIZE       = FRAMESIZE_VGA;  // VGA 640x480 (\u0e25\u0e2d\u0e07 FRAMESIZE_SVGA \u0e44\u0e14\u0e49\u0e16\u0e49\u0e32\u0e15\u0e49\u0e2d\u0e07\u0e01\u0e32\u0e23\u0e20\u0e32\u0e1e\u0e25\u0e30\u0e40\u0e2d\u0e35\u0e22\u0e14\u0e02\u0e36\u0e49\u0e19)\nconst uint8_t  JPEG_QUALITY        = 80;     // \u0e04\u0e38\u0e13\u0e20\u0e32\u0e1e JPEG \u0e02\u0e2d\u0e07 OCR / \u0e20\u0e32\u0e1e\u0e19\u0e34\u0e48\u0e07 (0-100)\nconst uint8_t  PREVIEW_JPEG_QUALITY = 55;    // \u0e20\u0e32\u0e1e\u0e2a\u0e14\u0e43\u0e19\u0e40\u0e27\u0e47\u0e1a (\u0e43\u0e0a\u0e49\u0e04\u0e48\u0e32\u0e19\u0e35\u0e49\u0e41\u0e04\u0e48\u0e15\u0e2d\u0e19\u0e15\u0e49\u0e2d\u0e07\u0e41\u0e1b\u0e25\u0e07 RGB565) \u00b7 \u0e42\u0e2b\u0e21\u0e14 JPEG \u0e43\u0e19\u0e15\u0e31\u0e27\u0e43\u0e0a\u0e49 PREVIEW_SENSOR_Q\nconst int      PREVIEW_SENSOR_Q    = 20;     // \u0e04\u0e38\u0e13\u0e20\u0e32\u0e1e\u0e20\u0e32\u0e1e\u0e2a\u0e14 (\u0e40\u0e25\u0e02\u0e19\u0e49\u0e2d\u0e22 = \u0e04\u0e21\u0e02\u0e36\u0e49\u0e19\u0e41\u0e15\u0e48\u0e44\u0e1f\u0e25\u0e4c\u0e43\u0e2b\u0e0d\u0e48/\u0e0a\u0e49\u0e32\u0e25\u0e07 \u00b7 10\u201330)\nconst framesize_t PREVIEW_SIZE     = FRAMESIZE_VGA;   // \u0e20\u0e32\u0e1e\u0e2a\u0e14\u0e43\u0e19\u0e40\u0e27\u0e47\u0e1a 640x480\nconst framesize_t OCR_SIZE         = FRAMESIZE_SXGA;  // \u0e20\u0e32\u0e1e\u0e2d\u0e48\u0e32\u0e19\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19 1280x1024 (\u0e04\u0e21\u0e0a\u0e31\u0e14\u0e01\u0e27\u0e48\u0e32\u0e21\u0e32\u0e01)\nconst int      OCR_SENSOR_Q        = 12;     // \u0e20\u0e32\u0e1e\u0e2d\u0e48\u0e32\u0e19\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19\u0e43\u0e2b\u0e49\u0e04\u0e21\u0e0a\u0e31\u0e14 (\u0e40\u0e25\u0e02\u0e19\u0e49\u0e2d\u0e22 = \u0e04\u0e21\u0e02\u0e36\u0e49\u0e19)\nconst bool     FLIP_VERTICAL       = false;  // \u0e20\u0e32\u0e1e\u0e01\u0e25\u0e31\u0e1a\u0e2b\u0e31\u0e27 -> true\nconst bool     MIRROR_HORIZONTAL   = false;  // \u0e20\u0e32\u0e1e\u0e01\u0e25\u0e31\u0e1a\u0e0b\u0e49\u0e32\u0e22\u0e02\u0e27\u0e32 -> true\n// ===============================================================================\n\n// AI Thinker pins\n#define PWDN_GPIO_NUM   32\n#define RESET_GPIO_NUM  -1\n#define XCLK_GPIO_NUM    0\n#define SIOD_GPIO_NUM   26\n#define SIOC_GPIO_NUM   27\n#define Y9_GPIO_NUM     35\n#define Y8_GPIO_NUM     34\n#define Y7_GPIO_NUM     39\n#define Y6_GPIO_NUM     36\n#define Y5_GPIO_NUM     21\n#define Y4_GPIO_NUM     19\n#define Y3_GPIO_NUM     18\n#define Y2_GPIO_NUM      5\n#define VSYNC_GPIO_NUM  25\n#define HREF_GPIO_NUM   23\n#define PCLK_GPIO_NUM   22\n\n#define LED_RED_PIN     33   // \u0e44\u0e1f\u0e41\u0e14\u0e07\u0e2b\u0e25\u0e31\u0e07\u0e1a\u0e2d\u0e23\u0e4c\u0e14 (active LOW)\n#define LED_FLASH_PIN    4   // \u0e41\u0e1f\u0e25\u0e0a\u0e02\u0e32\u0e27 (\u0e1b\u0e34\u0e14\u0e44\u0e27\u0e49)\n\nstatic bool nativeJpeg = false;\nstatic int  sensorQ = 12;\nstatic framesize_t curSize = FRAMESIZE_VGA;\nWebServer server(80);\n\n// ---------- LED ----------\nstatic void blinkRed(int times) {\n  for (int i = 0; i < times; i++) {\n    digitalWrite(LED_RED_PIN, LOW);\n    delay(120);\n    digitalWrite(LED_RED_PIN, HIGH);\n    delay(180);\n  }\n}\n\n// ---------- Camera ----------\nstatic camera_config_t makeConfig(pixformat_t fmt, uint32_t xclk = 20000000) {\n  camera_config_t c = {};\n  c.ledc_channel = LEDC_CHANNEL_0;\n  c.ledc_timer   = LEDC_TIMER_0;\n  c.pin_d0 = Y2_GPIO_NUM;  c.pin_d1 = Y3_GPIO_NUM;\n  c.pin_d2 = Y4_GPIO_NUM;  c.pin_d3 = Y5_GPIO_NUM;\n  c.pin_d4 = Y6_GPIO_NUM;  c.pin_d5 = Y7_GPIO_NUM;\n  c.pin_d6 = Y8_GPIO_NUM;  c.pin_d7 = Y9_GPIO_NUM;\n  c.pin_xclk  = XCLK_GPIO_NUM;\n  c.pin_pclk  = PCLK_GPIO_NUM;\n  c.pin_vsync = VSYNC_GPIO_NUM;\n  c.pin_href  = HREF_GPIO_NUM;\n  c.pin_sccb_sda = SIOD_GPIO_NUM;\n  c.pin_sccb_scl = SIOC_GPIO_NUM;\n  c.pin_pwdn  = PWDN_GPIO_NUM;\n  c.pin_reset = RESET_GPIO_NUM;\n  c.xclk_freq_hz = xclk;\n  c.pixel_format = fmt;\n  c.grab_mode    = CAMERA_GRAB_LATEST;\n  c.fb_count     = 1;\n\n  if (psramFound()) {\n    c.fb_location  = CAMERA_FB_IN_PSRAM;\n    c.frame_size   = (fmt == PIXFORMAT_JPEG) ? OCR_SIZE : FRAME_SIZE;   // JPEG: \u0e40\u0e1b\u0e34\u0e14\u0e17\u0e35\u0e48\u0e02\u0e19\u0e32\u0e14\u0e43\u0e2b\u0e0d\u0e48\u0e2a\u0e38\u0e14 \u0e41\u0e25\u0e49\u0e27\u0e25\u0e14\u0e25\u0e07\u0e44\u0e14\u0e49\u0e15\u0e32\u0e21\u0e15\u0e49\u0e2d\u0e07\u0e01\u0e32\u0e23\n    c.jpeg_quality = 12;\n  } else {\n    c.fb_location  = CAMERA_FB_IN_DRAM;\n    c.frame_size   = FRAMESIZE_QVGA;\n    c.jpeg_quality = 15;\n  }\n  return c;\n}\n\nstatic bool initCamera() {\n  // \u0e25\u0e2d\u0e07\u0e2b\u0e25\u0e32\u0e22\u0e41\u0e1a\u0e1a: JPEG 20MHz \u2192 JPEG 10MHz (\u0e2a\u0e32\u0e22\u0e41\u0e1e/\u0e44\u0e1f\u0e44\u0e21\u0e48\u0e19\u0e34\u0e48\u0e07) \u2192 RGB565 (\u0e40\u0e0b\u0e19\u0e40\u0e0b\u0e2d\u0e23\u0e4c\u0e17\u0e35\u0e48\u0e44\u0e21\u0e48\u0e23\u0e2d\u0e07\u0e23\u0e31\u0e1a JPEG)\n  const uint32_t clks[2] = {20000000, 10000000};\n  bool ok = false;\n  for (int i = 0; i < 2 && !ok; i++) {\n    camera_config_t cfg = makeConfig(PIXFORMAT_JPEG, clks[i]);\n    esp_err_t err = esp_camera_init(&cfg);\n    if (err == ESP_OK) { ok = true; nativeJpeg = true; Serial.printf(\"camera: JPEG mode OK (%d MHz)\\n\", (int)(clks[i] / 1000000)); }\n    else { Serial.printf(\"camera: JPEG init failed 0x%x (%d MHz)\\n\", (unsigned)err, (int)(clks[i] / 1000000)); esp_camera_deinit(); delay(300); }\n  }\n  if (!ok) {\n    camera_config_t cfg = makeConfig(PIXFORMAT_RGB565, 10000000);\n    esp_err_t err = esp_camera_init(&cfg);\n    if (err != ESP_OK) {\n      Serial.printf(\"camera: RGB565 init failed 0x%x  (0x105 = \u0e44\u0e21\u0e48\u0e1e\u0e1a\u0e01\u0e25\u0e49\u0e2d\u0e07 \u0e15\u0e23\u0e27\u0e08\u0e2a\u0e32\u0e22\u0e41\u0e1e \u00b7 0x101/0x20001 = \u0e2b\u0e19\u0e48\u0e27\u0e22\u0e04\u0e27\u0e32\u0e21\u0e08\u0e33)\\n\", (unsigned)err);\n      return false;\n    }\n    nativeJpeg = false;\n    Serial.println(\"camera: RGB565 mode OK (software JPEG)\");\n  }\n\n  sensor_t* s = esp_camera_sensor_get();\n  if (s && nativeJpeg && psramFound()) { s->set_framesize(s, PREVIEW_SIZE); curSize = PREVIEW_SIZE; s->set_quality(s, PREVIEW_SENSOR_Q); sensorQ = PREVIEW_SENSOR_Q; }\n  if (s) {\n    Serial.printf(\"camera: sensor PID=0x%04x\\n\", s->id.PID);\n    s->set_vflip(s, FLIP_VERTICAL ? 1 : 0);\n    s->set_hmirror(s, MIRROR_HORIZONTAL ? 1 : 0);\n  }\n\n  for (int i = 0; i < 5; i++) {   // \u0e17\u0e34\u0e49\u0e07\u0e40\u0e1f\u0e23\u0e21\u0e41\u0e23\u0e01 \u0e46 \u0e43\u0e2b\u0e49\u0e41\u0e2a\u0e07\u0e19\u0e34\u0e48\u0e07\n    camera_fb_t* fb = esp_camera_fb_get();\n    if (fb) esp_camera_fb_return(fb);\n    delay(100);\n  }\n  return true;\n}\n\n// \u0e16\u0e48\u0e32\u0e22 1 \u0e23\u0e39\u0e1b -> JPEG buffer (\u0e15\u0e49\u0e2d\u0e07 free() \u0e40\u0e21\u0e37\u0e48\u0e2d needFree = true)\nstatic bool captureJpeg(uint8_t** out, size_t* outLen, bool* needFree, uint8_t quality) {\n  *out = nullptr; *outLen = 0; *needFree = false;\n\n  if (nativeJpeg && psramFound()) {   // \u0e20\u0e32\u0e1e\u0e2a\u0e14 = VGA \u0e1a\u0e35\u0e1a\u0e1e\u0e2d\u0e14\u0e35 \u00b7 \u0e20\u0e32\u0e1e\u0e2d\u0e48\u0e32\u0e19\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19 = SXGA \u0e04\u0e21\u0e0a\u0e31\u0e14\n    bool ocrShot = quality > PREVIEW_JPEG_QUALITY;\n    framesize_t wantS = ocrShot ? OCR_SIZE : PREVIEW_SIZE;\n    int wantQ = ocrShot ? OCR_SENSOR_Q : PREVIEW_SENSOR_Q;\n    sensor_t* sn = esp_camera_sensor_get();\n    if (sn && (wantS != curSize || wantQ != sensorQ)) {\n      if (wantS != curSize) { sn->set_framesize(sn, wantS); curSize = wantS; }\n      if (wantQ != sensorQ) { sn->set_quality(sn, wantQ); sensorQ = wantQ; }\n      for (int i = 0; i < 3; i++) { camera_fb_t* d = esp_camera_fb_get(); if (d) esp_camera_fb_return(d); delay(30); }\n    }\n  }\n  camera_fb_t* fb = esp_camera_fb_get();\n  if (!fb) {\n    Serial.println(\"capture: esp_camera_fb_get() failed\");\n    return false;\n  }\n\n  if (nativeJpeg && fb->format == PIXFORMAT_JPEG) {\n    uint8_t* copy = (uint8_t*)malloc(fb->len);\n    if (!copy) { esp_camera_fb_return(fb); return false; }\n    memcpy(copy, fb->buf, fb->len);\n    *out = copy; *outLen = fb->len; *needFree = true;\n    esp_camera_fb_return(fb);\n    return true;\n  }\n\n  uint8_t* jpg = nullptr;\n  size_t jpgLen = 0;\n  bool ok = fmt2jpg(fb->buf, fb->len, fb->width, fb->height,\n                    fb->format, quality, &jpg, &jpgLen);\n  esp_camera_fb_return(fb);\n\n  if (!ok || !jpg || jpgLen == 0) {\n    Serial.println(\"capture: software JPEG convert failed\");\n    if (jpg) free(jpg);\n    return false;\n  }\n  *out = jpg; *outLen = jpgLen; *needFree = true;\n  return true;\n}\n\n// ---------- Wi-Fi ----------\nstatic bool connectWiFi(uint32_t timeoutMs = 20000) {\n  if (WiFi.status() == WL_CONNECTED) return true;\n  Serial.printf(\"wifi: connecting to %s \", WIFI_SSID);\n  WiFi.mode(WIFI_STA);\n  WiFi.persistent(false);\n  WiFi.setAutoReconnect(true);\n  WiFi.setSleep(false);            // \u0e25\u0e14\u0e2d\u0e32\u0e01\u0e32\u0e23\u0e20\u0e32\u0e1e\u0e01\u0e23\u0e30\u0e15\u0e38\u0e01\n  WiFi.setTxPower(WIFI_POWER_19_5dBm);\n  WiFi.begin(WIFI_SSID, WIFI_PASSWORD);\n  uint32_t t0 = millis();\n  while (WiFi.status() != WL_CONNECTED && millis() - t0 < timeoutMs) {\n    delay(500);\n    Serial.print(\".\");\n  }\n  Serial.println();\n  if (WiFi.status() == WL_CONNECTED) {\n    Serial.print(\"wifi: connected, IP = \");\n    Serial.println(WiFi.localIP());\n    return true;\n  }\n  Serial.println(\"wifi: connect failed\");\n  return false;\n}\n\n// ---------- \u0e2b\u0e19\u0e49\u0e32\u0e40\u0e27\u0e47\u0e1a\u0e1a\u0e19\u0e15\u0e31\u0e27\u0e01\u0e25\u0e49\u0e2d\u0e07 ----------\nstatic void handleRoot() {\n  String html =\n    \"<!doctype html><html><head><meta charset='utf-8'>\"\n    \"<meta name='viewport' content='width=device-width,initial-scale=1'>\"\n    \"<title>DockSense CAM<\/title>\"\n    \"<style>body{margin:0;background:#0b1220;color:#e6edf7;font-family:sans-serif;text-align:center}\"\n    \"img{max-width:100%;height:auto;margin-top:12px;border-radius:8px}\"\n    \"a{color:#4fd1c5;margin:0 8px}<\/style><\/head><body>\"\n    \"<h3>DockSense CAM - \u0e20\u0e32\u0e1e\u0e2a\u0e14<\/h3>\"\n    \"<img src='/stream'><br><p><a href='/jpg'>\u0e20\u0e32\u0e1e\u0e19\u0e34\u0e48\u0e07<\/a><\/p>\"\n    \"<\/body><\/html>\";\n  server.send(200, \"text/html; charset=utf-8\", html);\n}\n\nstatic void handleJpg() {\n  uint8_t* jpg; size_t len; bool nf;\n  if (!captureJpeg(&jpg, &len, &nf, JPEG_QUALITY)) {\n    server.send(503, \"text/plain\", \"capture failed\");\n    return;\n  }\n  WiFiClient client = server.client();\n  client.printf(\"HTTP/1.1 200 OK\\r\\nContent-Type: image/jpeg\\r\\n\"\n                \"Content-Length: %u\\r\\nCache-Control: no-cache\\r\\nConnection: close\\r\\n\\r\\n\",\n                (unsigned)len);\n  client.write(jpg, len);\n  if (nf) free(jpg);\n}\n\nstatic void handleStream() {\n  WiFiClient client = server.client();\n  client.print(\"HTTP/1.1 200 OK\\r\\n\"\n               \"Content-Type: multipart/x-mixed-replace; boundary=frame\\r\\n\"\n               \"Cache-Control: no-cache\\r\\nConnection: close\\r\\n\\r\\n\");\n  int fails = 0;\n  while (client.connected()) {\n    uint8_t* jpg; size_t len; bool nf;\n    if (!captureJpeg(&jpg, &len, &nf, PREVIEW_JPEG_QUALITY)) {\n      if (++fails >= 10) break;\n      delay(100);\n      continue;\n    }\n    fails = 0;\n    client.printf(\"--frame\\r\\nContent-Type: image/jpeg\\r\\nContent-Length: %u\\r\\n\\r\\n\", (unsigned)len);\n    client.write(jpg, len);\n    client.print(\"\\r\\n\");\n    if (nf) free(jpg);\n    delay(1);\n  }\n}\n\n// ---------- \u0e2a\u0e48\u0e07\u0e02\u0e36\u0e49\u0e19\u0e40\u0e0b\u0e34\u0e23\u0e4c\u0e1f\u0e40\u0e27\u0e2d\u0e23\u0e4c ----------\n// \u0e43\u0e0a\u0e49\u0e01\u0e32\u0e23\u0e40\u0e0a\u0e37\u0e48\u0e2d\u0e21\u0e15\u0e48\u0e2d HTTPS \u0e04\u0e49\u0e32\u0e07\u0e44\u0e27\u0e49 (keep-alive) \u0e44\u0e21\u0e48\u0e15\u0e49\u0e2d\u0e07\u0e08\u0e31\u0e1a\u0e21\u0e37\u0e2d TLS \u0e43\u0e2b\u0e21\u0e48\u0e17\u0e38\u0e01\u0e04\u0e23\u0e31\u0e49\u0e07 -> \u0e25\u0e14\u0e2b\u0e19\u0e48\u0e27\u0e07\u0e21\u0e32\u0e01\nstatic WiFiClientSecure secureClient;\nstatic HTTPClient       httpc;\nstatic bool             secureReady = false;\n\n// preview = true  -> \u0e2a\u0e48\u0e07\u0e44\u0e1b ?preview=1 (\u0e40\u0e01\u0e47\u0e1a\u0e40\u0e1b\u0e47\u0e19 latest.jpg \u0e44\u0e21\u0e48\u0e1c\u0e48\u0e32\u0e19 OCR)\n// preview = false -> \u0e2a\u0e48\u0e07\u0e2d\u0e48\u0e32\u0e19\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19 (OCR)\n// nextMs: \u0e04\u0e48\u0e32\u0e17\u0e35\u0e48\u0e40\u0e0b\u0e34\u0e23\u0e4c\u0e1f\u0e40\u0e27\u0e2d\u0e23\u0e4c\u0e1a\u0e2d\u0e01\u0e43\u0e2b\u0e49\u0e23\u0e2d (\u0e16\u0e49\u0e32\u0e21\u0e35\u0e04\u0e19\u0e14\u0e39\u0e2d\u0e22\u0e39\u0e48 \u0e08\u0e30\u0e16\u0e39\u0e01\u0e41\u0e17\u0e19\u0e14\u0e49\u0e27\u0e22 WATCH_INTERVAL_MS)\nstatic bool serverWantsSnap = false, serverRecognized = false;   // \u0e04\u0e33\u0e15\u0e2d\u0e1a\u0e25\u0e48\u0e32\u0e2a\u0e38\u0e14\u0e08\u0e32\u0e01\u0e40\u0e0b\u0e34\u0e23\u0e4c\u0e1f\u0e40\u0e27\u0e2d\u0e23\u0e4c\nstatic bool postJpeg(const uint8_t* data, size_t len, bool preview, uint32_t* nextMs, bool hd = false) {\n  if (!secureReady) {\n    secureClient.setInsecure();\n    secureClient.setTimeout(10);\n    secureReady = true;\n  }\n\n  String url = String(INGEST_URL) + (preview ? (hd ? \"?preview=1&hd=1\" : \"?preview=1\") : \"\");\n  httpc.setReuse(true);\n  httpc.setConnectTimeout(6000);\n  httpc.setTimeout(preview ? 8000 : 30000);\n  if (!httpc.begin(secureClient, url)) { secureClient.stop(); return false; }\n  httpc.addHeader(\"Content-Type\", \"image/jpeg\");\n  httpc.addHeader(\"x-device-key\", DEVICE_KEY);\n  if (preview) httpc.addHeader(\"x-local-ip\", WiFi.localIP().toString());   // \u0e43\u0e2b\u0e49\u0e2b\u0e19\u0e49\u0e32\u0e40\u0e27\u0e47\u0e1a\u0e21\u0e35\u0e25\u0e34\u0e07\u0e01\u0e4c\u0e14\u0e39\u0e41\u0e1a\u0e1a\u0e25\u0e37\u0e48\u0e19\u0e43\u0e19\u0e27\u0e07 Wi-Fi \u0e40\u0e14\u0e35\u0e22\u0e27\u0e01\u0e31\u0e19\n  if (SUPABASE_ANON_KEY[0] != '\\0') {\n    httpc.addHeader(\"apikey\", SUPABASE_ANON_KEY);\n    httpc.addHeader(\"Authorization\", String(\"Bearer \") + SUPABASE_ANON_KEY);\n  }\n\n  uint32_t t0 = millis();\n  int code = httpc.POST((uint8_t*)data, len);\n  Serial.printf(\"http: %s %u bytes -> %d (%u ms)\\n\", preview ? \"preview\" : \"ocr\",\n                (unsigned)len, code, (unsigned)(millis() - t0));\n  if (code > 0) {\n    String body = httpc.getString();\n    if (preview) { if (body.indexOf(\"\\\"snap\\\":true\") >= 0) serverWantsSnap = true; }\n    else serverRecognized = (code >= 200 && code < 300 && body.indexOf(\"\\\"plate\\\":\") >= 0);\n    if (!preview || code >= 300) {\n      if (body.length() > 600) body = body.substring(0, 600);\n      Serial.println(\"http: response: \" + body);\n    }\n    if (nextMs) {\n      if (body.indexOf(\"\\\"watch\\\":true\") >= 0) {\n        *nextMs = WATCH_INTERVAL_MS;\n      } else {\n        int i = body.indexOf(\"\\\"next_ms\\\":\");\n        if (i >= 0) {\n          long v = body.substring(i + 10).toInt();\n          if (v >= 1000 && v <= 60000) *nextMs = (uint32_t)v;\n        }\n      }\n    }\n  } else {\n    Serial.printf(\"http: error: %s\\n\", httpc.errorToString(code).c_str());\n    secureClient.stop();            // \u0e1a\u0e31\u0e07\u0e04\u0e31\u0e1a\u0e40\u0e0a\u0e37\u0e48\u0e2d\u0e21\u0e15\u0e48\u0e2d\u0e43\u0e2b\u0e21\u0e48\u0e23\u0e2d\u0e1a\u0e2b\u0e19\u0e49\u0e32\n  }\n  httpc.end();\n  return code >= 200 && code < 300;\n}\n\n// \u0e02\u0e19\u0e32\u0e14\u0e44\u0e1f\u0e25\u0e4c\u0e20\u0e32\u0e1e\u0e2a\u0e14 (\u0e43\u0e0a\u0e49\u0e15\u0e23\u0e27\u0e08\u0e27\u0e48\u0e32\u0e20\u0e32\u0e1e\u0e43\u0e19\u0e01\u0e23\u0e2d\u0e1a\u0e40\u0e1b\u0e25\u0e35\u0e48\u0e22\u0e19 = \u0e21\u0e35\u0e23\u0e16\u0e40\u0e02\u0e49\u0e32\u0e21\u0e32) \u0e44\u0e21\u0e48\u0e2a\u0e48\u0e07\u0e02\u0e36\u0e49\u0e19\u0e40\u0e19\u0e47\u0e15\nstatic long probeLen() {\n  if (nativeJpeg && psramFound()) {\n    sensor_t* sn = esp_camera_sensor_get();\n    if (sn && (curSize != PREVIEW_SIZE || sensorQ != PREVIEW_SENSOR_Q)) {\n      sn->set_framesize(sn, PREVIEW_SIZE); curSize = PREVIEW_SIZE; sn->set_quality(sn, PREVIEW_SENSOR_Q); sensorQ = PREVIEW_SENSOR_Q;\n      for (int i = 0; i < 3; i++) { camera_fb_t* d = esp_camera_fb_get(); if (d) esp_camera_fb_return(d); delay(30); }\n    }\n  }\n  camera_fb_t* fb = esp_camera_fb_get();\n  if (!fb) return 0;\n  long n = (long)fb->len;\n  esp_camera_fb_return(fb);\n  return n;\n}\n\n// \u0e16\u0e48\u0e32\u0e22\u0e20\u0e32\u0e1e\u0e04\u0e21\u0e0a\u0e31\u0e14\u0e2d\u0e48\u0e32\u0e19\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19: \u0e16\u0e48\u0e32\u0e22 2 \u0e40\u0e1f\u0e23\u0e21 \u0e40\u0e25\u0e37\u0e2d\u0e01\u0e40\u0e1f\u0e23\u0e21\u0e17\u0e35\u0e48\u0e25\u0e30\u0e40\u0e2d\u0e35\u0e22\u0e14\u0e01\u0e27\u0e48\u0e32 \u00b7 \u0e2a\u0e48\u0e07\u0e44\u0e21\u0e48\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08\u0e08\u0e30\u0e25\u0e2d\u0e07\u0e43\u0e2b\u0e21\u0e48\u0e2d\u0e35\u0e01 1 \u0e04\u0e23\u0e31\u0e49\u0e07\nstatic void ocrShot() {\n  for (int attempt = 0; attempt < 2; attempt++) {\n    if (USE_FLASH) { digitalWrite(LED_FLASH_PIN, HIGH); delay(120); }\n    uint8_t *a = nullptr, *b = nullptr; size_t la = 0, lb = 0; bool fa = false, fb = false;\n    bool oka = captureJpeg(&a, &la, &fa, JPEG_QUALITY);\n    delay(150);\n    bool okb = captureJpeg(&b, &lb, &fb, JPEG_QUALITY);\n    if (USE_FLASH) digitalWrite(LED_FLASH_PIN, LOW);\n    uint8_t* best = nullptr; size_t bl = 0; bool bf = false;\n    if (oka && (!okb || la >= lb)) { best = a; bl = la; bf = fa; if (okb && fb) free(b); }\n    else if (okb) { best = b; bl = lb; bf = fb; if (oka && fa) free(a); }\n    if (!best) { blinkRed(4); continue; }\n    serverRecognized = false;\n    bool ok = postJpeg(best, bl, false, nullptr);\n    if (bf) free(best);\n    if (ok) {\n      if (serverRecognized && RESULT_PIN >= 0) { digitalWrite(RESULT_PIN, HIGH); delay(2000); digitalWrite(RESULT_PIN, LOW); }\n      blinkRed(1);\n      return;\n    }\n    blinkRed(4);\n    secureClient.stop();\n    delay(500);\n  }\n}\n\n// ---------- setup / loop ----------\nvoid setup() {\n  WRITE_PERI_REG(RTC_CNTL_BROWN_OUT_REG, 0);\n  Serial.begin(115200);\n  delay(500);\n  Serial.println(\"\\n=== DockSense CAM v5 ===\");\n\n  pinMode(LED_RED_PIN, OUTPUT);\n  digitalWrite(LED_RED_PIN, HIGH);\n  pinMode(LED_FLASH_PIN, OUTPUT);\n  digitalWrite(LED_FLASH_PIN, LOW);\n  if (PIR_PIN >= 0) pinMode(PIR_PIN, INPUT_PULLDOWN);\n  if (RESULT_PIN >= 0) { pinMode(RESULT_PIN, OUTPUT); digitalWrite(RESULT_PIN, LOW); }\n\n  Serial.printf(\"PSRAM: %s\\n\", psramFound() ? \"found\" : \"NOT FOUND (\u0e40\u0e1b\u0e34\u0e14 Tools -> PSRAM)\");\n\n  if (!initCamera()) {\n    Serial.println(\"\u0e01\u0e25\u0e49\u0e2d\u0e07\u0e40\u0e23\u0e34\u0e48\u0e21\u0e17\u0e33\u0e07\u0e32\u0e19\u0e44\u0e21\u0e48\u0e44\u0e14\u0e49 \u2014 \u0e1b\u0e34\u0e14\u0e44\u0e1f \u0e16\u0e2d\u0e14\u0e41\u0e25\u0e49\u0e27\u0e40\u0e2a\u0e35\u0e22\u0e1a\u0e2a\u0e32\u0e22\u0e41\u0e1e\u0e01\u0e25\u0e49\u0e2d\u0e07\u0e43\u0e2b\u0e49\u0e41\u0e19\u0e48\u0e19 \u0e41\u0e25\u0e49\u0e27\u0e40\u0e2a\u0e35\u0e22\u0e1a USB \u0e43\u0e2b\u0e21\u0e48 (\u0e08\u0e30\u0e25\u0e2d\u0e07\u0e43\u0e2b\u0e21\u0e48\u0e43\u0e19 5 \u0e27\u0e34\u0e19\u0e32\u0e17\u0e35)\");\n    blinkRed(3);\n    delay(5000);\n    ESP.restart();\n  }\n\n  connectWiFi();\n\n  server.on(\"/\", handleRoot);\n  server.on(\"/jpg\", handleJpg);\n  server.on(\"/stream\", handleStream);\n  server.begin();\n\n  if (WiFi.status() == WL_CONNECTED) {\n    Serial.print(\"\u0e14\u0e39\u0e20\u0e32\u0e1e\u0e2a\u0e14\u0e17\u0e35\u0e48: http://\");\n    Serial.println(WiFi.localIP());\n    blinkRed(2);   // \u0e01\u0e30\u0e1e\u0e23\u0e34\u0e1a 2 \u0e04\u0e23\u0e31\u0e49\u0e07 = \u0e01\u0e25\u0e49\u0e2d\u0e07\u0e1e\u0e23\u0e49\u0e2d\u0e21\n  }\n}\n\nvoid loop() {\n  server.handleClient();\n\n  static uint32_t lastStatus = 0;\n  if (millis() - lastStatus > 15000) {\n    lastStatus = millis();\n    if (WiFi.status() == WL_CONNECTED) {\n      Serial.printf(\"status: online, http://%s/\\n\", WiFi.localIP().toString().c_str());\n    } else {\n      Serial.println(\"status: wifi lost, reconnecting\");\n      connectWiFi(10000);\n    }\n  }\n\n  // \u0e2a\u0e48\u0e07\u0e20\u0e32\u0e1e\u0e15\u0e31\u0e27\u0e2d\u0e22\u0e48\u0e32\u0e07\u0e40\u0e02\u0e49\u0e32\u0e40\u0e27\u0e47\u0e1a (\u0e43\u0e2b\u0e49\u0e1b\u0e38\u0e48\u0e21 \"\u0e14\u0e39\u0e20\u0e32\u0e1e\u0e2a\u0e14\" \u0e17\u0e33\u0e07\u0e32\u0e19)\n  static uint32_t lastPreview = 0, previewEvery = 15000;\n  static int previewFails = 0, captureFails = 0;\n  if (PREVIEW_ENABLED && WiFi.status() == WL_CONNECTED &&\n      (lastPreview == 0 || millis() - lastPreview >= previewEvery)) {\n    lastPreview = millis();\n    uint8_t* jpg = nullptr; size_t len = 0; bool nf = false;\n    if (captureJpeg(&jpg, &len, &nf, PREVIEW_JPEG_QUALITY)) {\n      captureFails = 0;\n      bool ok = postJpeg(jpg, len, true, &previewEvery);\n      if (nf && jpg) free(jpg);\n      if (ok) {\n        previewFails = 0;\n      } else {\n        previewEvery = 5000;\n        previewFails++;\n        if (previewFails == 5) {            // \u0e40\u0e19\u0e47\u0e15/\u0e40\u0e0b\u0e34\u0e23\u0e4c\u0e1f\u0e40\u0e27\u0e2d\u0e23\u0e4c\u0e21\u0e35\u0e1b\u0e31\u0e0d\u0e2b\u0e32 -> \u0e15\u0e48\u0e2d Wi-Fi \u0e43\u0e2b\u0e21\u0e48\n          Serial.println(\"recover: reconnect wifi\");\n          secureClient.stop();\n          WiFi.disconnect();\n          delay(500);\n          connectWiFi(15000);\n        } else if (previewFails >= 20) {    // \u0e44\u0e21\u0e48\u0e2b\u0e32\u0e22\u0e08\u0e23\u0e34\u0e07 \u0e46 -> \u0e23\u0e35\u0e2a\u0e15\u0e32\u0e23\u0e4c\u0e15\n          Serial.println(\"recover: restart\");\n          delay(300);\n          ESP.restart();\n        }\n      }\n    } else {\n      previewEvery = 3000;\n      if (++captureFails >= 8) {            // \u0e01\u0e25\u0e49\u0e2d\u0e07\u0e04\u0e49\u0e32\u0e07 -> \u0e23\u0e35\u0e2a\u0e15\u0e32\u0e23\u0e4c\u0e15\n        Serial.println(\"recover: camera stuck, restart\");\n        delay(300);\n        ESP.restart();\n      }\n    }\n  }\n\n  // \u0e04\u0e19\u0e43\u0e19\u0e40\u0e27\u0e47\u0e1a\u0e01\u0e14 \u201c\u0e16\u0e48\u0e32\u0e22\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19\u201d \u2192 \u0e16\u0e48\u0e32\u0e22\u0e20\u0e32\u0e1e\u0e04\u0e21\u0e0a\u0e31\u0e14\u0e2a\u0e48\u0e07\u0e44\u0e1b\u0e43\u0e2b\u0e49\u0e17\u0e31\u0e19\u0e17\u0e35 (\u0e44\u0e21\u0e48\u0e1c\u0e48\u0e32\u0e19 AI)\n  if (serverWantsSnap && WiFi.status() == WL_CONNECTED) {\n    serverWantsSnap = false;\n    uint8_t* jpg = nullptr; size_t len = 0; bool nf = false;\n    if (captureJpeg(&jpg, &len, &nf, JPEG_QUALITY)) {\n      uint32_t dummy = 0;\n      postJpeg(jpg, len, true, &dummy, true);\n      if (nf && jpg) free(jpg);\n    }\n    lastPreview = 0;   // \u0e2a\u0e48\u0e07\u0e20\u0e32\u0e1e\u0e2a\u0e14\u0e15\u0e48\u0e2d\u0e17\u0e31\u0e19\u0e17\u0e35\n  }\n\n  // \u0e2d\u0e48\u0e32\u0e19\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19 (OCR): \u0e15\u0e32\u0e21\u0e2a\u0e31\u0e0d\u0e0d\u0e32\u0e13\u0e08\u0e32\u0e01\u0e40\u0e0b\u0e47\u0e19\u0e40\u0e0b\u0e2d\u0e23\u0e4c (DevKit+HC-SR04 / PIR) \u0e2b\u0e23\u0e37\u0e2d\u0e16\u0e48\u0e32\u0e22\u0e40\u0e2d\u0e07\u0e40\u0e21\u0e37\u0e48\u0e2d\u0e40\u0e2b\u0e47\u0e19\u0e23\u0e16\u0e40\u0e02\u0e49\u0e32\u0e01\u0e23\u0e2d\u0e1a\n  static uint32_t lastOcr = 0;\n  bool trigger = false;\n  if (PIR_PIN >= 0) {\n    if (digitalRead(PIR_PIN) == HIGH && (lastOcr == 0 || millis() - lastOcr >= COOLDOWN_MS)) {\n      uint32_t t0 = millis();\n      while (millis() - t0 < SETTLE_MS) { server.handleClient(); delay(10); }\n      trigger = true;\n    }\n  } else if (OCR_INTERVAL_MS > 0) {\n    // \u0e2d\u0e31\u0e15\u0e42\u0e19\u0e21\u0e31\u0e15\u0e34: \u0e20\u0e32\u0e1e\u0e43\u0e19\u0e01\u0e23\u0e2d\u0e1a\u0e40\u0e1b\u0e25\u0e35\u0e48\u0e22\u0e19 (\u0e23\u0e16\u0e40\u0e02\u0e49\u0e32) \u0e41\u0e25\u0e49\u0e27\u0e19\u0e34\u0e48\u0e07 ~1.5 \u0e27\u0e34\u0e19\u0e32\u0e17\u0e35 \u2192 \u0e2d\u0e48\u0e32\u0e19\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19\u0e17\u0e31\u0e19\u0e17\u0e35 \u00b7 \u0e19\u0e2d\u0e01\u0e08\u0e32\u0e01\u0e19\u0e31\u0e49\u0e19\u0e15\u0e23\u0e27\u0e08\u0e0b\u0e49\u0e33\u0e15\u0e32\u0e21\u0e23\u0e2d\u0e1a\n    static uint32_t lastChk = 0; static long base = 0; static bool changed = false; static int calm = 0;\n    if (millis() - lastChk >= 700) {\n      lastChk = millis();\n      long L = probeLen();\n      if (L > 0) {\n        if (base == 0) base = L;\n        float d = fabsf((float)(L - base)) / (float)base;\n        if (d > 0.12f) { changed = true; calm = 0; }\n        else if (changed && d < 0.06f && ++calm >= 2) { trigger = true; changed = false; calm = 0; }\n        base = (long)(base * 0.6f + L * 0.4f);\n      }\n    }\n    if (!trigger && OCR_INTERVAL_MS >= 60000 && (lastOcr == 0 || millis() - lastOcr >= OCR_INTERVAL_MS)) trigger = true;\n    if (trigger && lastOcr != 0 && millis() - lastOcr < 30000) trigger = false;   // \u0e2d\u0e48\u0e32\u0e19\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19\u0e19\u0e32\u0e19\u0e46 \u0e04\u0e23\u0e31\u0e49\u0e07: \u0e44\u0e21\u0e48\u0e16\u0e35\u0e48\u0e01\u0e27\u0e48\u0e32 30 \u0e27\u0e34\u0e19\u0e32\u0e17\u0e35 (\u0e20\u0e32\u0e1e\u0e2a\u0e14\u0e44\u0e21\u0e48\u0e01\u0e34\u0e19\u0e42\u0e04\u0e27\u0e15\u0e32 AI)\n  }\n  if (trigger && WiFi.status() == WL_CONNECTED) {\n    lastOcr = millis();\n    ocrShot();\n    lastOcr = millis();\n  }\n}\n";
const DEVKIT_SKETCH = "/*\n  DockSense DevKit \u2014 \u0e15\u0e31\u0e27\u0e04\u0e27\u0e1a\u0e04\u0e38\u0e21\u0e2b\u0e19\u0e49\u0e32\u0e1b\u0e23\u0e30\u0e15\u0e39 (ESP32 DevKit \u0e18\u0e23\u0e23\u0e21\u0e14\u0e32 \u0e44\u0e21\u0e48\u0e15\u0e49\u0e2d\u0e07\u0e43\u0e0a\u0e49 Wi-Fi)\n\n  \u0e17\u0e33\u0e2d\u0e30\u0e44\u0e23\n    1) HC-SR04 \u0e27\u0e31\u0e14\u0e23\u0e30\u0e22\u0e30\u0e23\u0e16\u0e17\u0e35\u0e48\u0e40\u0e02\u0e49\u0e32\u0e21\u0e32\u0e2b\u0e22\u0e38\u0e14\u0e2b\u0e19\u0e49\u0e32\u0e01\u0e25\u0e49\u0e2d\u0e07\n    2) \u0e1e\u0e2d\u0e23\u0e16\u0e40\u0e02\u0e49\u0e32\u0e23\u0e30\u0e22\u0e30\u0e41\u0e25\u0e30\u0e19\u0e34\u0e48\u0e07 \u2192 \u0e40\u0e1b\u0e34\u0e14\u0e23\u0e35\u0e40\u0e25\u0e22\u0e4c 1 (\u0e44\u0e1f\u0e2a\u0e48\u0e2d\u0e07\u0e1b\u0e49\u0e32\u0e22) \u2192 \u0e2a\u0e48\u0e07\u0e2a\u0e31\u0e0d\u0e0d\u0e32\u0e13\u0e2a\u0e31\u0e48\u0e07 ESP32-CAM \u0e16\u0e48\u0e32\u0e22\u0e20\u0e32\u0e1e\u0e1b\u0e49\u0e32\u0e22\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19\n    3) ESP32-CAM \u0e2d\u0e48\u0e32\u0e19\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19\u0e44\u0e14\u0e49 \u2192 \u0e2a\u0e48\u0e07\u0e2a\u0e31\u0e0d\u0e0d\u0e32\u0e13\u0e01\u0e25\u0e31\u0e1a\u0e21\u0e32 \u2192 \u0e23\u0e35\u0e40\u0e25\u0e22\u0e4c 2 \u0e17\u0e33\u0e07\u0e32\u0e19 2 \u0e27\u0e34\u0e19\u0e32\u0e17\u0e35 (\u0e44\u0e1f\u0e2a\u0e16\u0e32\u0e19\u0e30/\u0e01\u0e23\u0e34\u0e48\u0e07)\n    4) \u0e23\u0e16\u0e2d\u0e2d\u0e01\u0e44\u0e1b \u2192 \u0e1b\u0e34\u0e14\u0e44\u0e1f \u0e1e\u0e23\u0e49\u0e2d\u0e21\u0e23\u0e31\u0e1a\u0e04\u0e31\u0e19\u0e15\u0e48\u0e2d\u0e44\u0e1b\n\n  Arduino IDE: Board = \"ESP32 Dev Module\"\n\n  \u0e01\u0e32\u0e23\u0e15\u0e48\u0e2d\u0e2a\u0e32\u0e22 (GND \u0e17\u0e38\u0e01\u0e15\u0e31\u0e27\u0e15\u0e49\u0e2d\u0e07\u0e15\u0e48\u0e2d\u0e23\u0e27\u0e21\u0e01\u0e31\u0e19)\n    HC-SR04   VCC \u2192 5V(VIN)   GND \u2192 GND   TRIG \u2192 GPIO5\n              ECHO \u2192 \u0e15\u0e31\u0e27\u0e15\u0e49\u0e32\u0e19\u0e17\u0e32\u0e19 1k\u03a9 \u2192 GPIO18 \u0e41\u0e25\u0e30\u0e08\u0e32\u0e01\u0e08\u0e38\u0e14\u0e40\u0e14\u0e35\u0e22\u0e27\u0e01\u0e31\u0e19 \u2192 \u0e15\u0e31\u0e27\u0e15\u0e49\u0e32\u0e19\u0e17\u0e32\u0e19 2k\u03a9 \u2192 GND   (\u0e25\u0e14\u0e44\u0e1f 5V \u0e40\u0e1b\u0e47\u0e19 3.3V \u0e01\u0e31\u0e19\u0e1a\u0e2d\u0e23\u0e4c\u0e14\u0e1e\u0e31\u0e07)\n    \u0e23\u0e35\u0e40\u0e25\u0e22\u0e4c 2 \u0e0a\u0e48\u0e2d\u0e07  VCC \u2192 5V(VIN)   GND \u2192 GND   IN1 \u2192 GPIO26   IN2 \u2192 GPIO27\n    DevKit GPIO25 \u2192 \u0e15\u0e31\u0e27\u0e15\u0e49\u0e32\u0e19\u0e17\u0e32\u0e19 1k\u03a9 \u2192 ESP32-CAM GPIO13      (\u0e2a\u0e31\u0e48\u0e07\u0e16\u0e48\u0e32\u0e22)\n    ESP32-CAM GPIO14 \u2192 \u0e15\u0e31\u0e27\u0e15\u0e49\u0e32\u0e19\u0e17\u0e32\u0e19 1k\u03a9 \u2192 DevKit GPIO32      (\u0e41\u0e08\u0e49\u0e07\u0e1c\u0e25\u0e01\u0e25\u0e31\u0e1a)\n*/\n\n#define TRIG_PIN       5\n#define ECHO_PIN       18\n#define RELAY1_PIN     26     // \u0e44\u0e1f\u0e2a\u0e48\u0e2d\u0e07\u0e1b\u0e49\u0e32\u0e22\n#define RELAY2_PIN     27     // \u0e44\u0e1f\u0e2a\u0e16\u0e32\u0e19\u0e30 / \u0e01\u0e23\u0e34\u0e48\u0e07  (\u0e2d\u0e22\u0e48\u0e32\u0e15\u0e48\u0e2d\u0e01\u0e31\u0e1a\u0e1b\u0e23\u0e30\u0e15\u0e39/\u0e44\u0e21\u0e49\u0e01\u0e31\u0e49\u0e19\u0e42\u0e14\u0e22\u0e15\u0e23\u0e07 \u0e16\u0e49\u0e32\u0e22\u0e31\u0e07\u0e44\u0e21\u0e48\u0e44\u0e14\u0e49\u0e15\u0e23\u0e27\u0e08\u0e2a\u0e34\u0e17\u0e18\u0e34\u0e4c\u0e23\u0e16)\n#define CAM_TRIGGER_PIN 25\n#define CAM_RESULT_PIN  32\n\nconst bool RELAY_ACTIVE_LOW = true;       // \u0e23\u0e35\u0e40\u0e25\u0e22\u0e4c\u0e42\u0e21\u0e14\u0e39\u0e25\u0e2a\u0e48\u0e27\u0e19\u0e43\u0e2b\u0e0d\u0e48: \u0e2a\u0e31\u0e48\u0e07 LOW = \u0e17\u0e33\u0e07\u0e32\u0e19 \u00b7 \u0e16\u0e49\u0e32\u0e02\u0e2d\u0e07\u0e04\u0e38\u0e13\u0e01\u0e25\u0e31\u0e1a\u0e01\u0e31\u0e19 \u0e43\u0e2b\u0e49\u0e40\u0e1b\u0e25\u0e35\u0e48\u0e22\u0e19\u0e40\u0e1b\u0e47\u0e19 false\nconst int  TRIGGER_CM       = 150;        // \u0e23\u0e16\u0e40\u0e02\u0e49\u0e32\u0e43\u0e01\u0e25\u0e49\u0e01\u0e27\u0e48\u0e32\u0e19\u0e35\u0e49\u0e16\u0e36\u0e07\u0e40\u0e23\u0e34\u0e48\u0e21\u0e16\u0e48\u0e32\u0e22 (\u0e1b\u0e23\u0e31\u0e1a\u0e15\u0e32\u0e21\u0e2b\u0e19\u0e49\u0e32\u0e07\u0e32\u0e19)\nconst int  MIN_CM           = 20;         // \u0e43\u0e01\u0e25\u0e49\u0e01\u0e27\u0e48\u0e32\u0e19\u0e35\u0e49\u0e16\u0e37\u0e2d\u0e27\u0e48\u0e32\u0e40\u0e1b\u0e47\u0e19\u0e2a\u0e31\u0e0d\u0e0d\u0e32\u0e13\u0e23\u0e1a\u0e01\u0e27\u0e19\nconst uint32_t SETTLE_MS    = 800;        // \u0e23\u0e2d\u0e43\u0e2b\u0e49\u0e23\u0e16\u0e19\u0e34\u0e48\u0e07 + \u0e44\u0e1f\u0e2a\u0e48\u0e2d\u0e07\u0e1b\u0e49\u0e32\u0e22\u0e2a\u0e27\u0e48\u0e32\u0e07\u0e01\u0e48\u0e2d\u0e19\u0e2a\u0e31\u0e48\u0e07\u0e16\u0e48\u0e32\u0e22\nconst uint32_t TRIGGER_MS   = 1500;       // \u0e04\u0e27\u0e32\u0e21\u0e22\u0e32\u0e27\u0e2a\u0e31\u0e0d\u0e0d\u0e32\u0e13\u0e2a\u0e31\u0e48\u0e07\u0e16\u0e48\u0e32\u0e22\nconst uint32_t LIGHT_MAX_MS = 90000;      // \u0e44\u0e1f\u0e2a\u0e48\u0e2d\u0e07\u0e1b\u0e49\u0e32\u0e22\u0e40\u0e1b\u0e34\u0e14\u0e19\u0e32\u0e19\u0e2a\u0e38\u0e14 (\u0e01\u0e31\u0e19\u0e04\u0e49\u0e32\u0e07)\nconst bool RELAY2_ON_RECOGNIZED = true;   // \u0e23\u0e35\u0e40\u0e25\u0e22\u0e4c 2 \u0e17\u0e33\u0e07\u0e32\u0e19\u0e40\u0e21\u0e37\u0e48\u0e2d\u0e01\u0e25\u0e49\u0e2d\u0e07\u0e2d\u0e48\u0e32\u0e19\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19\u0e44\u0e14\u0e49\n\nstatic void relay(int pin, bool on) { digitalWrite(pin, (on ^ RELAY_ACTIVE_LOW) ? HIGH : LOW); }\n\nstatic float readCm() {\n  digitalWrite(TRIG_PIN, LOW); delayMicroseconds(3);\n  digitalWrite(TRIG_PIN, HIGH); delayMicroseconds(10);\n  digitalWrite(TRIG_PIN, LOW);\n  unsigned long us = pulseIn(ECHO_PIN, HIGH, 30000);   // \u0e23\u0e2d\u0e2a\u0e39\u0e07\u0e2a\u0e38\u0e14 30 ms (~5 \u0e40\u0e21\u0e15\u0e23)\n  if (us == 0) return 999;\n  return us * 0.0343f / 2.0f;\n}\nstatic float medianCm() {                                // \u0e01\u0e25\u0e32\u0e07\u0e02\u0e2d\u0e07 3 \u0e04\u0e23\u0e31\u0e49\u0e07 \u0e25\u0e14\u0e04\u0e48\u0e32\u0e40\u0e1e\u0e35\u0e49\u0e22\u0e19\n  float a = readCm(); delay(25); float b = readCm(); delay(25); float c = readCm();\n  if (a > b) { float t = a; a = b; b = t; }\n  if (b > c) { b = c; }\n  return a > b ? a : b;\n}\n\nenum State { IDLE, WAIT_LEAVE };\nState state = IDLE;\nint nearCount = 0, farCount = 0;\nuint32_t lightOnAt = 0, relay2Until = 0;\nbool lastResult = false;\n\nvoid setup() {\n  // \u0e15\u0e31\u0e49\u0e07\u0e23\u0e35\u0e40\u0e25\u0e22\u0e4c\u0e40\u0e1b\u0e47\u0e19 \"\u0e1b\u0e34\u0e14\" \u0e01\u0e48\u0e2d\u0e19\u0e2d\u0e22\u0e48\u0e32\u0e07\u0e2d\u0e37\u0e48\u0e19 \u0e01\u0e31\u0e19\u0e23\u0e35\u0e40\u0e25\u0e22\u0e4c\u0e14\u0e35\u0e14\u0e15\u0e2d\u0e19\u0e40\u0e1b\u0e34\u0e14\u0e40\u0e04\u0e23\u0e37\u0e48\u0e2d\u0e07\n  pinMode(RELAY1_PIN, OUTPUT); relay(RELAY1_PIN, false);\n  pinMode(RELAY2_PIN, OUTPUT); relay(RELAY2_PIN, false);\n  pinMode(TRIG_PIN, OUTPUT); digitalWrite(TRIG_PIN, LOW);\n  pinMode(ECHO_PIN, INPUT);\n  pinMode(CAM_TRIGGER_PIN, OUTPUT); digitalWrite(CAM_TRIGGER_PIN, LOW);\n  pinMode(CAM_RESULT_PIN, INPUT_PULLDOWN);\n  Serial.begin(115200);\n  Serial.println(\"\\n== DockSense DevKit \u0e1e\u0e23\u0e49\u0e2d\u0e21\u0e17\u0e33\u0e07\u0e32\u0e19 ==\");\n}\n\nvoid loop() {\n  float d = medianCm();\n  bool present = d >= MIN_CM && d <= TRIGGER_CM;\n\n  if (state == IDLE) {\n    nearCount = present ? nearCount + 1 : 0;\n    if (nearCount >= 3) {                                  // \u0e40\u0e08\u0e2d\u0e23\u0e16\u0e19\u0e34\u0e48\u0e07\u0e15\u0e48\u0e2d\u0e40\u0e19\u0e37\u0e48\u0e2d\u0e07 ~0.5 \u0e27\u0e34\u0e19\u0e32\u0e17\u0e35\n      Serial.printf(\"\u0e40\u0e08\u0e2d\u0e23\u0e16 \u0e23\u0e30\u0e22\u0e30 %.0f \u0e0b\u0e21. \u2192 \u0e40\u0e1b\u0e34\u0e14\u0e44\u0e1f + \u0e2a\u0e31\u0e48\u0e07\u0e01\u0e25\u0e49\u0e2d\u0e07\u0e16\u0e48\u0e32\u0e22\\n\", d);\n      relay(RELAY1_PIN, true); lightOnAt = millis();\n      delay(SETTLE_MS);\n      digitalWrite(CAM_TRIGGER_PIN, HIGH); delay(TRIGGER_MS); digitalWrite(CAM_TRIGGER_PIN, LOW);\n      state = WAIT_LEAVE; farCount = 0; nearCount = 0;\n    }\n  } else {\n    farCount = present ? 0 : farCount + 1;\n    if (farCount >= 8 || millis() - lightOnAt > LIGHT_MAX_MS) {   // \u0e23\u0e16\u0e2d\u0e2d\u0e01\u0e44\u0e1b\u0e41\u0e25\u0e49\u0e27 (~1.5 \u0e27\u0e34\u0e19\u0e32\u0e17\u0e35) \u0e2b\u0e23\u0e37\u0e2d\u0e04\u0e23\u0e1a\u0e40\u0e27\u0e25\u0e32\n      Serial.println(\"\u0e23\u0e16\u0e2d\u0e2d\u0e01\u0e41\u0e25\u0e49\u0e27 \u2192 \u0e1b\u0e34\u0e14\u0e44\u0e1f\");\n      relay(RELAY1_PIN, false); state = IDLE; farCount = 0;\n    }\n  }\n\n  // \u0e01\u0e25\u0e49\u0e2d\u0e07\u0e41\u0e08\u0e49\u0e07\u0e27\u0e48\u0e32\u0e2d\u0e48\u0e32\u0e19\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19\u0e44\u0e14\u0e49\n  bool res = digitalRead(CAM_RESULT_PIN) == HIGH;\n  if (res && !lastResult && RELAY2_ON_RECOGNIZED) { relay(RELAY2_PIN, true); relay2Until = millis() + 2000; Serial.println(\"\u0e2d\u0e48\u0e32\u0e19\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19\u0e44\u0e14\u0e49 \u2192 \u0e23\u0e35\u0e40\u0e25\u0e22\u0e4c 2\"); }\n  lastResult = res;\n  if (relay2Until && millis() > relay2Until) { relay(RELAY2_PIN, false); relay2Until = 0; }\n\n  delay(40);\n}\n";
function camSetup(d) {
  const m = DS.modal("ตั้งค่ากล้อง: " + d.name, `<p class="muted">ใส่ชื่อ Wi-Fi ที่กล้องจะใช้ แล้วดาวน์โหลดโค้ด เปิดด้วย Arduino IDE และอัปโหลดลงบอร์ด ESP32-CAM (ใส่รหัสกล้องให้แล้ว)</p>

  <details style="margin-top:14px"><summary class="muted">ดูรหัสกล้อง (ใช้ตั้งค่าเอง)</summary><label>ที่อยู่รับรูป</label><input readonly value="${esc(CAM_URL)}" onclick="this.select()"><label>รหัสกล้อง (เก็บเป็นความลับ)</label><input readonly value="${esc(d.device_key)}" onclick="this.select()"></details>
  <div class="row" style="margin-top:14px"><button class="ghost" id="cwX" type="button">ปิด</button></div>`);

  m.querySelector("#cwDl").onclick = () => {

  const ago = (t) => { if (!t) return "ยังไม่เคยส่งรูป"; const s = (Date.now() - new Date(t)) / 1000; return s < 90 ? "ส่งรูปล่าสุดเมื่อกี้" : s < 3600 ? `ส่งรูปล่าสุด ${Math.round(s / 60)} นาทีที่แล้ว` : s < 86400 ? `ส่งรูปล่าสุด ${Math.round(s / 3600)} ชั่วโมงที่แล้ว` : "ส่งรูปล่าสุด " + DS.fmt.dateTime(t); };
  card.innerHTML = `<h3>กล้อง ESP32-CAM</h3><p class="muted">กล้องถ่ายรูปรถ → ระบบอ่านทะเบียนและบันทึกในเว็บ → ส่ง Telegram พร้อมปุ่มเปิดดูข้อมูลรถ ให้เองทุกครั้ง (กล้องแจ้งทุกคัน ไม่ขึ้นกับสวิตช์บริษัท)</p>
  ${data.length ? data.map((d) => `<div class="chan" data-id="${esc(d.id)}"><div style="flex:1;min-width:0"><b class="wrapsafe">📷 ${esc(d.name)}</b><div class="muted wrapsafe">${esc(ago(d.last_seen))}${d.last_plate ? " · ล่าสุด " + esc(d.last_plate) : ""}${d.enabled ? "" : " · ปิดอยู่"}</div></div><div class="acts"><button class="ghost camSet" type="button">ตั้งค่า / โค้ดกล้อง</button><button class="ghost camTog" type="button">${d.enabled ? "ปิด" : "เปิด"}</button><button class="ghost camDel" type="button">ลบ</button></div></div>`).join("") : '<div class="empty sm">ยังไม่มีกล้อง กด “+ เพิ่มกล้อง” เพื่อรับรหัสกล้องตัวแรก</div>'}
  <div class="row" style="margin-top:10px"><button id="camAdd" type="button">+ เพิ่มกล้อง</button></div>`;
  $("#camAdd").onclick = async (ev) => {
    const name = (prompt("ตั้งชื่อกล้อง เช่น ประตูหน้า") || "").trim(); if (!name) return;
    ev.target.disabled = true; const { data: d, error: e } = await db.from("camera_devices").insert({ name }).select("*").single();
    if (e) { DS.toast(e.message, "error"); ev.target.disabled = false; return; }
    await loadCameras(); camSetup(d);
  };
  card.querySelectorAll(".chan").forEach((el) => {
    const d = data.find((r) => r.id === el.dataset.id);
    el.querySelector(".camSet").onclick = () => camSetup(d);
    el.querySelector(".camTog").onclick = async () => { const { error: e } = await db.from("camera_devices").update({ enabled: !d.enabled }).eq("id", d.id); if (e) DS.toast(e.message, "error"); else loadCameras(); };
    el.querySelector(".camDel").onclick = async () => { if (!confirm("ลบกล้องนี้? กล้องตัวนี้จะส่งรูปเข้าระบบไม่ได้อีก")) return; const { error: e } = await db.from("camera_devices").delete().eq("id", d.id); if (e) DS.toast(e.message, "error"); else loadCameras(); };
  });
}

/* ---------- settings ---------- */
async function loadSettings() {
  const roleTh = { admin: "ผู้ดูแลระบบ", staff: "เจ้าหน้าที่", viewer: "ผู้ชม" };
  $("#settings").innerHTML = `<div class="card"><h3>บัญชีของฉัน</h3>${esc(me.full_name || "")} · ${esc(me.email || "")}<div class="muted">สิทธิ์: <b>${roleTh[me.role]}</b> — ${ROLE_DESC[me.role]}</div></div>
  <div class="card"><h3>การเชื่อมต่อ AI OCR</h3><p class="muted">อ่านป้ายที่ Supabase Edge Function <code>ocr-plate</code> เพื่อไม่ให้ API Key อยู่ในหน้าเว็บ (ดูวิธี deploy ใน README.md)</p><button id="ocrTest">ทดสอบการเชื่อมต่อ</button><div id="ocrRes" style="margin-top:10px"></div></div>
  <div class="card" id="tgCard"><h3>แจ้งเตือน Telegram</h3><div class="muted">กำลังโหลด…</div></div>
  <div class="card" id="camCard"><h3>กล้อง ESP32-CAM</h3><div class="muted">กำลังโหลด…</div></div>
  <div class="card"><h3>ติดตั้งเป็นแอป</h3><p class="muted">Android: Chrome → เมนู ⋮ → "ติดตั้งแอป" · iPhone: Safari → แชร์ → "เพิ่มไปยังหน้าจอโฮม"</p></div><div id="cos"></div><div id="users"></div>`;
  loadTelegram(); loadCameras();
  $("#ocrTest").onclick = async (e) => {
    e.target.disabled = true; const out = $("#ocrRes");
    try { const p = await DS.pingOcr(); out.innerHTML = `<span class="badge ok">✓ เชื่อมต่อสำเร็จ (ผู้ให้บริการ: ${esc(p)})</span>`; }
    catch (x) { out.innerHTML = `<span class="badge bad">✗ ${x.code === "API_KEY_MISSING" ? "ยังไม่ได้ตั้งค่า ANTHROPIC_API_KEY" : x.code === "NOT_DEPLOYED" ? "ยังไม่ได้ deploy Edge Function ocr-plate" : esc(x.message)}</span>`; }
    e.target.disabled = false;
  };
  renderCompaniesCard();
  if (DS.can(me, "admin")) renderUsers();
}
async function renderUsers() {
  const [pr, st] = await Promise.all([db.from("profiles").select("*").order("created_at", { ascending: false }), db.from("app_settings").select("value").eq("key", "signup").maybeSingle()]);
  if (pr.error) return; const data = pr.data, defRole = (st.data && st.data.value && st.data.value.default_role) || "viewer", week = Date.now() - 7 * 864e5;
  $("#users").innerHTML = `<div class="card"><h3>ผู้ใช้งานและสิทธิ์</h3>
  <div class="roles">${["admin", "staff", "viewer"].map((r) => `<div><b>${ROLE_TH[r]}</b><span>${ROLE_DESC[r]}</span></div>`).join("")}</div>
  <label>สมาชิกที่สมัครใหม่ จะได้สิทธิ์</label>
  <div class="seg" id="defRole"><button type="button" data-r="viewer" class="${defRole === "viewer" ? "on" : ""}">ผู้ชม (รอผู้ดูแลอนุมัติ)</button><button type="button" data-r="staff" class="${defRole === "staff" ? "on" : ""}">เจ้าหน้าที่ (สแกนได้ทันที)</button></div>
  <p class="muted" style="margin:6px 0 0">ผู้สมัครคนแรกของระบบเป็นผู้ดูแลเสมอ</p>
  <div id="ulist">${data.map((u) => `<div class="urow" data-u="${u.id}"><div class="uinfo"><b class="wrapsafe">${esc(u.full_name || u.email || "")}</b>${u.role === "viewer" && new Date(u.created_at) > week ? '<span class="badge new">ใหม่</span>' : ""}<div class="muted wrapsafe">${esc(u.email || "")}</div></div>
    <div class="seg sm">${["admin", "staff", "viewer"].map((r) => `<button type="button" data-r="${r}" class="${r === u.role ? "on" : ""}" ${u.id === me.id ? "disabled" : ""}>${ROLE_TH[r]}</button>`).join("")}</div></div>`).join("")}</div></div>`;
  $("#defRole").querySelectorAll("button").forEach((b) => (b.onclick = async () => {
    const { error } = await db.from("app_settings").upsert({ key: "signup", value: { default_role: b.dataset.r } }); if (error) return DS.toast(error.message, "error");
    DS.toast(b.dataset.r === "staff" ? "สมาชิกใหม่จะสแกนได้ทันที" : "สมาชิกใหม่จะเป็นผู้ชมก่อน"); renderUsers();
  }));
  $("#ulist").querySelectorAll(".urow").forEach((row) => row.querySelectorAll("button").forEach((b) => (b.onclick = async () => {
    if (b.classList.contains("on")) return;
    const { error } = await db.from("profiles").update({ role: b.dataset.r }).eq("id", row.dataset.u); if (error) return DS.toast(error.message, "error");
    DS.toast("ตั้งสิทธิ์เป็น " + ROLE_TH[b.dataset.r] + " แล้ว"); renderUsers();
  })));
}
boot();
</script>
