<script>
/* DockSense AI — ส่วนที่ใช้ร่วมกัน (index.html + scan.html) */
(function () {
  const cfg = window.DS_CONFIG || {};
  const keyMissing = !cfg.SUPABASE_URL || !cfg.SUPABASE_KEY || /PASTE_/.test(cfg.SUPABASE_KEY);
  const db = supabase.createClient(cfg.SUPABASE_URL || "https://invalid.supabase.co", cfg.SUPABASE_KEY || "missing", {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
  });

  const TZ = "Asia/Bangkok";
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // ต้องตรงกับคอลัมน์ plate_norm ในฐานข้อมูล: upper(regexp_replace(plate_number, '[\s\-]', '', 'g'))
  const norm = (s) => String(s ?? "").toUpperCase().replace(/[\s\-]/g, "");

  /* ธีม */
  const applyTheme = (t) => { if (t === "dark") document.documentElement.setAttribute("data-theme", "dark"); else document.documentElement.removeAttribute("data-theme"); };
  try {
    const saved = localStorage.getItem("ds_theme");
    applyTheme(saved || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  } catch (e) {}
  const toggleTheme = () => {
    const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(t); try { localStorage.setItem("ds_theme", t); } catch (e) {}
  };

  /* วันเวลา (แสดงตามเวลาไทยเสมอ ปี ค.ศ.) */
  const mkf = (o) => new Intl.DateTimeFormat("th-TH-u-ca-gregory", { timeZone: TZ, ...o });
  const fD = mkf({ day: "numeric", month: "short", year: "numeric" }), fT = mkf({ hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
  const ok = (v) => v && !isNaN(new Date(v));
  const fmt = {
    date: (v) => (ok(v) ? fD.format(new Date(v)) : "-"),
    time: (v) => (ok(v) ? fT.format(new Date(v)) : "-"),
    dateTime: (v) => (ok(v) ? fD.format(new Date(v)) + " " + fT.format(new Date(v)) : "-"),
    ago: (v) => {
      if (!ok(v)) return "-";
      const s = Math.max(0, (Date.now() - new Date(v)) / 1000);
      if (s < 60) return "เมื่อสักครู่";
      if (s < 3600) return Math.floor(s / 60) + " นาทีที่แล้ว";
      if (s < 86400) return Math.floor(s / 3600) + " ชั่วโมงที่แล้ว";
      if (s < 604800) return Math.floor(s / 86400) + " วันที่แล้ว";
      return fD.format(new Date(v));
    },
  };

  /* toast */
  function toast(msg, type) {
    let box = document.querySelector(".toasts");
    if (!box) { box = document.createElement("div"); box.className = "toasts"; document.body.appendChild(box); }
    const t = document.createElement("div"); t.className = "toast" + (type && type !== "ok" ? " " + type : ""); t.textContent = msg; box.appendChild(t);
    setTimeout(() => t.remove(), type === "error" ? 5000 : 3000);
  }

  /* modal: คืน element .modal ที่มี .sb (เนื้อหา) — ปิดด้วย m.remove() */
  function modal(title, html) {
    const m = document.createElement("div"); m.className = "modal";
    m.innerHTML = `<div class="sheet"><div class="sh"><b>${esc(title)}</b><button class="x" aria-label="ปิด">✕</button></div><div class="sb">${html || ""}</div></div>`;
    m.addEventListener("click", (e) => { if (e.target === m) m.remove(); });
    m.querySelector(".x").onclick = () => m.remove();
    document.body.appendChild(m); return m;
  }

  /* รูปภาพใน bucket private → signed URL (แคชไว้) */
  const sc = new Map();
  async function signedUrl(path) {
    const hit = sc.get(path); if (hit && hit.exp > Date.now()) return hit.url;
    const { data, error } = await db.storage.from("plate-images").createSignedUrl(path, 3600); if (error) throw error;
    sc.set(path, { url: data.signedUrl, exp: Date.now() + 3300 * 1000 }); return data.signedUrl;
  }
  const thumb = (p) => (p ? `<img class="ph" data-p="${esc(p)}" alt="" loading="lazy">` : '<div class="ph"></div>');
  function hydrateImages(root) {
    (root || document).querySelectorAll("img[data-p]").forEach(async (img) => {
      const p = img.dataset.p; img.removeAttribute("data-p");
      try { img.src = await signedUrl(p); } catch (e) { img.style.visibility = "hidden"; }
    });
  }

  /* สิทธิ์: admin ทำได้ทุกอย่าง · staff บันทึก/แก้ไข · viewer ดูอย่างเดียว (RLS ในฐานข้อมูลบังคับอีกชั้น) */
  const can = (me, a) => !!me && (a === "read" ? true : a === "write" ? me.role === "admin" || me.role === "staff" : me.role === "admin");

  /* session + โปรไฟล์: คืน null ถ้ายังไม่ล็อกอิน, {session, profile:null} ถ้ายังไม่มีโปรไฟล์ */
  async function requireAuth() {
    const { data: { session }, error } = await db.auth.getSession();
    if (error || !session) return null;
    const { data: profile, error: pe } = await db.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
    if (pe) console.error("profiles:", pe);
    return { session, profile: profile || null };
  }

  /* OCR ผ่าน Edge Function (API key อยู่ฝั่งเซิร์ฟเวอร์เท่านั้น) */
  async function fnErr(error) {
    let code = "OCR_FAILED", msg = error.message || "เรียก OCR ไม่สำเร็จ";
    const ctx = error.context;
    if (error.name === "FunctionsHttpError" && ctx) {
      try { const j = await ctx.json(); msg = j.error || j.message || msg; code = j.code || code; } catch (e) {}
      if (ctx.status === 404) code = "NOT_DEPLOYED";
      else if (ctx.status === 401) { code = "UNAUTHORIZED"; msg = "เซสชันหมดอายุหรือไม่ได้รับอนุญาต กรุณาเข้าสู่ระบบใหม่"; }
    } else { code = "NOT_DEPLOYED"; msg = "เชื่อมต่อ Edge Function ไม่ได้ (ยังไม่ได้ deploy หรืออินเทอร์เน็ตมีปัญหา)"; }
    const e = new Error(msg); e.code = code; return e;
  }
  const b64 = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej(new Error("อ่านไฟล์ภาพไม่ได้")); r.readAsDataURL(blob); });
  async function readPlate(blob) {
    const { data, error } = await db.functions.invoke("ocr-plate", { body: { imageBase64: await b64(blob), mediaType: blob.type || "image/jpeg" } });
    if (error) throw await fnErr(error); return data;
  }
  async function pingOcr() {
    const { data, error } = await db.functions.invoke("ocr-plate", { body: { ping: true } });
    if (error) throw await fnErr(error); return data.provider;
  }

  const VEHICLE_TYPES = ["รถยนต์", "รถกระบะ", "รถบรรทุก", "รถจักรยานยนต์", "รถตู้", "อื่นๆ"];
  const PROVINCES = ["กรุงเทพมหานคร","กระบี่","กาญจนบุรี","กาฬสินธุ์","กำแพงเพชร","ขอนแก่น","จันทบุรี","ฉะเชิงเทรา","ชลบุรี","ชัยนาท","ชัยภูมิ","ชุมพร","เชียงราย","เชียงใหม่","ตรัง","ตราด","ตาก","นครนายก","นครปฐม","นครพนม","นครราชสีมา","นครศรีธรรมราช","นครสวรรค์","นนทบุรี","นราธิวาส","น่าน","บึงกาฬ","บุรีรัมย์","ปทุมธานี","ประจวบคีรีขันธ์","ปราจีนบุรี","ปัตตานี","พระนครศรีอยุธยา","พะเยา","พังงา","พัทลุง","พิจิตร","พิษณุโลก","เพชรบุรี","เพชรบูรณ์","แพร่","ภูเก็ต","มหาสารคาม","มุกดาหาร","แม่ฮ่องสอน","ยโสธร","ยะลา","ร้อยเอ็ด","ระนอง","ระยอง","ราชบุรี","ลพบุรี","ลำปาง","ลำพูน","เลย","ศรีสะเกษ","สกลนคร","สงขลา","สตูล","สมุทรปราการ","สมุทรสงคราม","สมุทรสาคร","สระแก้ว","สระบุรี","สิงห์บุรี","สุโขทัย","สุพรรณบุรี","สุราษฎร์ธานี","สุรินทร์","หนองคาย","หนองบัวลำภู","อ่างทอง","อำนาจเจริญ","อุดรธานี","อุตรดิตถ์","อุทัยธานี","อุบลราชธานี"];

  window.addEventListener("offline", () => toast("ออฟไลน์อยู่ — ตรวจสอบอินเทอร์เน็ต", "error"));
  window.addEventListener("online", () => toast("กลับมาออนไลน์แล้ว", "info"));

  window.DS = { db, esc, norm, toggleTheme, fmt, toast, modal, signedUrl, thumb, hydrateImages, can, requireAuth, readPlate, pingOcr, fnErr, VEHICLE_TYPES, PROVINCES, TZ };

  if (keyMissing) document.addEventListener("DOMContentLoaded", () => {
    const d = document.createElement("div");
    d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:200;background:#dc2626;color:#fff;padding:10px 14px;font-size:14px;text-align:center";
    d.textContent = "ยังไม่ได้ตั้งค่า SUPABASE_KEY ใน config.js — ล็อกอินและโหลดข้อมูลไม่ได้";
    document.body.appendChild(d);
  });
})();

</script>
<script>
const $ = (s) => document.querySelector(s), esc = DS.esc, db = DS.db;
let me = null, tab = "home", rows = [], total = 0, loadingMore = false;
const PAGE = 20;
const MONTHS = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const spin = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
const errBox = (m, retry) => `<div class="empty">⚠️ เกิดข้อผิดพลาด<br><span class="muted">${esc(m)}</span>${retry ? `<br><br><button class="ghost" onclick="${retry}">ลองใหม่</button>` : ""}</div>`;

/* ---------- login ---------- */
let mode = "in";
const lastEmail = () => { try { return localStorage.getItem("ds_email") || ""; } catch (e) { return ""; } };
$("#lemail").value = lastEmail();
function setMode(m) {
  mode = m; const up = m === "up";
  $("#tabIn").classList.toggle("on", !up); $("#tabUp").classList.toggle("on", up);
  $("#tabIn").setAttribute("aria-selected", String(!up)); $("#tabUp").setAttribute("aria-selected", String(up));
  $("#nameWrap").classList.toggle("hide", !up); $("#lnote").classList.toggle("hide", !up);
  $("#lbtn").textContent = up ? "สมัครและเข้าใช้งาน" : "เข้าสู่ระบบ";
  $("#lpass").autocomplete = up ? "new-password" : "current-password"; $("#lerr").classList.add("hide");
}
$("#tabIn").onclick = () => setMode("in"); $("#tabUp").onclick = () => setMode("up");
const loginErr = (m) => /invalid login/i.test(m) ? "อีเมลหรือรหัสผ่านไม่ถูกต้อง ลองอีกครั้ง หรือกด “สมัครใหม่” ถ้ายังไม่มีบัญชี"

  if (me.role !== "admin") { newViewers = 0; return; }
  const since = new Date(Date.now() - 7 * 864e5).toISOString();
  const { count } = await db.from("profiles").select("id", { count: "exact", head: true }).eq("role", "viewer").gte("created_at", since);
  newViewers = count || 0;
}

/* ---------- boot / tabs ---------- */
async function boot() {
  const a = await DS.requireAuth();
  if (!a) { $("#login").classList.remove("hide"); $("#app").classList.add("hide"); return; }
  if (!a.profile) { $("#app").classList.add("hide"); $("#login").classList.remove("hide"); $("#lerr").textContent = "ไม่พบโปรไฟล์ผู้ใช้ กรุณาออกจากระบบแล้วเข้าใหม่"; $("#lerr").classList.remove("hide"); await db.auth.signOut(); return; }
  me = a.profile; $("#login").classList.add("hide"); $("#app").classList.remove("hide");
  $("#fab").classList.toggle("hide", !DS.can(me, "write"));
  $("#provs").innerHTML = DS.PROVINCES.map((p) => `<option value="${p}">`).join("");
  $("#fm").innerHTML += MONTHS.map((m, i) => `<option value="${i + 1}">${m}</option>`).join("");
  const y = new Date().getFullYear(); $("#fy").innerHTML += [0,1,2,3,4,5].map((i) => `<option>${y - i}</option>`).join("");
  await countNewViewers(); loadCompanies(); go("home"); openFromHash(); welcomeSheet();
  window.addEventListener("hashchange", openFromHash);
  let t; db.channel("rt").on("postgres_changes", { event: "*", schema: "public", table: "vehicle_logs" }, () => { clearTimeout(t); t = setTimeout(() => reload(), 400); }).subscribe();
}
// ลิงก์จาก Telegram: #v=<รหัสรถ> เปิดรายละเอียดรถ · #t=history|search|set เปิดแท็บ
function openFromHash() {
  const m = location.hash.match(/^#(v|t)=([\w-]+)$/); if (!m) return;
  history.replaceState(null, "", location.pathname + location.search);
  if (m[1] === "t" && ["home", "history", "search", "set"].includes(m[2])) go(m[2]);
  else if (m[1] === "v" && /^[0-9a-f-]{36}$/i.test(m[2])) openVehicle(m[2]);
}
document.querySelectorAll("nav.tabs button").forEach((b) => (b.onclick = () => go(b.dataset.t)));
function go(t) {
  tab = t; document.querySelectorAll("nav.tabs button").forEach((b) => b.classList.toggle("on", b.dataset.t === t));
  ["home", "history", "search", "set"].forEach((x) => $("#t-" + x).classList.toggle("hide", x !== t)); reload();
}
function reload() { ({ home: loadHome, history: () => loadHistory(true), search: loadSearch, set: loadSettings })[tab](); }

/* ---------- home ---------- */
function bars(data, color) {
  const max = Math.max(1, ...data.map((d) => d.count)), step = Math.ceil(data.length / 6) || 1;
  return `<div class="bars">${data.map((d) => `<div class="bar" title="${esc(d.label)}: ${d.count} คัน"><i style="height:${(d.count / max) * 100}%"></i></div>`).join("")}</div><div class="axis">${data.map((d, i) => `<span>${i % step === 0 ? esc(d.label) : ""}</span>`).join("")}</div>`;
}

  const [s, r, cs] = await Promise.all([db.rpc("dashboard_stats"), db.from("visit_details").select("*").order("capture_at", { ascending: false }).limit(8), db.from("camera_status").select("*").eq("enabled", true).order("name")]);

  <div class="card"><div class="row sp" style="align-items:baseline"><h3>รายการล่าสุด</h3><a href="#" id="seeAll" style="flex:none">ดูทั้งหมด</a></div>${r.data.length ? r.data.map(itemHtml).join("") : '<div class="empty">ยังไม่มีรายการ<br>กดปุ่ม “สแกนทะเบียน” เพื่อบันทึกคันแรก</div>'}</div>
  <div class="card"><h3>จำนวนรถรายวัน (30 วัน)</h3>${bars(d.daily)}</div>
  <div class="card"><h3>รายเดือน (12 เดือน)</h3>${bars(d.monthly)}</div>

/* ---------- บริษัท / โลโก้ ---------- */
let companies = [];
const NEW_CO = "__new";
const PALETTE = ["#0d9488", "#6366f1", "#f59e0b", "#ef4444", "#0ea5e9", "#8b5cf6", "#10b981", "#ec4899", "#f97316", "#64748b"];
// สีแบรนด์ที่ admin ตั้งไว้ · ถ้าไม่ตั้ง ระบบสุ่มสีคงที่จากชื่อบริษัท (ไม่เดาสีแบรนด์จริง) เพื่อให้แต่ละบริษัทแยกกันได้ง่าย
const coColor = (c) => /^#[0-9a-fA-F]{6}$/.test((c && c.brand_color) || "") ? c.brand_color
  : PALETTE[Array.from(String((c && c.company_name) || "")).reduce((h, ch) => (h * 31 + ch.codePointAt(0)) >>> 0, 7) % PALETTE.length];
const logoSrc = (p) => db.storage.from("company-logos").getPublicUrl(p).data.publicUrl;
function coMark(c, sz) {
  sz = sz || 36;
  const col = coColor(c), ch = Array.from(String(c.company_name || "").trim())[0] || "?", ini = /[\p{L}\p{N}]/u.test(ch) ? esc(ch.toUpperCase()) : "?";
  const box = `width:${sz}px;height:${sz}px`;
  const fb = `<div class="ini" style="${box};background:${col};font-size:${Math.round(sz * 0.45)}px">${ini}</div>`;
  if (!c.logo_url) return fb;
  return `<img class="lg" style="${box}" src="${esc(logoSrc(c.logo_url))}" alt="" loading="lazy" data-fb="${esc(fb)}" onerror="this.outerHTML=this.dataset.fb">`;
}
const coChip = (c, sz) => (c && (c.company_id || c.id || c.company_name))
  ? `<div class="co" style="border-left:4px solid ${coColor(c)};padding-left:8px">${coMark(c, sz || 28)}<span class="nm">${esc(c.company_name)}</span></div>`
  : '<span class="badge warn">ไม่ระบุบริษัท</span>';
const ST = { matched: ["รู้จัก", "ok"], verified: ["ตรวจสอบแล้ว", "ok"], new_vehicle: ["รถใหม่", ""], needs_review: ["ต้องตรวจสอบ", "warn"], unmatched: ["ยังไม่จับคู่", "warn"], legacy: ["ข้อมูลเดิม", ""] };
const stBadge = (s) => { const x = ST[s] || [s || "-", ""]; return `<span class="badge ${x[1]}" style="flex:none">${esc(x[0])}</span>`; };
async function loadCompanies() {
  const { data, error } = await db.from("companies").select("id,company_name,logo_url,brand_color,notify_telegram").order("company_name");
  if (!error) companies = data;
  const cur = $("#fco").value;
  $("#fco").innerHTML = '<option value="">ทั้งหมด</option>' + companies.map((c) => `<option value="${esc(c.id)}">${esc(c.company_name)}</option>`).join("");

}
const coOptions = (sel) => `<option value="">ไม่ระบุบริษัท</option>${companies.map((c) => `<option value="${esc(c.id)}" ${c.id === sel ? "selected" : ""}>${esc(c.company_name)}</option>`).join("")}<option value="${NEW_CO}">➕ เพิ่มบริษัทใหม่…</option>`;

function itemHtml(l) {
  const co = l.company_id ? `<div style="margin-top:4px">${coChip(l, 26)}</div>` : l.vehicle_id ? '<div style="margin-top:4px"><span class="badge warn">ไม่ระบุบริษัท</span></div>' : "";

/* ---------- รายละเอียดรถ (ทุกการเข้าของรถคันเดียวกัน) ---------- */
async function openVehicle(id) {
  const m = DS.modal("รายละเอียดรถ", spin), body = m.querySelector(".sb");
  const [v, h] = await Promise.all([
    db.from("vehicles").select("id,license_plate,province,vehicle_type,notes,company_id,created_at,companies(id,company_name,logo_url,brand_color)").eq("id", id).maybeSingle(),
    db.from("visit_details").select("*", { count: "exact" }).eq("vehicle_id", id).order("capture_at", { ascending: false }).limit(100)]);
  if (v.error || h.error || !v.data) { body.innerHTML = errBox((v.error || h.error || { message: "ไม่พบรถคันนี้" }).message); return; }
  const x = v.data, hist = h.data, n = h.count || hist.length, co = x.companies, w = DS.can(me, "write");
  body.innerHTML = `<div class="row" style="flex-wrap:wrap"><span class="plate wrapsafe">${esc(x.license_plate)}</span></div>
  <div class="card" style="margin:12px 0"><div class="row" style="justify-content:flex-start;gap:12px">${co ? coMark(co, 56) : ""}<div style="min-width:0"><div class="muted">บริษัทขนส่ง</div>${co ? `<b class="wrapsafe" style="font-size:17px">${esc(co.company_name)}</b>` : '<span class="badge warn">ไม่ระบุบริษัท</span>'}</div></div></div>
  <div class="grid g2"><div><label>จังหวัด</label>${esc(x.province || "-")}</div><div><label>ประเภทรถ</label>${esc(x.vehicle_type || "-")}</div>
  <div><label>เข้ามาทั้งหมด</label>${n.toLocaleString("th-TH")} ครั้ง</div><div><label>ล่าสุด</label>${hist.length ? DS.fmt.dateTime(hist[0].capture_at) : "-"}</div></div>
  ${x.notes ? `<div style="margin-top:8px"><label>หมายเหตุ</label>${esc(x.notes)}</div>` : ""}
  ${w ? `<div class="card" style="margin:12px 0"><b>แก้ไขข้อมูลรถ</b><label>บริษัทขนส่ง</label><select id="vc">${coOptions(x.company_id)}</select>
    <div id="vcn" class="hide"><label>ชื่อบริษัทใหม่</label><input id="vcname" maxlength="80" autocomplete="off"></div>
    <label>ประเภทรถ</label><select id="vt"><option value="">ไม่ระบุ</option>${DS.VEHICLE_TYPES.map((t) => `<option ${t === x.vehicle_type ? "selected" : ""}>${t}</option>`).join("")}</select>
    <label>หมายเหตุ</label><textarea id="vn" rows="2">${esc(x.notes || "")}</textarea><button id="vs" style="width:100%;margin-top:10px">บันทึกข้อมูลรถ</button></div>` : ""}
  <b>ประวัติการเข้าทั้งหมด${n > hist.length ? ` (แสดง ${hist.length} ล่าสุด)` : ""}</b><div style="margin-top:6px">${hist.map(itemHtml).join("")}</div>`;
  bindItems(body, hist);
  if (w) {
    $("#vc").onchange = () => $("#vcn").classList.toggle("hide", $("#vc").value !== NEW_CO);
    $("#vs").onclick = async (ev) => {
      const btn = ev.target; btn.disabled = true;
      try {
        let cid = $("#vc").value || null;
        if (cid === NEW_CO) {
          const name = $("#vcname").value.trim(); if (!name) throw new Error("กรุณากรอกชื่อบริษัทใหม่");
          const r = await db.rpc("ds_resolve_company", { p_id: null, p_name: name }); if (r.error) throw r.error; cid = r.data;
        }
        const { error } = await db.from("vehicles").update({ company_id: cid, vehicle_type: $("#vt").value || null, notes: $("#vn").value.trim() || null }).eq("id", id);
        if (error) throw error;
        DS.toast("บันทึกข้อมูลรถแล้ว"); m.remove(); await loadCompanies(); reload();
      } catch (e) { DS.toast(e.message, "error"); btn.disabled = false; }
    };
  }
}
// เปิดจากเลขทะเบียน: ถ้ามีรถคันเดียวเปิดเลย ถ้ามีหลายจังหวัดให้เลือก ถ้ายังไม่มีรถในระบบใช้หน้าประวัติแบบเดิม
async function openByPlate(n) {
  const { data, error } = await db.from("vehicles").select("id,license_plate,province,companies(company_name,logo_url,brand_color)").eq("plate_norm", n);
  if (error) return DS.toast(error.message, "error");
  if (!data.length) return showDetail(null, n);
  if (data.length === 1) return openVehicle(data[0].id);
  const m = DS.modal("พบทะเบียนนี้ในหลายจังหวัด", `<p class="muted">เลือกรถที่ต้องการดู</p>${data.map((r) => `<div class="cand" data-id="${esc(r.id)}"><div style="min-width:0;flex:1"><span class="plate wrapsafe">${esc(r.license_plate)}</span><div class="muted wrapsafe">${esc(r.province || "ไม่ระบุจังหวัด")}</div><div style="margin-top:4px">${coChip(r.companies)}</div></div></div>`).join("")}`);
  m.querySelectorAll(".cand").forEach((el) => (el.onclick = () => { m.remove(); openVehicle(el.dataset.id); }));
}

/* ---------- ผูกรายการที่ยังไม่มีรถ (เช่น ถูกแก้ป้าย) กับรถในระบบ ---------- */
async function relinkFlow(l) {
  const m = DS.modal("ผูกรายการกับรถ", spin), body = m.querySelector(".sb");
  const { data, error } = await db.rpc("match_plate", { p_plate: l.plate_number, p_province: l.province, p_confidence: null });
  if (error) { body.innerHTML = errBox(error.message); return; }
  const opts = []; if (data.vehicle) opts.push({ id: data.vehicle.id, plate: data.vehicle.license_plate, prov: data.vehicle.province, co: data.company ? data.company.company_name : null });
  (data.candidates || []).forEach((c) => opts.push({ id: c.id, plate: c.license_plate, prov: c.province, co: c.company_name }));
  let pick = null;
  body.innerHTML = `<p>รายการ <span class="plate wrapsafe">${esc(l.plate_number)}</span> ${esc(l.province || "")}</p><p class="muted">เลือกรถที่ตรงกัน ระบบจะไม่เลือกให้เอง</p>
  ${opts.map((o) => `<div class="cand" data-id="${esc(o.id)}"><input type="radio" name="rl" tabindex="-1"><div style="min-width:0"><span class="plate wrapsafe">${esc(o.plate)}</span><div class="muted wrapsafe">${esc(o.prov || "ไม่ระบุจังหวัด")} · ${esc(o.co || "ไม่ระบุบริษัท")}</div></div></div>`).join("")}
  ${data.vehicle ? "" : `<div class="cand" data-id="new"><input type="radio" name="rl" tabindex="-1"><div><b>ลงทะเบียนเป็นรถคันใหม่</b><div class="muted">ใช้เลขทะเบียนและจังหวัดของรายการนี้</div></div></div>`}
  <div id="rlNew" class="card hide"><label>บริษัทขนส่ง</label><select id="rlc">${coOptions("")}</select><div id="rlcn" class="hide"><label>ชื่อบริษัทใหม่</label><input id="rlname" maxlength="80"></div></div>
  <button id="rlOk" style="width:100%;margin-top:12px" disabled>ผูกรายการ</button>`;

$("#fToggle").onclick = () => $("#filters").classList.toggle("hide");
const FIDS = ["fp", "fpv", "ff", "ft", "fm", "fy", "fco", "fst"];
let ft; FIDS.forEach((id) => ($("#" + id).oninput = () => { clearTimeout(ft); ft = setTimeout(() => loadHistory(true), 350); }));
$("#fclear").onclick = () => { FIDS.forEach((id) => ($("#" + id).value = "")); loadHistory(true); };
function applyF(q) {
  const v = (id) => $("#" + id).value.trim();
  if (v("fp")) q = q.ilike("plate_norm", `%${DS.norm(v("fp"))}%`);
  if (v("fpv")) q = q.ilike("province", `%${v("fpv")}%`);
  if (v("ff")) q = q.gte("capture_date", v("ff")); if (v("ft")) q = q.lte("capture_date", v("ft"));
  if (v("fm")) q = q.eq("month", +v("fm")); if (v("fy")) q = q.eq("year", +v("fy"));
  if (v("fco")) q = q.eq("company_id", v("fco"));
  const s = v("fst");
  if (s === "known") q = q.in("status", ["matched", "verified", "legacy"]);
  else if (s === "new") q = q.eq("status", "new_vehicle");
  else if (s === "nocompany") q = q.not("vehicle_id", "is", null).is("company_id", null);
  else if (s === "review") q = q.in("status", ["needs_review", "unmatched"]);
  return q;
}

function resizeLogo(file, max) {
  max = max || 256;
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)), w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s));
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h; cv.getContext("2d").drawImage(img, 0, 0, w, h); URL.revokeObjectURL(u);
      cv.toBlob((b) => (b ? res(b) : rej(new Error("แปลงรูปไม่สำเร็จ"))), "image/png");
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error("อ่านไฟล์รูปไม่ได้ (รองรับ PNG, JPG, WebP)")); };
    img.src = u;
  });
}

  $("#tgFind").onclick = async (ev) => {
    ev.target.disabled = true;
    try {
      const { data, error: e } = await db.functions.invoke("notify-visit", { body: { discover: true } }); if (e) throw await DS.fnErr(e);
      const m = DS.modal("เลือกแชตที่พบ", data.chats.length ? `<p class="muted">แชตที่ส่งข้อความหาบอทหรือเพิ่มบอทเข้าไป</p>${data.chats.map((c) => `<div class="cand" data-id="${esc(c.chat_id)}" data-t="${esc(c.title)}"><b class="wrapsafe">${esc(c.title)}</b><div class="muted">${esc(c.type)} · ${esc(c.chat_id)}</div></div>`).join("")}` : '<div class="empty">ยังไม่พบแชต — เพิ่มบอทเข้ากลุ่ม แล้วพิมพ์ข้อความ 1 ข้อความในกลุ่ม จากนั้นกดค้นหาใหม่</div>');
      m.querySelectorAll(".cand").forEach((el) => (el.onclick = () => { m.remove(); addModal({ chat_id: el.dataset.id, title: el.dataset.t }); }));
    } catch (x) { DS.toast(x.message, "error"); }
    ev.target.disabled = false;
  };
  card.querySelectorAll("#tgList .item").forEach((el) => {
    const id = el.dataset.id, c = list.find((r) => r.id === id);
    el.querySelector(".tgTest").onclick = async (ev) => { ev.target.disabled = true; try { const { error: e } = await db.functions.invoke("notify-visit", { body: { test: true, chat_id: c.target } }); if (e) throw await DS.fnErr(e); DS.toast("ส่งข้อความทดสอบแล้ว"); } catch (x) { DS.toast(x.message, "error"); } ev.target.disabled = false; };
    el.querySelector(".tgTog").onclick = async () => { const { error: e } = await db.from("notification_channels").update({ enabled: !c.enabled }).eq("id", id); if (e) DS.toast(e.message, "error"); else loadTelegram(); };
    el.querySelector(".tgDel").onclick = async () => { if (!confirm("ลบปลายทางนี้?")) return; const { error: e } = await db.from("notification_channels").delete().eq("id", id); if (e) DS.toast(e.message, "error"); else loadTelegram(); };
  });
}

   (/stream = \u0e27\u0e34\u0e14\u0e35\u0e42\u0e2d, /jpg = \u0e20\u0e32\u0e1e\u0e19\u0e34\u0e48\u0e07)\n    - \u0e15\u0e48\u0e2d Wi-Fi \u0e43\u0e2b\u0e21\u0e48/\u0e23\u0e35\u0e2a\u0e15\u0e32\u0e23\u0e4c\u0e15\u0e40\u0e2d\u0e07\u0e40\u0e21\u0e37\u0e48\u0e2d\u0e21\u0e35\u0e1b\u0e31\u0e0d\u0e2b\u0e32\n\n  \u0e44\u0e1f\u0e41\u0e14\u0e07\u0e1a\u0e19\u0e1a\u0e2d\u0e23\u0e4c\u0e14: \u0e01\u0e30\u0e1e\u0e23\u0e34\u0e1a 2 \u0e04\u0e23\u0e31\u0e49\u0e07 = \u0e1e\u0e23\u0e49\u0e2d\u0e21 \u00b7 1 \u0e04\u0e23\u0e31\u0e49\u0e07 = \u0e2a\u0e48\u0e07\u0e2d\u0e48\u0e32\u0e19\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08 \u00b7 4 \u0e04\u0e23\u0e31\u0e49\u0e07 = \u0e44\u0e21\u0e48\u0e2a\u0e33\u0e40\u0e23\u0e47\u0e08\n\n  Arduino IDE:  Board = AI Thinker ESP32-CAM \u00b7 Tools -> PSRAM = Enabled (\u0e2a\u0e33\u0e04\u0e31\u0e0d) \u00b7 Partition = Huge APP (3MB No OTA)\n*/\n\n#include <WiFi.h>\n#include <WiFiClientSecure.h>\n#include <HTTPClient.h>\n#include <WebServer.h>\n#include \"esp_camera.h\"\n#include \"soc/soc.h\"\n#include \"soc/rtc_cntl_reg.h\"\n\n// ===================== \u0e15\u0e31\u0e49\u0e07\u0e04\u0e48\u0e32 (\u0e2b\u0e19\u0e49\u0e32\u0e40\u0e27\u0e47\u0e1a\u0e43\u0e2a\u0e48\u0e43\u0e2b\u0e49\u0e41\u0e25\u0e49\u0e27) =====================\nconst char* WIFI_SSID  = \"__WIFI_SSID__\";\nconst char* WIFI_PASSWORD = \"__WIFI_PASS__\";\nconst char* INGEST_URL = \"__URL__\";\nconst char* DEVICE_KEY = \"__KEY__\";\nconst char* SUPABASE_ANON_KEY = \"\";          // \u0e1b\u0e01\u0e15\u0e34\u0e1b\u0e25\u0e48\u0e2d\u0e22\u0e27\u0e48\u0e32\u0e07\n\n#define PIR_PIN __PIR__                      // \u0e02\u0e32\u0e40\u0e0b\u0e47\u0e19\u0e40\u0e0b\u0e2d\u0e23\u0e4c\u0e15\u0e23\u0e27\u0e08\u0e08\u0e31\u0e1a (PIR OUT) \u00b7 -1 = \u0e44\u0e21\u0e48\u0e43\u0e0a\u0e49\nconst uint32_t OCR_INTERVAL_MS = __INTERVAL__; // \u0e40\u0e21\u0e37\u0e48\u0e2d\u0e44\u0e21\u0e48\u0e43\u0e0a\u0e49 PIR: \u0e2d\u0e48\u0e32\u0e19\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19\u0e17\u0e38\u0e01\u0e01\u0e35\u0e48 ms (0 = \u0e1b\u0e34\u0e14\u0e01\u0e32\u0e23\u0e2d\u0e48\u0e32\u0e19\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19 \u0e14\u0e39\u0e20\u0e32\u0e1e\u0e2a\u0e14\u0e2d\u0e22\u0e48\u0e32\u0e07\u0e40\u0e14\u0e35\u0e22\u0e27)\nconst uint32_t SETTLE_MS   = 700;            // \u0e23\u0e2d\u0e43\u0e2b\u0e49\u0e23\u0e16\u0e40\u0e02\u0e49\u0e32\u0e01\u0e23\u0e2d\u0e1a\u0e2b\u0e25\u0e31\u0e07 PIR \u0e15\u0e23\u0e27\u0e08\u0e1e\u0e1a\nconst uint32_t COOLDOWN_MS = 8000;           // \u0e1e\u0e31\u0e01\u0e2b\u0e25\u0e31\u0e07\u0e2d\u0e48\u0e32\u0e19\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19\u0e41\u0e15\u0e48\u0e25\u0e30\u0e04\u0e23\u0e31\u0e49\u0e07 (\u0e01\u0e31\u0e19\u0e2a\u0e48\u0e07\u0e23\u0e16\u0e04\u0e31\u0e19\u0e40\u0e14\u0e34\u0e21\u0e0b\u0e49\u0e33)\n\nconst bool     PREVIEW_ENABLED     = true;   // \u0e2a\u0e48\u0e07\u0e20\u0e32\u0e1e\u0e15\u0e31\u0e27\u0e2d\u0e22\u0e48\u0e32\u0e07\u0e40\u0e02\u0e49\u0e32\u0e40\u0e27\u0e47\u0e1a (\u0e1b\u0e38\u0e48\u0e21 \u0e14\u0e39\u0e20\u0e32\u0e1e\u0e2a\u0e14)\nconst uint32_t WATCH_INTERVAL_MS   = 1000;   // \u0e04\u0e27\u0e32\u0e21\u0e16\u0e35\u0e48\u0e2a\u0e48\u0e07\u0e20\u0e32\u0e1e\u0e15\u0e2d\u0e19\u0e21\u0e35\u0e04\u0e19\u0e40\u0e1b\u0e34\u0e14\u0e14\u0e39 (ms) \u0e15\u0e48\u0e33\u0e2a\u0e38\u0e14\u0e41\u0e19\u0e30\u0e19\u0e33 700\n\nconst framesize_t FRAME_SIZE       = FRAMESIZE_VGA;  // VGA 640x480 (\u0e25\u0e2d\u0e07 FRAMESIZE_SVGA \u0e44\u0e14\u0e49\u0e16\u0e49\u0e32\u0e15\u0e49\u0e2d\u0e07\u0e01\u0e32\u0e23\u0e20\u0e32\u0e1e\u0e25\u0e30\u0e40\u0e2d\u0e35\u0e22\u0e14\u0e02\u0e36\u0e49\u0e19)\nconst uint8_t  JPEG_QUALITY        = 80;     // \u0e04\u0e38\u0e13\u0e20\u0e32\u0e1e JPEG \u0e02\u0e2d\u0e07 OCR / \u0e20\u0e32\u0e1e\u0e19\u0e34\u0e48\u0e07 (0-100)\nconst uint8_t  PREVIEW_JPEG_QUALITY = 55;    // \u0e04\u0e38\u0e13\u0e20\u0e32\u0e1e\u0e20\u0e32\u0e1e\u0e2a\u0e14\u0e43\u0e19\u0e40\u0e27\u0e47\u0e1a (\u0e15\u0e48\u0e33\u0e25\u0e07 = \u0e40\u0e25\u0e47\u0e01 \u0e2a\u0e48\u0e07\u0e44\u0e27)\nconst bool     FLIP_VERTICAL       = false;  // \u0e20\u0e32\u0e1e\u0e01\u0e25\u0e31\u0e1a\u0e2b\u0e31\u0e27 -> true\nconst bool     MIRROR_HORIZONTAL   = false;  // \u0e20\u0e32\u0e1e\u0e01\u0e25\u0e31\u0e1a\u0e0b\u0e49\u0e32\u0e22\u0e02\u0e27\u0e32 -> true\n// ===============================================================================\n\n// AI Thinker pins\n#define PWDN_GPIO_NUM   32\n#define RESET_GPIO_NUM  -1\n#define XCLK_GPIO_NUM    0\n#define SIOD_GPIO_NUM   26\n#define SIOC_GPIO_NUM   27\n#define Y9_GPIO_NUM     35\n#define Y8_GPIO_NUM     34\n#define Y7_GPIO_NUM     39\n#define Y6_GPIO_NUM     36\n#define Y5_GPIO_NUM     21\n#define Y4_GPIO_NUM     19\n#define Y3_GPIO_NUM     18\n#define Y2_GPIO_NUM      5\n#define VSYNC_GPIO_NUM  25\n#define HREF_GPIO_NUM   23\n#define PCLK_GPIO_NUM   22\n\n#define LED_RED_PIN     33   // \u0e44\u0e1f\u0e41\u0e14\u0e07\u0e2b\u0e25\u0e31\u0e07\u0e1a\u0e2d\u0e23\u0e4c\u0e14 (active LOW)\n#define LED_FLASH_PIN    4   // \u0e41\u0e1f\u0e25\u0e0a\u0e02\u0e32\u0e27 (\u0e1b\u0e34\u0e14\u0e44\u0e27\u0e49)\n\nstatic bool nativeJpeg = false;\nWebServer server(80);\n\n// ---------- LED ----------\nstatic void blinkRed(int times) {\n  for (int i = 0; i < times; i++) {\n    digitalWrite(LED_RED_PIN, LOW);\n    delay(120);\n    digitalWrite(LED_RED_PIN, HIGH);\n    delay(180);\n  }\n}\n\n// ---------- Camera ----------\nstatic camera_config_t makeConfig(pixformat_t fmt, uint32_t xclk = 20000000) {\n  camera_config_t c = {};\n  c.ledc_channel = LEDC_CHANNEL_0;\n  c.ledc_timer   = LEDC_TIMER_0;\n  c.pin_d0 = Y2_GPIO_NUM;  c.pin_d1 = Y3_GPIO_NUM;\n  c.pin_d2 = Y4_GPIO_NUM;  c.pin_d3 = Y5_GPIO_NUM;\n  c.pin_d4 = Y6_GPIO_NUM;  c.pin_d5 = Y7_GPIO_NUM;\n  c.pin_d6 = Y8_GPIO_NUM;  c.pin_d7 = Y9_GPIO_NUM;\n  c.pin_xclk  = XCLK_GPIO_NUM;\n  c.pin_pclk  = PCLK_GPIO_NUM;\n  c.pin_vsync = VSYNC_GPIO_NUM;\n  c.pin_href  = HREF_GPIO_NUM;\n  c.pin_sccb_sda = SIOD_GPIO_NUM;\n  c.pin_sccb_scl = SIOC_GPIO_NUM;\n  c.pin_pwdn  = PWDN_GPIO_NUM;\n  c.pin_reset = RESET_GPIO_NUM;\n  c.xclk_freq_hz = xclk;\n  c.pixel_format = fmt;\n  c.grab_mode    = CAMERA_GRAB_LATEST;\n  c.fb_count     = 1;\n\n  if (psramFound()) {\n    c.fb_location  = CAMERA_FB_IN_PSRAM;\n    c.frame_size   = FRAME_SIZE;\n    c.jpeg_quality = 12;\n  } else {\n    c.fb_location  = CAMERA_FB_IN_DRAM;\n    c.frame_size   = FRAMESIZE_QVGA;\n    c.jpeg_quality = 15;\n  }\n  return c;\n}\n\nstatic bool initCamera() {\n  // \u0e25\u0e2d\u0e07\u0e2b\u0e25\u0e32\u0e22\u0e41\u0e1a\u0e1a: JPEG 20MHz \u2192 JPEG 10MHz (\u0e2a\u0e32\u0e22\u0e41\u0e1e/\u0e44\u0e1f\u0e44\u0e21\u0e48\u0e19\u0e34\u0e48\u0e07) \u2192 RGB565 (\u0e40\u0e0b\u0e19\u0e40\u0e0b\u0e2d\u0e23\u0e4c\u0e17\u0e35\u0e48\u0e44\u0e21\u0e48\u0e23\u0e2d\u0e07\u0e23\u0e31\u0e1a JPEG)\n  const uint32_t clks[2] = {20000000, 10000000};\n  bool ok = false;\n  for (int i = 0; i < 2 && !ok; i++) {\n    camera_config_t cfg = makeConfig(PIXFORMAT_JPEG, clks[i]);\n    esp_err_t err = esp_camera_init(&cfg);\n    if (err == ESP_OK) { ok = true; nativeJpeg = true; Serial.printf(\"camera: JPEG mode OK (%d MHz)\\n\", (int)(clks[i] / 1000000)); }\n    else { Serial.printf(\"camera: JPEG init failed 0x%x (%d MHz)\\n\", (unsigned)err, (int)(clks[i] / 1000000)); esp_camera_deinit(); delay(300); }\n  }\n  if (!ok) {\n    camera_config_t cfg = makeConfig(PIXFORMAT_RGB565, 10000000);\n    esp_err_t err = esp_camera_init(&cfg);\n    if (err != ESP_OK) {\n      Serial.printf(\"camera: RGB565 init failed 0x%x  (0x105 = \u0e44\u0e21\u0e48\u0e1e\u0e1a\u0e01\u0e25\u0e49\u0e2d\u0e07 \u0e15\u0e23\u0e27\u0e08\u0e2a\u0e32\u0e22\u0e41\u0e1e \u00b7 0x101/0x20001 = \u0e2b\u0e19\u0e48\u0e27\u0e22\u0e04\u0e27\u0e32\u0e21\u0e08\u0e33)\\n\", (unsigned)err);\n      return false;\n    }\n    nativeJpeg = false;\n    Serial.println(\"camera: RGB565 mode OK (software JPEG)\");\n  }\n\n  sensor_t* s = esp_camera_sensor_get();\n  if (s) {\n    Serial.printf(\"camera: sensor PID=0x%04x\\n\", s->id.PID);\n    s->set_vflip(s, FLIP_VERTICAL ? 1 : 0);\n    s->set_hmirror(s, MIRROR_HORIZONTAL ? 1 : 0);\n  }\n\n  for (int i = 0; i < 5; i++) {   // \u0e17\u0e34\u0e49\u0e07\u0e40\u0e1f\u0e23\u0e21\u0e41\u0e23\u0e01 \u0e46 \u0e43\u0e2b\u0e49\u0e41\u0e2a\u0e07\u0e19\u0e34\u0e48\u0e07\n    camera_fb_t* fb = esp_camera_fb_get();\n    if (fb) esp_camera_fb_return(fb);\n    delay(100);\n  }\n  return true;\n}\n\n// \u0e16\u0e48\u0e32\u0e22 1 \u0e23\u0e39\u0e1b -> JPEG buffer (\u0e15\u0e49\u0e2d\u0e07 free() \u0e40\u0e21\u0e37\u0e48\u0e2d needFree = true)\nstatic bool captureJpeg(uint8_t** out, size_t* outLen, bool* needFree, uint8_t quality) {\n  *out = nullptr; *outLen = 0; *needFree = false;\n\n  camera_fb_t* fb = esp_camera_fb_get();\n  if (!fb) {\n    Serial.println(\"capture: esp_camera_fb_get() failed\");\n    return false;\n  }\n\n  if (nativeJpeg && fb->format == PIXFORMAT_JPEG) {\n    uint8_t* copy = (uint8_t*)malloc(fb->len);\n    if (!copy) { esp_camera_fb_return(fb); return false; }\n    memcpy(copy, fb->buf, fb->len);\n    *out = copy; *outLen = fb->len; *needFree = true;\n    esp_camera_fb_return(fb);\n    return true;\n  }\n\n  uint8_t* jpg = nullptr;\n  size_t jpgLen = 0;\n  bool ok = fmt2jpg(fb->buf, fb->len, fb->width, fb->height,\n                    fb->format, quality, &jpg, &jpgLen);\n  esp_camera_fb_return(fb);\n\n  if (!ok || !jpg || jpgLen == 0) {\n    Serial.println(\"capture: software JPEG convert failed\");\n    if (jpg) free(jpg);\n    return false;\n  }\n  *out = jpg; *outLen = jpgLen; *needFree = true;\n  return true;\n}\n\n// ---------- Wi-Fi ----------\nstatic bool connectWiFi(uint32_t timeoutMs = 20000) {\n  if (WiFi.status() == WL_CONNECTED) return true;\n  Serial.printf(\"wifi: connecting to %s \", WIFI_SSID);\n  WiFi.mode(WIFI_STA);\n  WiFi.persistent(false);\n  WiFi.setAutoReconnect(true);\n  WiFi.setSleep(false);            // \u0e25\u0e14\u0e2d\u0e32\u0e01\u0e32\u0e23\u0e20\u0e32\u0e1e\u0e01\u0e23\u0e30\u0e15\u0e38\u0e01\n  WiFi.setTxPower(WIFI_POWER_19_5dBm);\n  WiFi.begin(WIFI_SSID, WIFI_PASSWORD);\n  uint32_t t0 = millis();\n  while (WiFi.status() != WL_CONNECTED && millis() - t0 < timeoutMs) {\n    delay(500);\n    Serial.print(\".\");\n  }\n  Serial.println();\n  if (WiFi.status() == WL_CONNECTED) {\n    Serial.print(\"wifi: connected, IP = \");\n    Serial.println(WiFi.localIP());\n    return true;\n  }\n  Serial.println(\"wifi: connect failed\");\n  return false;\n}\n\n// ---------- \u0e2b\u0e19\u0e49\u0e32\u0e40\u0e27\u0e47\u0e1a\u0e1a\u0e19\u0e15\u0e31\u0e27\u0e01\u0e25\u0e49\u0e2d\u0e07 ----------\nstatic void handleRoot() {\n  String html =\n    \"<!doctype html><html><head><meta charset='utf-8'>\"\n    \"<meta name='viewport' content='width=device-width,initial-scale=1'>\"\n    \"<title>DockSense CAM<\/title>\"\n    \"<style>body{margin:0;background:#0b1220;color:#e6edf7;font-family:sans-serif;text-align:center}\"\n    \"img{max-width:100%;height:auto;margin-top:12px;border-radius:8px}\"\n    \"a{color:#4fd1c5;margin:0 8px}<\/style><\/head><body>\"\n    \"<h3>DockSense CAM - \u0e20\u0e32\u0e1e\u0e2a\u0e14<\/h3>\"\n    \"<img src='/stream'><br><p><a href='/jpg'>\u0e20\u0e32\u0e1e\u0e19\u0e34\u0e48\u0e07<\/a><\/p>\"\n    \"<\/body><\/html>\";\n  server.send(200, \"text/html; charset=utf-8\", html);\n}\n\nstatic void handleJpg() {\n  uint8_t* jpg; size_t len; bool nf;\n  if (!captureJpeg(&jpg, &len, &nf, JPEG_QUALITY)) {\n    server.send(503, \"text/plain\", \"capture failed\");\n    return;\n  }\n  WiFiClient client = server.client();\n  client.printf(\"HTTP/1.1 200 OK\\r\\nContent-Type: image/jpeg\\r\\n\"\n                \"Content-Length: %u\\r\\nCache-Control: no-cache\\r\\nConnection: close\\r\\n\\r\\n\",\n                (unsigned)len);\n  client.write(jpg, len);\n  if (nf) free(jpg);\n}\n\nstatic void handleStream() {\n  WiFiClient client = server.client();\n  client.print(\"HTTP/1.1 200 OK\\r\\n\"\n               \"Content-Type: multipart/x-mixed-replace; boundary=frame\\r\\n\"\n               \"Cache-Control: no-cache\\r\\nConnection: close\\r\\n\\r\\n\");\n  int fails = 0;\n  while (client.connected()) {\n    uint8_t* jpg; size_t len; bool nf;\n    if (!captureJpeg(&jpg, &len, &nf, PREVIEW_JPEG_QUALITY)) {\n      if (++fails >= 10) break;\n      delay(100);\n      continue;\n    }\n    fails = 0;\n    client.printf(\"--frame\\r\\nContent-Type: image/jpeg\\r\\nContent-Length: %u\\r\\n\\r\\n\", (unsigned)len);\n    client.write(jpg, len);\n    client.print(\"\\r\\n\");\n    if (nf) free(jpg);\n    delay(1);\n  }\n}\n\n// ---------- \u0e2a\u0e48\u0e07\u0e02\u0e36\u0e49\u0e19\u0e40\u0e0b\u0e34\u0e23\u0e4c\u0e1f\u0e40\u0e27\u0e2d\u0e23\u0e4c ----------\n// \u0e43\u0e0a\u0e49\u0e01\u0e32\u0e23\u0e40\u0e0a\u0e37\u0e48\u0e2d\u0e21\u0e15\u0e48\u0e2d HTTPS \u0e04\u0e49\u0e32\u0e07\u0e44\u0e27\u0e49 (keep-alive) \u0e44\u0e21\u0e48\u0e15\u0e49\u0e2d\u0e07\u0e08\u0e31\u0e1a\u0e21\u0e37\u0e2d TLS \u0e43\u0e2b\u0e21\u0e48\u0e17\u0e38\u0e01\u0e04\u0e23\u0e31\u0e49\u0e07 -> \u0e25\u0e14\u0e2b\u0e19\u0e48\u0e27\u0e07\u0e21\u0e32\u0e01\nstatic WiFiClientSecure secureClient;\nstatic HTTPClient       httpc;\nstatic bool             secureReady = false;\n\n// preview = true  -> \u0e2a\u0e48\u0e07\u0e44\u0e1b ?preview=1 (\u0e40\u0e01\u0e47\u0e1a\u0e40\u0e1b\u0e47\u0e19 latest.jpg \u0e44\u0e21\u0e48\u0e1c\u0e48\u0e32\u0e19 OCR)\n// preview = false -> \u0e2a\u0e48\u0e07\u0e2d\u0e48\u0e32\u0e19\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19 (OCR)\n// nextMs: \u0e04\u0e48\u0e32\u0e17\u0e35\u0e48\u0e40\u0e0b\u0e34\u0e23\u0e4c\u0e1f\u0e40\u0e27\u0e2d\u0e23\u0e4c\u0e1a\u0e2d\u0e01\u0e43\u0e2b\u0e49\u0e23\u0e2d (\u0e16\u0e49\u0e32\u0e21\u0e35\u0e04\u0e19\u0e14\u0e39\u0e2d\u0e22\u0e39\u0e48 \u0e08\u0e30\u0e16\u0e39\u0e01\u0e41\u0e17\u0e19\u0e14\u0e49\u0e27\u0e22 WATCH_INTERVAL_MS)\nstatic bool postJpeg(const uint8_t* data, size_t len, bool preview, uint32_t* nextMs) {\n  if (!secureReady) {\n    secureClient.setInsecure();\n    secureClient.setTimeout(10);\n    secureReady = true;\n  }\n\n  String url = String(INGEST_URL) + (preview ? \"?preview=1\" : \"\");\n  httpc.setReuse(true);\n  httpc.setConnectTimeout(6000);\n  httpc.setTimeout(preview ? 8000 : 30000);\n  if (!httpc.begin(secureClient, url)) { secureClient.stop(); return false; }\n  httpc.addHeader(\"Content-Type\", \"image/jpeg\");\n  httpc.addHeader(\"x-device-key\", DEVICE_KEY);\n  if (preview) httpc.addHeader(\"x-local-ip\", WiFi.localIP().toString());   // \u0e43\u0e2b\u0e49\u0e2b\u0e19\u0e49\u0e32\u0e40\u0e27\u0e47\u0e1a\u0e21\u0e35\u0e25\u0e34\u0e07\u0e01\u0e4c\u0e14\u0e39\u0e41\u0e1a\u0e1a\u0e25\u0e37\u0e48\u0e19\u0e43\u0e19\u0e27\u0e07 Wi-Fi \u0e40\u0e14\u0e35\u0e22\u0e27\u0e01\u0e31\u0e19\n  if (SUPABASE_ANON_KEY[0] != '\\0') {\n    httpc.addHeader(\"apikey\", SUPABASE_ANON_KEY);\n    httpc.addHeader(\"Authorization\", String(\"Bearer \") + SUPABASE_ANON_KEY);\n  }\n\n  uint32_t t0 = millis();\n  int code = httpc.POST((uint8_t*)data, len);\n  Serial.printf(\"http: %s %u bytes -> %d (%u ms)\\n\", preview ? \"preview\" : \"ocr\",\n                (unsigned)len, code, (unsigned)(millis() - t0));\n  if (code > 0) {\n    String body = httpc.getString();\n    if (!preview || code >= 300) {\n      if (body.length() > 600) body = body.substring(0, 600);\n      Serial.println(\"http: response: \" + body);\n    }\n    if (nextMs) {\n      if (body.indexOf(\"\\\"watch\\\":true\") >= 0) {\n        *nextMs = WATCH_INTERVAL_MS;\n      } else {\n        int i = body.indexOf(\"\\\"next_ms\\\":\");\n        if (i >= 0) {\n          long v = body.substring(i + 10).toInt();\n          if (v >= 1000 && v <= 60000) *nextMs = (uint32_t)v;\n        }\n      }\n    }\n  } else {\n    Serial.printf(\"http: error: %s\\n\", httpc.errorToString(code).c_str());\n    secureClient.stop();            // \u0e1a\u0e31\u0e07\u0e04\u0e31\u0e1a\u0e40\u0e0a\u0e37\u0e48\u0e2d\u0e21\u0e15\u0e48\u0e2d\u0e43\u0e2b\u0e21\u0e48\u0e23\u0e2d\u0e1a\u0e2b\u0e19\u0e49\u0e32\n  }\n  httpc.end();\n  return code >= 200 && code < 300;\n}\n\n// ---------- setup / loop ----------\nvoid setup() {\n  WRITE_PERI_REG(RTC_CNTL_BROWN_OUT_REG, 0);\n  Serial.begin(115200);\n  delay(500);\n  Serial.println(\"\\n=== DockSense CAM v4 ===\");\n\n  pinMode(LED_RED_PIN, OUTPUT);\n  digitalWrite(LED_RED_PIN, HIGH);\n  pinMode(LED_FLASH_PIN, OUTPUT);\n  digitalWrite(LED_FLASH_PIN, LOW);\n  if (PIR_PIN >= 0) pinMode(PIR_PIN, INPUT);\n\n  Serial.printf(\"PSRAM: %s\\n\", psramFound() ? \"found\" : \"NOT FOUND (\u0e40\u0e1b\u0e34\u0e14 Tools -> PSRAM)\");\n\n  if (!initCamera()) {\n    Serial.println(\"\u0e01\u0e25\u0e49\u0e2d\u0e07\u0e40\u0e23\u0e34\u0e48\u0e21\u0e17\u0e33\u0e07\u0e32\u0e19\u0e44\u0e21\u0e48\u0e44\u0e14\u0e49 \u2014 \u0e1b\u0e34\u0e14\u0e44\u0e1f \u0e16\u0e2d\u0e14\u0e41\u0e25\u0e49\u0e27\u0e40\u0e2a\u0e35\u0e22\u0e1a\u0e2a\u0e32\u0e22\u0e41\u0e1e\u0e01\u0e25\u0e49\u0e2d\u0e07\u0e43\u0e2b\u0e49\u0e41\u0e19\u0e48\u0e19 \u0e41\u0e25\u0e49\u0e27\u0e40\u0e2a\u0e35\u0e22\u0e1a USB \u0e43\u0e2b\u0e21\u0e48 (\u0e08\u0e30\u0e25\u0e2d\u0e07\u0e43\u0e2b\u0e21\u0e48\u0e43\u0e19 5 \u0e27\u0e34\u0e19\u0e32\u0e17\u0e35)\");\n    blinkRed(3);\n    delay(5000);\n    ESP.restart();\n  }\n\n  connectWiFi();\n\n  server.on(\"/\", handleRoot);\n  server.on(\"/jpg\", handleJpg);\n  server.on(\"/stream\", handleStream);\n  server.begin();\n\n  if (WiFi.status() == WL_CONNECTED) {\n    Serial.print(\"\u0e14\u0e39\u0e20\u0e32\u0e1e\u0e2a\u0e14\u0e17\u0e35\u0e48: http://\");\n    Serial.println(WiFi.localIP());\n    blinkRed(2);   // \u0e01\u0e30\u0e1e\u0e23\u0e34\u0e1a 2 \u0e04\u0e23\u0e31\u0e49\u0e07 = \u0e01\u0e25\u0e49\u0e2d\u0e07\u0e1e\u0e23\u0e49\u0e2d\u0e21\n  }\n}\n\nvoid loop() {\n  server.handleClient();\n\n  static uint32_t lastStatus = 0;\n  if (millis() - lastStatus > 15000) {\n    lastStatus = millis();\n    if (WiFi.status() == WL_CONNECTED) {\n      Serial.printf(\"status: online, http://%s/\\n\", WiFi.localIP().toString().c_str());\n    } else {\n      Serial.println(\"status: wifi lost, reconnecting\");\n      connectWiFi(10000);\n    }\n  }\n\n  // \u0e2a\u0e48\u0e07\u0e20\u0e32\u0e1e\u0e15\u0e31\u0e27\u0e2d\u0e22\u0e48\u0e32\u0e07\u0e40\u0e02\u0e49\u0e32\u0e40\u0e27\u0e47\u0e1a (\u0e43\u0e2b\u0e49\u0e1b\u0e38\u0e48\u0e21 \"\u0e14\u0e39\u0e20\u0e32\u0e1e\u0e2a\u0e14\" \u0e17\u0e33\u0e07\u0e32\u0e19)\n  static uint32_t lastPreview = 0, previewEvery = 15000;\n  static int previewFails = 0, captureFails = 0;\n  if (PREVIEW_ENABLED && WiFi.status() == WL_CONNECTED &&\n      (lastPreview == 0 || millis() - lastPreview >= previewEvery)) {\n    lastPreview = millis();\n    uint8_t* jpg = nullptr; size_t len = 0; bool nf = false;\n    if (captureJpeg(&jpg, &len, &nf, PREVIEW_JPEG_QUALITY)) {\n      captureFails = 0;\n      bool ok = postJpeg(jpg, len, true, &previewEvery);\n      if (nf && jpg) free(jpg);\n      if (ok) {\n        previewFails = 0;\n      } else {\n        previewEvery = 5000;\n        previewFails++;\n        if (previewFails == 5) {            // \u0e40\u0e19\u0e47\u0e15/\u0e40\u0e0b\u0e34\u0e23\u0e4c\u0e1f\u0e40\u0e27\u0e2d\u0e23\u0e4c\u0e21\u0e35\u0e1b\u0e31\u0e0d\u0e2b\u0e32 -> \u0e15\u0e48\u0e2d Wi-Fi \u0e43\u0e2b\u0e21\u0e48\n          Serial.println(\"recover: reconnect wifi\");\n          secureClient.stop();\n          WiFi.disconnect();\n          delay(500);\n          connectWiFi(15000);\n        } else if (previewFails >= 20) {    // \u0e44\u0e21\u0e48\u0e2b\u0e32\u0e22\u0e08\u0e23\u0e34\u0e07 \u0e46 -> \u0e23\u0e35\u0e2a\u0e15\u0e32\u0e23\u0e4c\u0e15\n          Serial.println(\"recover: restart\");\n          delay(300);\n          ESP.restart();\n        }\n      }\n    } else {\n      previewEvery = 3000;\n      if (++captureFails >= 8) {            // \u0e01\u0e25\u0e49\u0e2d\u0e07\u0e04\u0e49\u0e32\u0e07 -> \u0e23\u0e35\u0e2a\u0e15\u0e32\u0e23\u0e4c\u0e15\n        Serial.println(\"recover: camera stuck, restart\");\n        delay(300);\n        ESP.restart();\n      }\n    }\n  }\n\n  // \u0e2d\u0e48\u0e32\u0e19\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19 (OCR): \u0e15\u0e32\u0e21 PIR \u0e2b\u0e23\u0e37\u0e2d\u0e15\u0e31\u0e49\u0e07\u0e40\u0e27\u0e25\u0e32 (OCR_INTERVAL_MS = 0 \u0e41\u0e25\u0e30\u0e44\u0e21\u0e48\u0e21\u0e35 PIR = \u0e1b\u0e34\u0e14)\n  static uint32_t lastOcr = 0;\n  bool trigger = false;\n  if (PIR_PIN >= 0) {\n    if (digitalRead(PIR_PIN) == HIGH && (lastOcr == 0 || millis() - lastOcr >= COOLDOWN_MS)) {\n      uint32_t t0 = millis();\n      while (millis() - t0 < SETTLE_MS) { server.handleClient(); delay(10); }\n      trigger = true;\n    }\n  } else if (OCR_INTERVAL_MS > 0) {\n    if (lastOcr == 0 || millis() - lastOcr >= OCR_INTERVAL_MS) trigger = true;\n  }\n  if (trigger && WiFi.status() == WL_CONNECTED) {\n    lastOcr = millis();\n    uint8_t* jpg = nullptr; size_t len = 0; bool nf = false;\n    if (captureJpeg(&jpg, &len, &nf, JPEG_QUALITY)) {\n      bool ok = postJpeg(jpg, len, false, nullptr);\n      if (nf && jpg) free(jpg);\n      blinkRed(ok ? 1 : 4);\n    } else {\n      blinkRed(4);\n    }\n  }\n}\n";
function camSetup(d) {
  const m = DS.modal("ตั้งค่ากล้อง: " + d.name, `<p class="muted">ใส่ชื่อ Wi-Fi ที่กล้องจะใช้ แล้วดาวน์โหลดโค้ด เปิดด้วย Arduino IDE และอัปโหลดลงบอร์ด ESP32-CAM (ใส่รหัสกล้องให้แล้ว)</p>
  <label>ชื่อ Wi-Fi (2.4 GHz)</label><input id="cwS" autocomplete="off"><label>รหัสผ่าน Wi-Fi</label><input id="cwP" autocomplete="off">
  <label>ตัวสั่งถ่ายรูป</label><select id="cwM"><option value="pir">เซ็นเซอร์ตรวจจับ (PIR) ต่อขา GPIO 13</option><option value="8000">ถ่ายอัตโนมัติทุก 8 วินาที</option><option value="15000">ถ่ายอัตโนมัติทุก 15 วินาที</option></select>
  <button id="cwDl" type="button" style="width:100%;margin-top:14px">ดาวน์โหลดโค้ดกล้อง (.ino)</button>
  <details style="margin-top:14px"><summary class="muted">ดูรหัสกล้อง (ใช้ตั้งค่าเอง)</summary><label>ที่อยู่รับรูป</label><input readonly value="${esc(CAM_URL)}" onclick="this.select()"><label>รหัสกล้อง (เก็บเป็นความลับ)</label><input readonly value="${esc(d.device_key)}" onclick="this.select()"></details>
  <div class="row" style="margin-top:14px"><button class="ghost" id="cwX" type="button">ปิด</button></div>`);
  m.querySelector("#cwX").onclick = () => m.remove();
  m.querySelector("#cwDl").onclick = () => {
    const mode = m.querySelector("#cwM").value, q = (s) => s.replace(/\\/g, "\\\\").replace(/"/g, '\\"');
    const code = CAM_SKETCH.replace("__WIFI_SSID__", () => q(m.querySelector("#cwS").value)).replace("__WIFI_PASS__", () => q(m.querySelector("#cwP").value))
      .replace("__URL__", CAM_URL).replace("__KEY__", d.device_key).replace("__PIR__", mode === "pir" ? "13" : "-1").replace("__INTERVAL__", mode === "pir" ? "8000" : mode);
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([code], { type: "text/plain" })); a.download = "docksense_cam.ino"; a.click();
    DS.toast("ดาวน์โหลดแล้ว — เปิดไฟล์ด้วย Arduino IDE");
  };
}
async function loadCameras() {
  const card = $("#camCard"); if (!card) return;
  if (me.role !== "admin") { card.innerHTML = '<h3>กล้อง ESP32-CAM</h3><p class="muted">เฉพาะผู้ดูแลระบบที่ตั้งค่าได้</p>'; return; }
  const { data, error } = await db.from("camera_devices").select("*").order("created_at");
  if (error) { card.innerHTML = '<h3>กล้อง ESP32-CAM</h3>' + errBox(error.message, "loadCameras()"); return; }
  const ago = (t) => { if (!t) return "ยังไม่เคยส่งรูป"; const s = (Date.now() - new Date(t)) / 1000; return s < 90 ? "ส่งรูปล่าสุดเมื่อกี้" : s < 3600 ? `ส่งรูปล่าสุด ${Math.round(s / 60)} นาทีที่แล้ว` : s < 86400 ? `ส่งรูปล่าสุด ${Math.round(s / 3600)} ชั่วโมงที่แล้ว` : "ส่งรูปล่าสุด " + DS.fmt.dateTime(t); };
  card.innerHTML = `<h3>กล้อง ESP32-CAM</h3><p class="muted">กล้องถ่ายรูปรถ → ระบบอ่านทะเบียนและบันทึกในเว็บ → ส่ง Telegram พร้อมปุ่มเปิดดูข้อมูลรถ ให้เองทุกครั้ง (กล้องแจ้งทุกคัน ไม่ขึ้นกับสวิตช์บริษัท)</p>
  ${data.length ? data.map((d) => `<div class="chan" data-id="${esc(d.id)}"><div style="flex:1;min-width:0"><b class="wrapsafe">📷 ${esc(d.name)}</b><div class="muted wrapsafe">${esc(ago(d.last_seen))}${d.last_plate ? " · ล่าสุด " + esc(d.last_plate) : ""}${d.enabled ? "" : " · ปิดอยู่"}</div></div><div class="acts"><button class="ghost camSet" type="button">ตั้งค่า / โค้ดกล้อง</button><button class="ghost camTog" type="button">${d.enabled ? "ปิด" : "เปิด"}</button><button class="ghost camDel" type="button">ลบ</button></div></div>`).join("") : '<div class="empty sm">ยังไม่มีกล้อง กด “+ เพิ่มกล้อง” เพื่อรับรหัสกล้องตัวแรก</div>'}
  <div class="row" style="margin-top:10px"><button id="camAdd" type="button">+ เพิ่มกล้อง</button></div>`;
  $("#camAdd").onclick = async (ev) => {
    const name = (prompt("ตั้งชื่อกล้อง เช่น ประตูหน้า") || "").trim(); if (!name) return;
    ev.target.disabled = true; const { data: d, error: e } = await db.from("camera_devices").insert({ name }).select("*").single();
    if (e) { DS.toast(e.message, "error"); ev.target.disabled = false; return; }
    await loadCameras(); camSetup(d);
  };
  card.querySelectorAll(".chan").forEach((el) => {
    const d = data.find((r) => r.id === el.dataset.id);
    el.querySelector(".camSet").onclick = () => camSetup(d);
    el.querySelector(".camTog").onclick = async () => { const { error: e } = await db.from("camera_devices").update({ enabled: !d.enabled }).eq("id", d.id); if (e) DS.toast(e.message, "error"); else loadCameras(); };
    el.querySelector(".camDel").onclick = async () => { if (!confirm("ลบกล้องนี้? กล้องตัวนี้จะส่งรูปเข้าระบบไม่ได้อีก")) return; const { error: e } = await db.from("camera_devices").delete().eq("id", d.id); if (e) DS.toast(e.message, "error"); else loadCameras(); };
  });
}

async function loadSettings() {
  const roleTh = { admin: "ผู้ดูแลระบบ", staff: "เจ้าหน้าที่", viewer: "ผู้ชม" };
  $("#settings").innerHTML = `<div class="card"><h3>บัญชีของฉัน</h3>${esc(me.full_name || "")} · ${esc(me.email || "")}<div class="muted">สิทธิ์: <b>${roleTh[me.role]}</b> — ${ROLE_DESC[me.role]}</div></div>
  <div class="card"><h3>การเชื่อมต่อ AI OCR</h3><p class="muted">อ่านป้ายที่ Supabase Edge Function <code>ocr-plate</code> เพื่อไม่ให้ API Key อยู่ในหน้าเว็บ (ดูวิธี deploy ใน README.md)</p><button id="ocrTest">ทดสอบการเชื่อมต่อ</button><div id="ocrRes" style="margin-top:10px"></div></div>
  <div class="card" id="tgCard"><h3>แจ้งเตือน Telegram</h3><div class="muted">กำลังโหลด…</div></div>
  <div class="card" id="camCard"><h3>กล้อง ESP32-CAM</h3><div class="muted">กำลังโหลด…</div></div>
  <div class="card"><h3>ติดตั้งเป็นแอป</h3><p class="muted">Android: Chrome → เมนู ⋮ → "ติดตั้งแอป" · iPhone: Safari → แชร์ → "เพิ่มไปยังหน้าจอโฮม"</p></div><div id="cos"></div><div id="users"></div>`;
  loadTelegram(); loadCameras();
  $("#ocrTest").onclick = async (e) => {
    e.target.disabled = true; const out = $("#ocrRes");
    try { const p = await DS.pingOcr(); out.innerHTML = `<span class="badge ok">✓ เชื่อมต่อสำเร็จ (ผู้ให้บริการ: ${esc(p)})</span>`; }
    catch (x) { out.innerHTML = `<span class="badge bad">✗ ${x.code === "API_KEY_MISSING" ? "ยังไม่ได้ตั้งค่า ANTHROPIC_API_KEY" : x.code === "NOT_DEPLOYED" ? "ยังไม่ได้ deploy Edge Function ocr-plate" : esc(x.message)}</span>`; }
    e.target.disabled = false;
  };
  renderCompaniesCard();
  if (DS.can(me, "admin")) renderUsers();
}
async function renderUsers() {
  const [pr, st] = await Promise.all([db.from("profiles").select("*").order("created_at", { ascending: false }), db.from("app_settings").select("value").eq("key", "signup").maybeSingle()]);
  if (pr.error) return; const data = pr.data, defRole = (st.data && st.data.value && st.data.value.default_role) || "viewer", week = Date.now() - 7 * 864e5;
  $("#users").innerHTML = `<div class="card"><h3>ผู้ใช้งานและสิทธิ์</h3>
  <div class="roles">${["admin", "staff", "viewer"].map((r) => `<div><b>${ROLE_TH[r]}</b><span>${ROLE_DESC[r]}</span></div>`).join("")}</div>
  <label>สมาชิกที่สมัครใหม่ จะได้สิทธิ์</label>
  <div class="seg" id="defRole"><button type="button" data-r="viewer" class="${defRole === "viewer" ? "on" : ""}">ผู้ชม (รอผู้ดูแลอนุมัติ)</button><button type="button" data-r="staff" class="${defRole === "staff" ? "on" : ""}">เจ้าหน้าที่ (สแกนได้ทันที)</button></div>
  <p class="muted" style="margin:6px 0 0">ผู้สมัครคนแรกของระบบเป็นผู้ดูแลเสมอ</p>
  <div id="ulist">${data.map((u) => `<div class="urow" data-u="${u.id}"><div class="uinfo"><b class="wrapsafe">${esc(u.full_name || u.email || "")}</b>${u.role === "viewer" && new Date(u.created_at) > week ? '<span class="badge new">ใหม่</span>' : ""}<div class="muted wrapsafe">${esc(u.email || "")}</div></div>
    <div class="seg sm">${["admin", "staff", "viewer"].map((r) => `<button type="button" data-r="${r}" class="${r === u.role ? "on" : ""}" ${u.id === me.id ? "disabled" : ""}>${ROLE_TH[r]}</button>`).join("")}</div></div>`).join("")}</div></div>`;
  $("#defRole").querySelectorAll("button").forEach((b) => (b.onclick = async () => {
    const { error } = await db.from("app_settings").upsert({ key: "signup", value: { default_role: b.dataset.r } }); if (error) return DS.toast(error.message, "error");
    DS.toast(b.dataset.r === "staff" ? "สมาชิกใหม่จะสแกนได้ทันที" : "สมาชิกใหม่จะเป็นผู้ชมก่อน"); renderUsers();
  }));
  $("#ulist").querySelectorAll(".urow").forEach((row) => row.querySelectorAll("button").forEach((b) => (b.onclick = async () => {
    if (b.classList.contains("on")) return;
    const { error } = await db.from("profiles").update({ role: b.dataset.r }).eq("id", row.dataset.u); if (error) return DS.toast(error.message, "error");
    DS.toast("ตั้งสิทธิ์เป็น " + ROLE_TH[b.dataset.r] + " แล้ว"); renderUsers();
  })));
}
boot();
