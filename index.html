<script>
/* DockSense AI — ส่วนที่ใช้ร่วมกัน (index.html + scan.html) */
(function () {
  const cfg = window.DS_CONFIG || {};
  const keyMissing = !cfg.SUPABASE_URL || !cfg.SUPABASE_KEY || /PASTE_/.test(cfg.SUPABASE_KEY);
  const db = supabase.createClient(cfg.SUPABASE_URL || "https://invalid.supabase.co", cfg.SUPABASE_KEY || "missing", {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
  });

  const TZ = "Asia/Bangkok";
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // ต้องตรงกับคอลัมน์ plate_norm ในฐานข้อมูล: upper(regexp_replace(plate_number, '[\s\-]', '', 'g'))
  const norm = (s) => String(s ?? "").toUpperCase().replace(/[\s\-]/g, "");

  /* ธีม */
  const applyTheme = (t) => { if (t === "dark") document.documentElement.setAttribute("data-theme", "dark"); else document.documentElement.removeAttribute("data-theme"); };
  try {
    const saved = localStorage.getItem("ds_theme");
    applyTheme(saved || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  } catch (e) {}
  const toggleTheme = () => {
    const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(t); try { localStorage.setItem("ds_theme", t); } catch (e) {}
  };

  /* วันเวลา (แสดงตามเวลาไทยเสมอ ปี ค.ศ.) */
  const mkf = (o) => new Intl.DateTimeFormat("th-TH-u-ca-gregory", { timeZone: TZ, ...o });
  const fD = mkf({ day: "numeric", month: "short", year: "numeric" }), fT = mkf({ hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
  const ok = (v) => v && !isNaN(new Date(v));
  const fmt = {
    date: (v) => (ok(v) ? fD.format(new Date(v)) : "-"),
    time: (v) => (ok(v) ? fT.format(new Date(v)) : "-"),
    dateTime: (v) => (ok(v) ? fD.format(new Date(v)) + " " + fT.format(new Date(v)) : "-"),
    ago: (v) => {
      if (!ok(v)) return "-";
      const s = Math.max(0, (Date.now() - new Date(v)) / 1000);
      if (s < 60) return "เมื่อสักครู่";
      if (s < 3600) return Math.floor(s / 60) + " นาทีที่แล้ว";
      if (s < 86400) return Math.floor(s / 3600) + " ชั่วโมงที่แล้ว";
      if (s < 604800) return Math.floor(s / 86400) + " วันที่แล้ว";
      return fD.format(new Date(v));
    },
  };

  /* toast */
  function toast(msg, type) {
    let box = document.querySelector(".toasts");
    if (!box) { box = document.createElement("div"); box.className = "toasts"; document.body.appendChild(box); }
    const t = document.createElement("div"); t.className = "toast" + (type && type !== "ok" ? " " + type : ""); t.textContent = msg; box.appendChild(t);
    setTimeout(() => t.remove(), type === "error" ? 5000 : 3000);
  }

  /* modal: คืน element .modal ที่มี .sb (เนื้อหา) — ปิดด้วย m.remove() */
  function modal(title, html) {
    const m = document.createElement("div"); m.className = "modal";
    m.innerHTML = `<div class="sheet"><div class="sh"><b>${esc(title)}</b><button class="x" aria-label="ปิด">✕</button></div><div class="sb">${html || ""}</div></div>`;
    m.addEventListener("click", (e) => { if (e.target === m) m.remove(); });
    m.querySelector(".x").onclick = () => m.remove();
    document.body.appendChild(m); return m;
  }

  /* รูปภาพใน bucket private → signed URL (แคชไว้) */
  const sc = new Map();
  async function signedUrl(path) {
    const hit = sc.get(path); if (hit && hit.exp > Date.now()) return hit.url;
    const { data, error } = await db.storage.from("plate-images").createSignedUrl(path, 3600); if (error) throw error;
    sc.set(path, { url: data.signedUrl, exp: Date.now() + 3300 * 1000 }); return data.signedUrl;
  }
  const thumb = (p) => (p ? `<img class="ph" data-p="${esc(p)}" alt="" loading="lazy">` : '<div class="ph"></div>');
  function hydrateImages(root) {
    (root || document).querySelectorAll("img[data-p]").forEach(async (img) => {
      const p = img.dataset.p; img.removeAttribute("data-p");
      try { img.src = await signedUrl(p); } catch (e) { img.style.visibility = "hidden"; }
    });
  }

  /* สิทธิ์: admin ทำได้ทุกอย่าง · staff บันทึก/แก้ไข · viewer ดูอย่างเดียว (RLS ในฐานข้อมูลบังคับอีกชั้น) */
  const can = (me, a) => !!me && (a === "read" ? true : a === "write" ? me.role === "admin" || me.role === "staff" : me.role === "admin");

  /* session + โปรไฟล์: คืน null ถ้ายังไม่ล็อกอิน, {session, profile:null} ถ้ายังไม่มีโปรไฟล์ */
  async function requireAuth() {
    const { data: { session }, error } = await db.auth.getSession();
    if (error || !session) return null;
    const { data: profile, error: pe } = await db.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
    if (pe) console.error("profiles:", pe);
    return { session, profile: profile || null };
  }

  /* OCR ผ่าน Edge Function (API key อยู่ฝั่งเซิร์ฟเวอร์เท่านั้น) */
  async function fnErr(error) {
    let code = "OCR_FAILED", msg = error.message || "เรียก OCR ไม่สำเร็จ";
    const ctx = error.context;
    if (error.name === "FunctionsHttpError" && ctx) {
      try { const j = await ctx.json(); msg = j.error || j.message || msg; code = j.code || code; } catch (e) {}
      if (ctx.status === 404) code = "NOT_DEPLOYED";
      else if (ctx.status === 401) { code = "UNAUTHORIZED"; msg = "เซสชันหมดอายุหรือไม่ได้รับอนุญาต กรุณาเข้าสู่ระบบใหม่"; }
    } else { code = "NOT_DEPLOYED"; msg = "เชื่อมต่อ Edge Function ไม่ได้ (ยังไม่ได้ deploy หรืออินเทอร์เน็ตมีปัญหา)"; }
    const e = new Error(msg); e.code = code; return e;
  }
  const b64 = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej(new Error("อ่านไฟล์ภาพไม่ได้")); r.readAsDataURL(blob); });
  async function readPlate(blob) {
    const { data, error } = await db.functions.invoke("ocr-plate", { body: { imageBase64: await b64(blob), mediaType: blob.type || "image/jpeg" } });
    if (error) throw await fnErr(error); return data;
  }
  async function pingOcr() {
    const { data, error } = await db.functions.invoke("ocr-plate", { body: { ping: true } });
    if (error) throw await fnErr(error); return data.provider;
  }

  const VEHICLE_TYPES = ["รถยนต์", "รถกระบะ", "รถบรรทุก", "รถจักรยานยนต์", "รถตู้", "อื่นๆ"];
  const PROVINCES = ["กรุงเทพมหานคร","กระบี่","กาญจนบุรี","กาฬสินธุ์","กำแพงเพชร","ขอนแก่น","จันทบุรี","ฉะเชิงเทรา","ชลบุรี","ชัยนาท","ชัยภูมิ","ชุมพร","เชียงราย","เชียงใหม่","ตรัง","ตราด","ตาก","นครนายก","นครปฐม","นครพนม","นครราชสีมา","นครศรีธรรมราช","นครสวรรค์","นนทบุรี","นราธิวาส","น่าน","บึงกาฬ","บุรีรัมย์","ปทุมธานี","ประจวบคีรีขันธ์","ปราจีนบุรี","ปัตตานี","พระนครศรีอยุธยา","พะเยา","พังงา","พัทลุง","พิจิตร","พิษณุโลก","เพชรบุรี","เพชรบูรณ์","แพร่","ภูเก็ต","มหาสารคาม","มุกดาหาร","แม่ฮ่องสอน","ยโสธร","ยะลา","ร้อยเอ็ด","ระนอง","ระยอง","ราชบุรี","ลพบุรี","ลำปาง","ลำพูน","เลย","ศรีสะเกษ","สกลนคร","สงขลา","สตูล","สมุทรปราการ","สมุทรสงคราม","สมุทรสาคร","สระแก้ว","สระบุรี","สิงห์บุรี","สุโขทัย","สุพรรณบุรี","สุราษฎร์ธานี","สุรินทร์","หนองคาย","หนองบัวลำภู","อ่างทอง","อำนาจเจริญ","อุดรธานี","อุตรดิตถ์","อุทัยธานี","อุบลราชธานี"];

  window.addEventListener("offline", () => toast("ออฟไลน์อยู่ — ตรวจสอบอินเทอร์เน็ต", "error"));
  window.addEventListener("online", () => toast("กลับมาออนไลน์แล้ว", "info"));

  window.DS = { db, esc, norm, toggleTheme, fmt, toast, modal, signedUrl, thumb, hydrateImages, can, requireAuth, readPlate, pingOcr, fnErr, VEHICLE_TYPES, PROVINCES, TZ };

  if (keyMissing) document.addEventListener("DOMContentLoaded", () => {
    const d = document.createElement("div");
    d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:200;background:#dc2626;color:#fff;padding:10px 14px;font-size:14px;text-align:center";
    d.textContent = "ยังไม่ได้ตั้งค่า SUPABASE_KEY ใน config.js — ล็อกอินและโหลดข้อมูลไม่ได้";
    document.body.appendChild(d);
  });
})();

</script>
<script>
const $ = (s) => document.querySelector(s), esc = DS.esc, db = DS.db;
let me = null, tab = "home", rows = [], total = 0, loadingMore = false;
const PAGE = 20;
const MONTHS = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const spin = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
const errBox = (m, retry) => `<div class="empty">⚠️ เกิดข้อผิดพลาด<br><span class="muted">${esc(m)}</span>${retry ? `<br><br><button class="ghost" onclick="${retry}">ลองใหม่</button>` : ""}</div>`;

/* ---------- login ---------- */
let mode = "in";
const lastEmail = () => { try { return localStorage.getItem("ds_email") || ""; } catch (e) { return ""; } };
$("#lemail").value = lastEmail();
function setMode(m) {
  mode = m; const up = m === "up";
  $("#tabIn").classList.toggle("on", !up); $("#tabUp").classList.toggle("on", up);
  $("#tabIn").setAttribute("aria-selected", String(!up)); $("#tabUp").setAttribute("aria-selected", String(up));
  $("#nameWrap").classList.toggle("hide", !up); $("#lnote").classList.toggle("hide", !up);
  $("#lbtn").textContent = up ? "สมัครและเข้าใช้งาน" : "เข้าสู่ระบบ";
  $("#lpass").autocomplete = up ? "new-password" : "current-password"; $("#lerr").classList.add("hide");
}

    try { if (navigator.wakeLock) wl = await navigator.wakeLock.request("screen"); } catch (_) {}
    ch = db.channel("live:" + id, { config: { broadcast: { self: false }, presence: { key: "phone" } } });
    ch.on("presence", { event: "sync" }, () => { viewers = Object.keys(ch.presenceState()).filter((k) => k !== "phone").length; info(); });

    const beat = async () => { const { error } = await db.from("phone_cams").upsert({ id, name, seen_at: new Date().toISOString() }); if (error) { const i = q("#pcInfo"); if (i) i.textContent = "ประกาศกล้องให้คนอื่นเห็นไม่ได้: " + error.message; } };
    await beat(); beatT = setInterval(beat, 6000);
    running = true; go.disabled = false; go.textContent = "หยุดส่งภาพ"; info();
    // ถ่ายทะเบียนอัตโนมัติ: ภาพในกรอบเปลี่ยน (รถเข้า) แล้วนิ่ง → อ่านและบันทึกเอง (ไม่ตรวจซ้ำเป็นรอบ เพื่อไม่กินโควตา AI)
    const sm = document.createElement("canvas"); sm.width = 32; sm.height = 24; const sctx = sm.getContext("2d", { willReadFrequently: true });
    let prev = null, changed = false, calm = 0, lastOcr = 0, ocrBusy = false;
    const say = (t) => { const e = q("#pcAuto2"); if (e) e.textContent = t; };
    // ตัวตรวจป้ายคล้ายทะเบียน (ในเครื่อง ไม่เสียโควตา): เห็นป้าย → ใหญ่พอ → นิ่ง → เลือกเฟรมคมสุด → ตัดเฉพาะป้ายส่งให้ AI
    const DW = 400, dc = document.createElement("canvas"), dctx = dc.getContext("2d", { willReadFrequently: true });
    const grayOf = (v) => { const k = DW / v.videoWidth; dc.width = DW; dc.height = Math.round(v.videoHeight * k); dctx.drawImage(v, 0, 0, dc.width, dc.height); const d = dctx.getImageData(0, 0, dc.width, dc.height).data, g = new Uint8Array(dc.width * dc.height); for (let i = 0; i < g.length; i++) g[i] = (d[i * 4] * 77 + d[i * 4 + 1] * 150 + d[i * 4 + 2] * 29) >> 8; return { g, W: dc.width, H: dc.height }; };
    const box = (r, W, H, ok) => { const b = q("#pcBox"); if (!b) return; if (!r) { b.style.display = "none"; return; } b.style.display = "block"; b.style.left = (r.x / W * 100) + "%"; b.style.top = (r.y / H * 100) + "%"; b.style.width = (r.w / W * 100) + "%"; b.style.height = (r.h / H * 100) + "%"; b.style.borderColor = ok ? "#22c55e" : "#f59e0b"; };
    // r = ตำแหน่งป้ายในภาพเล็ก; คืนรูปตัดเฉพาะป้าย (เผื่อขอบ) ความละเอียดจากกล้องจริง — เล็กกว่าและชัดกว่าส่งภาพเต็ม
    const cropBlob = (r, W, H, ratioH) => new Promise((ok) => {
      const v = q("#pcV"), kx = v.videoWidth / W, ky = v.videoHeight / H;
      const mx = r.w * 0.35, my = r.h * 0.8, x0 = Math.max(0, r.x - mx), y0 = Math.max(0, r.y - my), x1 = Math.min(W, r.x + r.w + mx), y1 = Math.min(H, r.y + r.h + my);
      const sw = (x1 - x0) * kx, sh = (y1 - y0) * ky, k = Math.min(1, 1280 / sw), c = document.createElement("canvas"); c.width = Math.round(sw * k); c.height = Math.round(sh * k);
      c.getContext("2d").drawImage(v, x0 * kx, y0 * ky, sw, sh, 0, 0, c.width, c.height); c.toBlob(ok, "image/jpeg", 0.9);
    });
    const send = async (blob) => {
      const { data: { session } } = await db.auth.getSession();
      const r = await fetch(CAM_URL + "?name=" + encodeURIComponent(name), { method: "POST", headers: { Authorization: "Bearer " + session.access_token, apikey: window.DS_CONFIG.SUPABASE_KEY, "Content-Type": "image/jpeg" }, body: blob });
      return { ok: r.ok, status: r.status, j: await r.json().catch(() => ({})) };
    };
    const doOcr = async (blob) => {
      ocrBusy = true; lastOcr = Date.now(); say("กำลังอ่านทะเบียน…");
      try {
        if (!blob) { const c = grab(1280); blob = await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.85)); }
        const { ok, status, j } = await send(blob);
        if (!ok) say("อ่านทะเบียนไม่สำเร็จ: " + (j.error || status));
        else if (j.pending) say("AI อ่านไม่ได้ตอนนี้ (โควตาเต็ม) — ส่งภาพเข้าหน้า “รอตรวจสอบ” ให้พนักงานพิมพ์ทะเบียนแล้ว");
        else if (j.skipped === "cooldown") say("รอสักครู่… (กันอ่านถี่เกินไป)");
        else if (j.skipped) say("ภาพไม่พร้อม (" + j.skipped + ") — รอเฟรมถัดไป");
        else if (j.duplicate) say("เห็น " + j.plate + " (บันทึกไปแล้วเมื่อสักครู่)");
        else if (j.plate) say("✓ บันทึกแล้ว: " + j.plate + (j.status === "needs_review" ? " (รอตรวจสอบ)" : ""));
        else say("ยังไม่พบป้ายทะเบียนในภาพ");
      } catch (e) { say("อ่านทะเบียนไม่สำเร็จ"); }
      ocrBusy = false;
    };
    q("#pcNow").onclick = () => { if (!running || ocrBusy) return; doOcr(null); armed = false; };
    let armed = true, stable = 0, last = null, goneAt = 0, grabbing = false, trk = null, seenAt = 0;
    autoT = setInterval(async () => {
      const on = q("#pcAuto") && q("#pcAuto").checked; if (!on) { box(null); const sx = q("#pcScan"); if (sx) sx.style.display = "none"; trk = null; return; }
      if (!running || ocrBusy || grabbing) return; const v = q("#pcV"); if (!v.videoWidth) return;
      if (Date.now() - flipAt < 2500) { last = null; stable = 0; return; }
      const { g, W, H } = grayOf(v), r0 = window.DSPlate.detect(g, W, H), now = Date.now();
      // สแกนทั้งเฟรมทุกรอบ · เจอป้าย = กรอบเขียว/ส้มตามติดแบบนุ่ม (ไม่สั่น) · หลุดเฟรมสั้นๆ (<0.7 วิ) กรอบค้างไว้ · หายนาน = กลับไปสแกนหาต่อ
      const sc = (on) => { const e = q("#pcScan"); if (e) e.style.display = on ? "block" : "none"; };
      if (r0) { trk = (trk && Math.hypot(r0.x + r0.w / 2 - trk.x - trk.w / 2, r0.y + r0.h / 2 - trk.y - trk.h / 2) / W < 0.15) ? { x: trk.x + (r0.x - trk.x) * 0.45, y: trk.y + (r0.y - trk.y) * 0.45, w: trk.w + (r0.w - trk.w) * 0.45, h: trk.h + (r0.h - trk.h) * 0.45 } : { x: r0.x, y: r0.y, w: r0.w, h: r0.h }; seenAt = now; }
      else if (trk && now - seenAt > 700) trk = null;
      if (!r0) {
        last = null; stable = 0;
        if (trk) { box(trk, W, H, false); sc(false); return; }
        box(null); sc(true); if (!goneAt) goneAt = now;
        if (!armed && now - goneAt > 3000) { armed = true; say("พร้อม: รอรถคันถัดไป"); } else if (armed) say("กำลังสแกนหาป้ายทะเบียนทั้งภาพ…");
        return;
      }
      goneAt = 0; sc(false);
      const r = r0, big = r.w / W >= 0.12;
      box(trk, W, H, big && (stable >= 1 || !armed));
      if (!armed) { say("อ่านคันนี้ไปแล้ว — รอให้รถออกจากกรอบ"); return; }
      if (!big) { stable = 0; last = null; say("พบป้ายคล้ายทะเบียน — ยังไกลอยู่ รอให้เข้ามาใกล้อีก"); return; }
      const mv = last ? Math.hypot(r.x + r.w / 2 - last.x - last.w / 2, r.y + r.h / 2 - last.y - last.h / 2) / W : 1, gr = last ? Math.abs(r.w - last.w) / last.w : 1;
      last = r; stable = (mv < 0.03 && gr < 0.15) ? stable + 1 : 0;
      if (stable < 2) { say("ป้ายเข้ากรอบแล้ว รอให้นิ่ง…"); return; }
      if (Date.now() - lastOcr < 30000) { say("รอสักครู่… (กันอ่านถี่เกินไป)"); return; }
      // นิ่งแล้ว: เก็บ 3 เฟรมห่างกัน ~150 ms เลือกเฟรมที่คมที่สุด (หลบเฟรมเบลอ) ก่อนส่งให้ AI 1 ครั้ง
      grabbing = true; say("ป้ายนิ่งแล้ว กำลังเลือกเฟรมที่คมที่สุด…");
      let bestS = -1, bestR = r, bestBlob = null;
      for (let n = 0; n < 3; n++) {
        const f = grayOf(v), rr = window.DSPlate.detect(f.g, f.W, f.H) || r, sh = window.DSPlate.sharpness(f.g, f.W, f.H, rr.x, rr.y, rr.w, rr.h);
        if (sh > bestS) { bestS = sh; bestR = rr; bestBlob = await cropBlob(rr, f.W, f.H); }
        await new Promise((ok) => setTimeout(ok, 150));
      }
      grabbing = false; armed = false; stable = 0; last = null;
      if (bestS < 40) { say("ภาพยังเบลอ/มืดเกินไป — ไม่เรียก AI (ลองเพิ่มแสงหรือถือให้นิ่ง)"); armed = true; return; }
      doOcr(bestBlob);
    }, 250);
    document.addEventListener("visibilitychange", async () => { if (!document.hidden && running && !wl && navigator.wakeLock) { try { wl = await navigator.wakeLock.request("screen"); } catch (_) {} } });
    timer = setInterval(async () => {
      if (!running || busy || !viewers || !stream) return; busy = true;
      try { const c = grab(960); if (c) { await ch.send({ type: "broadcast", event: "frame", payload: { b: c.toDataURL("image/jpeg", 0.6).slice(23), t: Date.now() } }); sent++; } } catch (_) {}
      busy = false;
    }, 170);
  };
}

// ลิงก์จาก Telegram: #v=<รหัสรถ> เปิดรายละเอียดรถ · #t=history|search|set เปิดแท็บ
function openFromHash() {
  const m = location.hash.match(/^#(v|t)=([\w-]+)$/); if (!m) return;
  history.replaceState(null, "", location.pathname + location.search);
  if (m[1] === "t" && ["home", "history", "search", "ai", "set"].includes(m[2])) go(m[2]);
  else if (m[1] === "v" && /^[0-9a-f-]{36}$/i.test(m[2])) openVehicle(m[2]);
}

function go(t) {

  ["home", "history", "search", "ai", "set"].forEach((x) => $("#t-" + x).classList.toggle("hide", x !== t)); reload();

// สีแบรนด์ที่ admin ตั้งไว้ · ถ้าไม่ตั้ง ระบบสุ่มสีคงที่จากชื่อบริษัท (ไม่เดาสีแบรนด์จริง) เพื่อให้แต่ละบริษัทแยกกันได้ง่าย
const coColor = (c) => /^#[0-9a-fA-F]{6}$/.test((c && c.brand_color) || "") ? c.brand_color
  : PALETTE[Array.from(String((c && c.company_name) || "")).reduce((h, ch) => (h * 31 + ch.codePointAt(0)) >>> 0, 7) % PALETTE.length];
const logoSrc = (p) => db.storage.from("company-logos").getPublicUrl(p).data.publicUrl;
function coMark(c, sz) {
  sz = sz || 36;
  const col = coColor(c), ch = Array.from(String(c.company_name || "").trim())[0] || "?", ini = /[\p{L}\p{N}]/u.test(ch) ? esc(ch.toUpperCase()) : "?";
  const box = `width:${sz}px;height:${sz}px`;
  const fb = `<div class="ini" style="${box};background:${col};font-size:${Math.round(sz * 0.45)}px">${ini}</div>`;
  if (!c.logo_url) return fb;
  return `<img class="lg" style="${box}" src="${esc(logoSrc(c.logo_url))}" alt="" loading="lazy" data-fb="${esc(fb)}" onerror="this.outerHTML=this.dataset.fb">`;
}
const coChip = (c, sz) => (c && (c.company_id || c.id || c.company_name))
  ? `<div class="co" style="border-left:4px solid ${coColor(c)};padding-left:8px">${coMark(c, sz || 28)}<span class="nm">${esc(c.company_name)}</span></div>`
  : '<span class="badge warn">ไม่ระบุบริษัท</span>';
const ST = { matched: ["รู้จัก", "ok"], verified: ["ตรวจสอบแล้ว", "ok"], new_vehicle: ["รถใหม่", ""], needs_review: ["ต้องตรวจสอบ", "warn"], unmatched: ["ยังไม่จับคู่", "warn"], legacy: ["ข้อมูลเดิม", ""] };
const stBadge = (s) => { const x = ST[s] || [s || "-", ""]; return `<span class="badge ${x[1]}" style="flex:none">${esc(x[0])}</span>`; };
async function loadCompanies() {
  const { data, error } = await db.from("companies").select("id,company_name,logo_url,brand_color,notify_telegram").order("company_name");
  if (!error) companies = data;
  const cur = $("#fco").value;
  $("#fco").innerHTML = '<option value="">ทั้งหมด</option>' + companies.map((c) => `<option value="${esc(c.id)}">${esc(c.company_name)}</option>`).join("");
  $("#fco").value = cur;
}
const coOptions = (sel) => `<option value="">ไม่ระบุบริษัท</option>${companies.map((c) => `<option value="${esc(c.id)}" ${c.id === sel ? "selected" : ""}>${esc(c.company_name)}</option>`).join("")}<option value="${NEW_CO}">➕ เพิ่มบริษัทใหม่…</option>`;

function itemHtml(l) {
  const co = l.company_id ? `<div style="margin-top:4px">${coChip(l, 26)}</div>` : l.vehicle_id ? '<div style="margin-top:4px"><span class="badge warn">ไม่ระบุบริษัท</span></div>' : "";
  return `<div class="item" data-id="${l.id}" style="padding:12px 0;border-top:1px solid var(--line);align-items:flex-start">${DS.thumb(l.image_path)}
  <div style="flex:1;min-width:0"><div class="row" style="justify-content:space-between;gap:6px;flex-wrap:wrap"><span class="plate wrapsafe">${esc(l.plate_number)}</span>${stBadge(l.status)}</div>
  <div class="muted wrapsafe">${esc(l.province || "-")} · ${esc(l.vehicle_type || "ไม่ระบุประเภท")}</div>${co}
  <div class="muted">${DS.fmt.ago(l.capture_at)} · ${DS.fmt.date(l.capture_at)} ${DS.fmt.time(l.capture_at)}</div></div></div>`;
}
function bindItems(root, list) { DS.hydrateImages(root); root.querySelectorAll(".item[data-id]").forEach((el) => (el.onclick = () => showDetail(list.find((x) => x.id === el.dataset.id)))); }

/* ---------- รายละเอียดรถ (ทุกการเข้าของรถคันเดียวกัน) ---------- */
async function openVehicle(id) {
  const m = DS.modal("รายละเอียดรถ", spin), body = m.querySelector(".sb");
  const [v, h] = await Promise.all([
    db.from("vehicles").select("id,license_plate,province,vehicle_type,brand,model,color,notes,company_id,created_at,companies(id,company_name,logo_url,brand_color)").eq("id", id).maybeSingle(),
    db.from("visit_details").select("*", { count: "exact" }).eq("vehicle_id", id).order("capture_at", { ascending: false }).limit(100)]);
  if (v.error || h.error || !v.data) { body.innerHTML = errBox((v.error || h.error || { message: "ไม่พบรถคันนี้" }).message); return; }
  const x = v.data, hist = h.data, n = h.count || hist.length, co = x.companies, w = DS.can(me, "write");
  body.innerHTML = `<div class="row" style="flex-wrap:wrap"><span class="plate wrapsafe">${esc(x.license_plate)}</span></div>
  <div class="card" style="margin:12px 0"><div class="row" style="justify-content:flex-start;gap:12px">${co ? coMark(co, 56) : ""}<div style="min-width:0"><div class="muted">บริษัทขนส่ง</div>${co ? `<b class="wrapsafe" style="font-size:17px">${esc(co.company_name)}</b>` : '<span class="badge warn">ไม่ระบุบริษัท</span>'}</div></div></div>
  <div class="grid g2"><div><label>จังหวัด</label>${esc(x.province || "-")}</div><div><label>ประเภทรถ</label>${esc(x.vehicle_type || "-")}</div>
  <div><label>ยี่ห้อ</label>${esc(x.brand || "-")}</div><div><label>รุ่น</label>${esc(x.model || "-")}</div><div><label>สีรถ</label>${esc(x.color || "-")}</div>
  <div><label>เข้ามาทั้งหมด</label>${n.toLocaleString("th-TH")} ครั้ง</div><div><label>ล่าสุด</label>${hist.length ? DS.fmt.dateTime(hist[0].capture_at) : "-"}</div></div>
  ${x.notes ? `<div style="margin-top:8px"><label>หมายเหตุ</label>${esc(x.notes)}</div>` : ""}
  ${w ? `<div class="card" style="margin:12px 0"><b>แก้ไขข้อมูลรถ</b><label>บริษัทขนส่ง</label><select id="vc">${coOptions(x.company_id)}</select>
    <div id="vcn" class="hide"><label>ชื่อบริษัทใหม่</label><input id="vcname" maxlength="80" autocomplete="off"></div>
    <label>ประเภทรถ</label><select id="vt"><option value="">ไม่ระบุ</option>${DS.VEHICLE_TYPES.map((t) => `<option ${t === x.vehicle_type ? "selected" : ""}>${t}</option>`).join("")}</select>
    <div class="grid g2"><div><label>ยี่ห้อรถ</label><input id="vb" maxlength="40" placeholder="เช่น Isuzu, Toyota" value="${esc(x.brand || "")}"></div><div><label>รุ่น</label><input id="vm" maxlength="40" placeholder="เช่น D-Max, Hilux" value="${esc(x.model || "")}"></div></div>
    <label>สีรถ</label><input id="vcl" maxlength="30" placeholder="เช่น ขาว, ดำ, แดง" value="${esc(x.color || "")}">
    <label>หมายเหตุ</label><textarea id="vn" rows="2">${esc(x.notes || "")}</textarea><button id="vs" style="width:100%;margin-top:10px">บันทึกข้อมูลรถ</button></div>` : ""}
  <b>ประวัติการเข้าทั้งหมด${n > hist.length ? ` (แสดง ${hist.length} ล่าสุด)` : ""}</b><div style="margin-top:6px">${hist.map(itemHtml).join("")}</div>`;
  bindItems(body, hist);
  if (w) {
    $("#vc").onchange = () => $("#vcn").classList.toggle("hide", $("#vc").value !== NEW_CO);
    $("#vs").onclick = async (ev) => {
      const btn = ev.target; btn.disabled = true;
      try {
        let cid = $("#vc").value || null;
        if (cid === NEW_CO) {
          const name = $("#vcname").value.trim(); if (!name) throw new Error("กรุณากรอกชื่อบริษัทใหม่");
          const r = await db.rpc("ds_resolve_company", { p_id: null, p_name: name }); if (r.error) throw r.error; cid = r.data;
        }
        const { error } = await db.from("vehicles").update({ company_id: cid, vehicle_type: $("#vt").value || null, brand: $("#vb").value.trim() || null, model: $("#vm").value.trim() || null, color: $("#vcl").value.trim() || null, notes: $("#vn").value.trim() || null }).eq("id", id);
        if (error) throw error;
        DS.toast("บันทึกข้อมูลรถแล้ว"); m.remove(); await loadCompanies(); reload();
      } catch (e) { DS.toast(e.message, "error"); btn.disabled = false; }
    };
  }
}
// เปิดจากเลขทะเบียน: ถ้ามีรถคันเดียวเปิดเลย ถ้ามีหลายจังหวัดให้เลือก ถ้ายังไม่มีรถในระบบใช้หน้าประวัติแบบเดิม
async function openByPlate(n) {
  const { data, error } = await db.from("vehicles").select("id,license_plate,province,companies(company_name,logo_url,brand_color)").eq("plate_norm", n);
  if (error) return DS.toast(error.message, "error");
  if (!data.length) return showDetail(null, n);
  if (data.length === 1) return openVehicle(data[0].id);
  const m = DS.modal("พบทะเบียนนี้ในหลายจังหวัด", `<p class="muted">เลือกรถที่ต้องการดู</p>${data.map((r) => `<div class="cand" data-id="${esc(r.id)}"><div style="min-width:0;flex:1"><span class="plate wrapsafe">${esc(r.license_plate)}</span><div class="muted wrapsafe">${esc(r.province || "ไม่ระบุจังหวัด")}</div><div style="margin-top:4px">${coChip(r.companies)}</div></div></div>`).join("")}`);
  m.querySelectorAll(".cand").forEach((el) => (el.onclick = () => { m.remove(); openVehicle(el.dataset.id); }));
}

/* ---------- รายละเอียดการเข้า / แก้ไข / ลบ ---------- */
async function showDetail(log, norm) {
  const m = DS.modal("รายละเอียดทะเบียน", spin), body = m.querySelector(".sb"), n = log ? log.plate_norm : norm;
  const { data: hist, error } = await db.from("visit_details").select("*").eq("plate_norm", n).order("capture_at", { ascending: false }).limit(200);
  if (error) { body.innerHTML = errBox(error.message); return; }
  const head = log || hist[0]; let img = "";
  if (log && log.image_path) { try { img = `<a href="${await DS.signedUrl(log.image_path)}" target="_blank"><img class="pv" src="${await DS.signedUrl(log.image_path)}" alt="ภาพทะเบียน"></a>`; } catch (e) {} }
  const conf = log && log.ocr_confidence != null ? Math.round(log.ocr_confidence * 100) : null, w = DS.can(me, "write");
  body.innerHTML = `<div class="row" style="flex-wrap:wrap"><span class="plate wrapsafe" style="flex:none">${esc(head.plate_number)}</span>${log ? stBadge(log.status) : ""}${conf != null ? `<span class="badge ${conf >= 85 ? "ok" : conf >= 60 ? "warn" : "bad"}" style="flex:none">ความมั่นใจ ${conf}%</span>` : ""}</div>
  ${log ? `<div style="margin:10px 0">${log.vehicle_id ? coChip(log, 32) : '<span class="badge warn">ยังไม่ผูกกับรถในระบบ</span>'}</div>` : ""}
  ${img ? `<div style="margin:12px 0">${img}</div>` : ""}
  ${log ? `<div class="grid g2"><div><label>วันและเวลาที่ตรวจพบ</label>${DS.fmt.dateTime(log.capture_at)}</div><div><label>จังหวัด</label>${esc(log.province || "-")}</div><div><label>ประเภทรถ</label>${esc(log.vehicle_type || "-")}</div><div><label>หมายเหตุ</label>${esc(log.note || "-")}</div></div>` : ""}
  <div class="card" style="margin:12px 0"><b>ตรวจพบทั้งหมด ${hist.length} ครั้ง</b> · ล่าสุด ${DS.fmt.dateTime(hist[0].capture_at)}</div>
  ${log ? `<div class="row" style="margin:0 0 12px;flex-wrap:wrap">${log.vehicle_id ? '<button class="ghost" id="dVeh">ดูรถคันนี้</button>' : w ? '<button id="dLink">ผูกกับรถ</button>' : ""}</div>` : ""}
  <b>ประวัติการตรวจพบ</b><div style="margin-top:6px">${hist.map((h) => `<div class="item" style="padding:6px 0;border-top:1px solid var(--line);cursor:default">${DS.thumb(h.image_path)}<div style="flex:1;min-width:0">${DS.fmt.dateTime(h.capture_at)}<div class="muted wrapsafe">${esc(h.note || "")}</div></div>${stBadge(h.status)}</div>`).join("")}</div>
  ${log ? `<div class="row" style="margin-top:14px">${w ? '<button class="ghost" id="dEdit">แก้ไข</button>' : ""}${DS.can(me, "delete") ? '<button class="danger" id="dDel">ลบ</button>' : ""}</div>` : ""}`;
  DS.hydrateImages(body);
  if ($("#dVeh")) $("#dVeh").onclick = () => { m.remove(); openVehicle(log.vehicle_id); };
  if ($("#dLink")) $("#dLink").onclick = () => { m.remove(); relinkFlow(log); };
  if ($("#dEdit")) $("#dEdit").onclick = () => { m.remove(); editLog(log); };
  if ($("#dDel")) $("#dDel").onclick = () => { m.remove(); delLog(log); };
}

/* ---------- ผูกรายการที่ยังไม่มีรถ (เช่น ถูกแก้ป้าย) กับรถในระบบ ---------- */
async function relinkFlow(l) {
  const m = DS.modal("ผูกรายการกับรถ", spin), body = m.querySelector(".sb");
  const { data, error } = await db.rpc("match_plate", { p_plate: l.plate_number, p_province: l.province, p_confidence: null });
  if (error) { body.innerHTML = errBox(error.message); return; }
  const opts = []; if (data.vehicle) opts.push({ id: data.vehicle.id, plate: data.vehicle.license_plate, prov: data.vehicle.province, co: data.company ? data.company.company_name : null });
  (data.candidates || []).forEach((c) => opts.push({ id: c.id, plate: c.license_plate, prov: c.province, co: c.company_name }));
  let pick = null;
  body.innerHTML = `<p>รายการ <span class="plate wrapsafe">${esc(l.plate_number)}</span> ${esc(l.province || "")}</p><p class="muted">เลือกรถที่ตรงกัน ระบบจะไม่เลือกให้เอง</p>
  ${opts.map((o) => `<div class="cand" data-id="${esc(o.id)}"><input type="radio" name="rl" tabindex="-1"><div style="min-width:0"><span class="plate wrapsafe">${esc(o.plate)}</span><div class="muted wrapsafe">${esc(o.prov || "ไม่ระบุจังหวัด")} · ${esc(o.co || "ไม่ระบุบริษัท")}</div></div></div>`).join("")}
  ${data.vehicle ? "" : `<div class="cand" data-id="new"><input type="radio" name="rl" tabindex="-1"><div><b>ลงทะเบียนเป็นรถคันใหม่</b><div class="muted">ใช้เลขทะเบียนและจังหวัดของรายการนี้</div></div></div>`}
  <div id="rlNew" class="card hide"><label>บริษัทขนส่ง</label><select id="rlc">${coOptions("")}</select><div id="rlcn" class="hide"><label>ชื่อบริษัทใหม่</label><input id="rlname" maxlength="80"></div></div>
  <button id="rlOk" style="width:100%;margin-top:12px" disabled>ผูกรายการ</button>`;
  const upd = () => { $("#rlOk").disabled = !pick || (pick === "new" && $("#rlc").value === NEW_CO && !$("#rlname").value.trim()); };
  body.querySelectorAll(".cand").forEach((el) => (el.onclick = () => { pick = el.dataset.id; body.querySelectorAll(".cand").forEach((x) => { x.classList.toggle("on", x === el); x.querySelector("input").checked = x === el; }); $("#rlNew").classList.toggle("hide", pick !== "new"); upd(); }));
  $("#rlc").onchange = () => { $("#rlcn").classList.toggle("hide", $("#rlc").value !== NEW_CO); upd(); }; $("#rlname").oninput = upd;
  if (!opts.length) { body.querySelector('.cand[data-id="new"]').click(); }
  $("#rlOk").onclick = async (ev) => {
    ev.target.disabled = true; const reg = pick === "new", s = $("#rlc").value;
    const { error: e2 } = await db.rpc("relink_visit", { p_log_id: l.id, p_vehicle_id: reg ? null : pick, p_register: reg, p_company_id: reg && s && s !== NEW_CO ? s : null, p_new_company_name: reg && s === NEW_CO ? $("#rlname").value.trim() : null, p_vehicle_type: l.vehicle_type });
    if (e2) { DS.toast(String(e2.message).replace(/^[A-Z_]{4,}:\s*/, ""), "error"); ev.target.disabled = false; return; }
    DS.toast("ผูกรายการกับรถแล้ว"); m.remove(); loadCompanies(); reload();
  };
}
function editLog(l) {
  const m = DS.modal("แก้ไขข้อมูลทะเบียน", `<label>เลขทะเบียน</label><input id="e1" value="${esc(l.plate_number)}"><label>จังหวัด</label><input id="e2" list="provs" value="${esc(l.province || "")}">
  <label>ประเภทรถ</label><select id="e3"><option value="">ไม่ระบุ</option>${DS.VEHICLE_TYPES.map((t) => `<option ${t === l.vehicle_type ? "selected" : ""}>${t}</option>`).join("")}</select>
  <label>หมายเหตุ</label><textarea id="e4" rows="2">${esc(l.note || "")}</textarea><p class="muted">วันและเวลาที่ตรวจพบแก้ไขไม่ได้ เพื่อความถูกต้องของประวัติ</p>
  <div class="row"><button class="ghost" id="e0">ยกเลิก</button><button id="es">บันทึก</button></div>`);
  m.querySelector("#e0").onclick = () => m.remove();
  m.querySelector("#es").onclick = async (ev) => {
    const plate = m.querySelector("#e1").value.trim(); if (!plate) return DS.toast("กรุณากรอกเลขทะเบียน", "error");
    ev.target.disabled = true;
    const { error } = await db.from("vehicle_logs").update({ plate_number: plate, province: m.querySelector("#e2").value.trim() || null, vehicle_type: m.querySelector("#e3").value || null, note: m.querySelector("#e4").value.trim() || null }).eq("id", l.id);
    if (error) { DS.toast(error.message, "error"); ev.target.disabled = false; } else { const pv = m.querySelector("#e2").value.trim(), moved = l.vehicle_id && (DS.norm(plate) !== DS.norm(l.plate_number) || pv !== (l.province || "")); DS.toast(moved ? "แก้ไขแล้ว — รายการนี้ถูกตั้งเป็น “ต้องตรวจสอบ” กรุณาผูกกับรถที่ถูกต้อง" : "บันทึกการแก้ไขแล้ว", moved ? "info" : undefined); m.remove(); reload(); }
  };
}
function delLog(l) {
  const m = DS.modal("ยืนยันการลบ", `<p>ต้องการลบรายการทะเบียน <b>${esc(l.plate_number)}</b> ใช่หรือไม่?<br><span class="muted">การลบไม่สามารถย้อนกลับได้</span></p><div class="row"><button class="ghost" id="d0">ยกเลิก</button><button class="danger" id="d1">ลบ</button></div>`);
  m.querySelector("#d0").onclick = () => m.remove();
  m.querySelector("#d1").onclick = async (ev) => {
    ev.target.disabled = true; const { error } = await db.from("vehicle_logs").delete().eq("id", l.id);
    if (error) { DS.toast(error.message, "error"); ev.target.disabled = false; return; }
    if (l.image_path) await db.storage.from("plate-images").remove([l.image_path]);
    DS.toast("ลบรายการแล้ว"); m.remove(); reload();
  };
}

/* ---------- history ---------- */
$("#fToggle").onclick = () => $("#filters").classList.toggle("hide");
const FIDS = ["fp", "fpv", "ff", "ft", "fm", "fy", "fco", "fst"];
let ft; FIDS.forEach((id) => ($("#" + id).oninput = () => { clearTimeout(ft); ft = setTimeout(() => loadHistory(true), 350); }));
$("#fclear").onclick = () => { FIDS.forEach((id) => ($("#" + id).value = "")); loadHistory(true); };
function applyF(q) {
  const v = (id) => $("#" + id).value.trim();
  if (v("fp")) q = q.ilike("plate_norm", `%${DS.norm(v("fp"))}%`);
  if (v("fpv")) q = q.ilike("province", `%${v("fpv")}%`);
  if (v("ff")) q = q.gte("capture_date", v("ff")); if (v("ft")) q = q.lte("capture_date", v("ft"));
  if (v("fm")) q = q.eq("month", +v("fm")); if (v("fy")) q = q.eq("year", +v("fy"));
  if (v("fco")) q = q.eq("company_id", v("fco"));
  const s = v("fst");
  if (s === "known") q = q.in("status", ["matched", "verified", "legacy"]);
  else if (s === "new") q = q.eq("status", "new_vehicle");
  else if (s === "nocompany") q = q.not("vehicle_id", "is", null).is("company_id", null);
  else if (s === "review") q = q.in("status", ["needs_review", "unmatched"]);
  return q;
}
/* มุมมองประวัติ 4 แบบ: ตามเวลา / ประเภทรถ / ทะเบียนซ้ำ / ยังไม่ระบุ — มุมมองจัดกลุ่มดึงข้อมูลสูงสุด 1,000 รายการล่าสุดตามตัวกรองที่เลือก */
const HV = [["time", "ตามเวลา"], ["type", "ประเภทรถ"], ["plate", "ทะเบียนซ้ำ"], ["todo", "ไม่ระบุ"]];
let hview = "time", hall = [], hrep = true, hmiss = "all", todoN = null;
const HMAX = 1000, GSHOW = 30;
function drawViews() {

const isMissing = (l) => ["needs_review", "unmatched"].includes(l.status) || !l.vehicle_type || (l.vehicle_id && !l.company_id);
const missTags = (l) => [["needs_review", "unmatched"].includes(l.status) && "ต้องตรวจสอบ", !l.vehicle_type && "ไม่ระบุประเภท", l.vehicle_id && !l.company_id && "ไม่ระบุบริษัท"].filter(Boolean);
function dayLabel(t) {

  const loc = (x) => `${x.getFullYear()}-${x.getMonth()}-${x.getDate()}`;
  if (loc(d) === loc(n)) return "วันนี้"; const y = new Date(n); y.setDate(n.getDate() - 1); if (loc(d) === loc(y)) return "เมื่อวาน";
  return DS.fmt.date(t);
}
const gHead = (title, sub, count, open) => `<summary class="ghd"><span class="gt wrapsafe">${title}${sub ? `<span class="muted gs">${sub}</span>` : ""}</span><span class="badge" style="flex:none">${count} ครั้ง</span></summary>`;

async function loadTodoCount() {

async function loadHistory(reset) {

    $("#hlist").innerHTML = spin; hall = [];

      const { data, error } = await applyF(db.from("visit_details").select("*").order("capture_at", { ascending: false }).range(o, o + 499));
      if (error) { $("#hlist").innerHTML = errBox(error.message, "loadHistory(true)"); return; }
      hall = hall.concat(data); if (data.length < 500) break;
    }
    renderGrouped(); loadTodoCount(); return;
  }
  if (reset) { $("#hlist").innerHTML = spin; rows = []; }
  const { data, count, error } = await applyF(db.from("visit_details").select("*", { count: "exact" }).order("capture_at", { ascending: false }).range(rows.length, rows.length + PAGE - 1));
  if (error) { $("#hlist").innerHTML = errBox(error.message, "loadHistory(true)"); return; }
  total = count || 0; rows = reset ? data : rows.concat(data);
  $("#hcount").textContent = `ทั้งหมด ${total.toLocaleString("th-TH")} รายการ`;
  let last = "", out = "";
  rows.forEach((l) => { const d = dayLabel(l.capture_at); if (d !== last) { out += `${last ? "</div>" : ""}<div class="dayhd">${esc(d)}</div><div class="card" style="padding:4px 14px;margin-bottom:10px">`; last = d; } out += itemHtml(l); });
  $("#hlist").innerHTML = rows.length ? out + "</div>" : '<div class="empty">ไม่พบรายการ<br>ลองเปลี่ยนตัวกรอง หรือเริ่มสแกนทะเบียน</div>';
  bindItems($("#hlist"), rows); $("#more").classList.toggle("hide", rows.length >= total); $("#more").textContent = `โหลดเพิ่ม (${rows.length}/${total})`;
  loadTodoCount();
}

function resizeLogo(file, max) {
  max = max || 256;
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)), w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s));
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h; cv.getContext("2d").drawImage(img, 0, 0, w, h); URL.revokeObjectURL(u);
      cv.toBlob((b) => (b ? res(b) : rej(new Error("แปลงรูปไม่สำเร็จ"))), "image/png");
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error("อ่านไฟล์รูปไม่ได้ (รองรับ PNG, JPG, WebP)")); };
    img.src = u;
  });
}

  try { const { data, error: e } = await db.functions.invoke("notify-visit", { body: { ping: true } }); if (e) throw await DS.fnErr(e); bot.innerHTML = `<span class="badge ok">✓ เชื่อมต่อบอทแล้ว (@${esc(data.bot)})</span>`; }
  catch (x) { bot.innerHTML = `<span class="badge bad">✗ ${x.code === "TOKEN_MISSING" ? "ยังไม่ได้ตั้งค่า Bot Token" : esc(x.message)}</span>`; }
  if (!admin) return;
  const addModal = (pre) => {
    const m = DS.modal("เพิ่มปลายทาง Telegram", `<label>ชื่อเรียก (เช่น กลุ่มรปภ.)</label><input id="tgLabel" maxlength="60" value="${esc((pre && pre.title) || "")}"><label>Chat ID</label><input id="tgId" inputmode="numeric" placeholder="เช่น -1001234567890" value="${esc((pre && pre.chat_id) || "")}">
    <label>ใครอยู่ในแชตนี้</label><select id="tgCo"><option value="">ทีมงานเรา — เห็นรถทุกบริษัท</option>${coList.map((c) => `<option value="${esc(c.id)}">ลูกค้า: ${esc(c.company_name)} — เห็นเฉพาะรถบริษัทนี้</option>`).join("")}</select>
    <p class="muted" style="margin:4px 0 0">แชตของลูกค้า: ได้รับแจ้งและถามบอทได้เฉพาะรถของบริษัทที่เลือก (ไม่เห็นข้อมูลบริษัทอื่นและไม่เห็นรายการที่ยังรอตรวจสอบ)</p>
    <div class="row" style="margin-top:14px"><button class="ghost" id="tgX" type="button">ยกเลิก</button><button id="tgOk" type="button">บันทึก</button></div>`);
    m.querySelector("#tgX").onclick = () => m.remove();
    m.querySelector("#tgOk").onclick = async (ev) => {
      const target = m.querySelector("#tgId").value.trim(); if (!/^-?\d{5,}$/.test(target)) return DS.toast("Chat ID เป็นตัวเลข เช่น -1001234567890", "error");
      ev.target.disabled = true;
      const { error: e } = await db.from("notification_channels").insert({ type: "telegram", label: m.querySelector("#tgLabel").value.trim() || "Telegram", target, notify_mode: "all", enabled: true, company_id: m.querySelector("#tgCo").value || null });
      if (e) { DS.toast(e.message, "error"); ev.target.disabled = false; return; }
      m.remove(); DS.toast("เพิ่มปลายทางแล้ว — กด “ทดสอบ” เพื่อส่งข้อความลอง"); loadTelegram();
    };
  };
  $("#tgAdd").onclick = () => addModal();
  $("#tgFind").onclick = async (ev) => {
    ev.target.disabled = true;
    try {
      const { data, error: e } = await db.functions.invoke("notify-visit", { body: { discover: true } }); if (e) throw await DS.fnErr(e);
      const m = DS.modal("เลือกแชตที่พบ", data.chats.length ? `<p class="muted">แชตที่ส่งข้อความหาบอทหรือเพิ่มบอทเข้าไป</p>${data.chats.map((c) => `<div class="cand" data-id="${esc(c.chat_id)}" data-t="${esc(c.title)}"><b class="wrapsafe">${esc(c.title)}</b><div class="muted">${esc(c.type)} · ${esc(c.chat_id)}</div></div>`).join("")}` : '<div class="empty">ยังไม่พบแชต — เพิ่มบอทเข้ากลุ่ม แล้วพิมพ์ข้อความ 1 ข้อความในกลุ่ม จากนั้นกดค้นหาใหม่</div>');
      m.querySelectorAll(".cand").forEach((el) => (el.onclick = () => { m.remove(); addModal({ chat_id: el.dataset.id, title: el.dataset.t }); }));
    } catch (x) { DS.toast(x.message, "error"); }
    ev.target.disabled = false;
  };
  card.querySelectorAll("#tgList .item").forEach((el) => {
    const id = el.dataset.id, c = list.find((r) => r.id === id);
    el.querySelector(".tgTest").onclick = async (ev) => { ev.target.disabled = true; try { const { error: e } = await db.functions.invoke("notify-visit", { body: { test: true, chat_id: c.target } }); if (e) throw await DS.fnErr(e); DS.toast("ส่งข้อความทดสอบแล้ว"); } catch (x) { DS.toast(x.message, "error"); } ev.target.disabled = false; };
    el.querySelector(".tgTog").onclick = async () => { const { error: e } = await db.from("notification_channels").update({ enabled: !c.enabled }).eq("id", id); if (e) DS.toast(e.message, "error"); else loadTelegram(); };
    el.querySelector(".tgDel").onclick = async () => { if (!confirm("ลบปลายทางนี้?")) return; const { error: e } = await db.from("notification_channels").delete().eq("id", id); if (e) DS.toast(e.message, "error"); else loadTelegram(); };
  });
}
