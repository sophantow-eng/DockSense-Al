<script>
/* DockSense AI — ส่วนที่ใช้ร่วมกัน (index.html + scan.html) */
(function () {
  const cfg = window.DS_CONFIG || {};
  const keyMissing = !cfg.SUPABASE_URL || !cfg.SUPABASE_KEY || /PASTE_/.test(cfg.SUPABASE_KEY);
  const db = supabase.createClient(cfg.SUPABASE_URL || "https://invalid.supabase.co", cfg.SUPABASE_KEY || "missing", {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
  });

  const TZ = "Asia/Bangkok";
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // ต้องตรงกับคอลัมน์ plate_norm ในฐานข้อมูล: upper(regexp_replace(plate_number, '[\s\-]', '', 'g'))
  const norm = (s) => String(s ?? "").toUpperCase().replace(/[\s\-]/g, "");

  /* ธีม */
  const applyTheme = (t) => { if (t === "dark") document.documentElement.setAttribute("data-theme", "dark"); else document.documentElement.removeAttribute("data-theme"); };
  try {
    const saved = localStorage.getItem("ds_theme");
    applyTheme(saved || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  } catch (e) {}
  const toggleTheme = () => {
    const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(t); try { localStorage.setItem("ds_theme", t); } catch (e) {}
  };

  /* วันเวลา (แสดงตามเวลาไทยเสมอ ปี ค.ศ.) */
  const mkf = (o) => new Intl.DateTimeFormat("th-TH-u-ca-gregory", { timeZone: TZ, ...o });
  const fD = mkf({ day: "numeric", month: "short", year: "numeric" }), fT = mkf({ hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
  const ok = (v) => v && !isNaN(new Date(v));
  const fmt = {
    date: (v) => (ok(v) ? fD.format(new Date(v)) : "-"),
    time: (v) => (ok(v) ? fT.format(new Date(v)) : "-"),
    dateTime: (v) => (ok(v) ? fD.format(new Date(v)) + " " + fT.format(new Date(v)) : "-"),
    ago: (v) => {
      if (!ok(v)) return "-";
      const s = Math.max(0, (Date.now() - new Date(v)) / 1000);
      if (s < 60) return "เมื่อสักครู่";
      if (s < 3600) return Math.floor(s / 60) + " นาทีที่แล้ว";
      if (s < 86400) return Math.floor(s / 3600) + " ชั่วโมงที่แล้ว";
      if (s < 604800) return Math.floor(s / 86400) + " วันที่แล้ว";
      return fD.format(new Date(v));
    },
  };

  /* toast */
  function toast(msg, type) {
    let box = document.querySelector(".toasts");
    if (!box) { box = document.createElement("div"); box.className = "toasts"; document.body.appendChild(box); }
    const t = document.createElement("div"); t.className = "toast" + (type && type !== "ok" ? " " + type : ""); t.textContent = msg; box.appendChild(t);
    setTimeout(() => t.remove(), type === "error" ? 5000 : 3000);
  }

  /* modal: คืน element .modal ที่มี .sb (เนื้อหา) — ปิดด้วย m.remove() */
  function modal(title, html) {
    const m = document.createElement("div"); m.className = "modal";
    m.innerHTML = `<div class="sheet"><div class="sh"><b>${esc(title)}</b><button class="x" aria-label="ปิด">✕</button></div><div class="sb">${html || ""}</div></div>`;
    m.addEventListener("click", (e) => { if (e.target === m) m.remove(); });
    m.querySelector(".x").onclick = () => m.remove();
    document.body.appendChild(m); return m;
  }

  /* รูปภาพใน bucket private → signed URL (แคชไว้) */
  const sc = new Map();
  async function signedUrl(path) {
    const hit = sc.get(path); if (hit && hit.exp > Date.now()) return hit.url;
    const { data, error } = await db.storage.from("plate-images").createSignedUrl(path, 3600); if (error) throw error;
    sc.set(path, { url: data.signedUrl, exp: Date.now() + 3300 * 1000 }); return data.signedUrl;
  }
  const thumb = (p) => (p ? `<img class="ph" data-p="${esc(p)}" alt="" loading="lazy">` : '<div class="ph"></div>');
  function hydrateImages(root) {
    (root || document).querySelectorAll("img[data-p]").forEach(async (img) => {
      const p = img.dataset.p; img.removeAttribute("data-p");
      try { img.src = await signedUrl(p); } catch (e) { img.style.visibility = "hidden"; }
    });
  }

  /* สิทธิ์: admin ทำได้ทุกอย่าง · staff บันทึก/แก้ไข · viewer ดูอย่างเดียว (RLS ในฐานข้อมูลบังคับอีกชั้น) */
  const can = (me, a) => !!me && (a === "read" ? true : a === "write" ? me.role === "admin" || me.role === "staff" : me.role === "admin");

  /* session + โปรไฟล์: คืน null ถ้ายังไม่ล็อกอิน, {session, profile:null} ถ้ายังไม่มีโปรไฟล์ */
  async function requireAuth() {
    const { data: { session }, error } = await db.auth.getSession();
    if (error || !session) return null;
    const { data: profile, error: pe } = await db.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
    if (pe) console.error("profiles:", pe);
    return { session, profile: profile || null };
  }

  /* OCR ผ่าน Edge Function (API key อยู่ฝั่งเซิร์ฟเวอร์เท่านั้น) */
  async function fnErr(error) {
    let code = "OCR_FAILED", msg = error.message || "เรียก OCR ไม่สำเร็จ";
    const ctx = error.context;
    if (error.name === "FunctionsHttpError" && ctx) {
      try { const j = await ctx.json(); msg = j.error || j.message || msg; code = j.code || code; } catch (e) {}
      if (ctx.status === 404) code = "NOT_DEPLOYED";
      else if (ctx.status === 401) { code = "UNAUTHORIZED"; msg = "เซสชันหมดอายุหรือไม่ได้รับอนุญาต กรุณาเข้าสู่ระบบใหม่"; }
    } else { code = "NOT_DEPLOYED"; msg = "เชื่อมต่อ Edge Function ไม่ได้ (ยังไม่ได้ deploy หรืออินเทอร์เน็ตมีปัญหา)"; }
    const e = new Error(msg); e.code = code; return e;
  }
  const b64 = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej(new Error("อ่านไฟล์ภาพไม่ได้")); r.readAsDataURL(blob); });
  async function readPlate(blob) {
    const { data, error } = await db.functions.invoke("ocr-plate", { body: { imageBase64: await b64(blob), mediaType: blob.type || "image/jpeg" } });
    if (error) throw await fnErr(error); return data;
  }
  async function pingOcr() {
    const { data, error } = await db.functions.invoke("ocr-plate", { body: { ping: true } });
    if (error) throw await fnErr(error); return data.provider;
  }

  const VEHICLE_TYPES = ["รถยนต์", "รถกระบะ", "รถบรรทุก", "รถจักรยานยนต์", "รถตู้", "อื่นๆ"];
  const PROVINCES = ["กรุงเทพมหานคร","กระบี่","กาญจนบุรี","กาฬสินธุ์","กำแพงเพชร","ขอนแก่น","จันทบุรี","ฉะเชิงเทรา","ชลบุรี","ชัยนาท","ชัยภูมิ","ชุมพร","เชียงราย","เชียงใหม่","ตรัง","ตราด","ตาก","นครนายก","นครปฐม","นครพนม","นครราชสีมา","นครศรีธรรมราช","นครสวรรค์","นนทบุรี","นราธิวาส","น่าน","บึงกาฬ","บุรีรัมย์","ปทุมธานี","ประจวบคีรีขันธ์","ปราจีนบุรี","ปัตตานี","พระนครศรีอยุธยา","พะเยา","พังงา","พัทลุง","พิจิตร","พิษณุโลก","เพชรบุรี","เพชรบูรณ์","แพร่","ภูเก็ต","มหาสารคาม","มุกดาหาร","แม่ฮ่องสอน","ยโสธร","ยะลา","ร้อยเอ็ด","ระนอง","ระยอง","ราชบุรี","ลพบุรี","ลำปาง","ลำพูน","เลย","ศรีสะเกษ","สกลนคร","สงขลา","สตูล","สมุทรปราการ","สมุทรสงคราม","สมุทรสาคร","สระแก้ว","สระบุรี","สิงห์บุรี","สุโขทัย","สุพรรณบุรี","สุราษฎร์ธานี","สุรินทร์","หนองคาย","หนองบัวลำภู","อ่างทอง","อำนาจเจริญ","อุดรธานี","อุตรดิตถ์","อุทัยธานี","อุบลราชธานี"];

  window.addEventListener("offline", () => toast("ออฟไลน์อยู่ — ตรวจสอบอินเทอร์เน็ต", "error"));
  window.addEventListener("online", () => toast("กลับมาออนไลน์แล้ว", "info"));

  window.DS = { db, esc, norm, toggleTheme, fmt, toast, modal, signedUrl, thumb, hydrateImages, can, requireAuth, readPlate, pingOcr, VEHICLE_TYPES, PROVINCES, TZ };

  if (keyMissing) document.addEventListener("DOMContentLoaded", () => {
    const d = document.createElement("div");
    d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:200;background:#dc2626;color:#fff;padding:10px 14px;font-size:14px;text-align:center";
    d.textContent = "ยังไม่ได้ตั้งค่า SUPABASE_KEY ใน config.js — ล็อกอินและโหลดข้อมูลไม่ได้";
    document.body.appendChild(d);
  });
})();

</script>
<script>
const $ = (s) => document.querySelector(s), esc = DS.esc, db = DS.db;
let me = null, tab = "home", rows = [], total = 0, loadingMore = false;
const PAGE = 20;
const MONTHS = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const spin = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
const errBox = (m, retry) => `<div class="empty">⚠️ เกิดข้อผิดพลาด<br><span class="muted">${esc(m)}</span>${retry ? `<br><br><button class="ghost" onclick="${retry}">ลองใหม่</button>` : ""}</div>`;

/* ---------- login ---------- */
let mode = "in";
$("#lmode").onclick = (e) => { e.preventDefault(); mode = mode === "in" ? "up" : "in";
  $("#nameWrap").classList.toggle("hide", mode === "in"); $("#lnote").classList.toggle("hide", mode === "in");
  $("#lbtn").textContent = mode === "in" ? "เข้าสู่ระบบ" : "สมัครสมาชิก"; $("#lmode").textContent = mode === "in" ? "ยังไม่มีบัญชี? สมัครสมาชิก" : "มีบัญชีแล้ว? เข้าสู่ระบบ"; };
$("#loginForm").onsubmit = async (e) => {
  e.preventDefault(); const b = $("#lbtn"); b.disabled = true; $("#lerr").classList.add("hide");
  try {
    const email = $("#lemail").value.trim(), password = $("#lpass").value;
    if (mode === "in") { const { error } = await db.auth.signInWithPassword({ email, password }); if (error) throw error; }
    else { const { data, error } = await db.auth.signUp({ email, password, options: { data: { full_name: $("#lname").value } } }); if (error) throw error;
      if (!data.session) { DS.toast("สมัครสำเร็จ กรุณายืนยันอีเมลก่อนเข้าสู่ระบบ", "info"); $("#lmode").click(); b.disabled = false; return; } }
    boot();
  } catch (x) { const el = $("#lerr"); el.textContent = /invalid login/i.test(x.message) ? "อีเมลหรือรหัสผ่านไม่ถูกต้อง" : x.message; el.classList.remove("hide"); }
  b.disabled = false;
};
$("#outBtn").onclick = async () => { await db.auth.signOut(); location.reload(); };
$("#themeBtn").onclick = DS.toggleTheme;

/* ---------- boot / tabs ---------- */
async function boot() {
  const a = await DS.requireAuth();
  if (!a) { $("#login").classList.remove("hide"); $("#app").classList.add("hide"); return; }

function bars(data, color) {
  const max = Math.max(1, ...data.map((d) => d.count)), step = Math.ceil(data.length / 6) || 1;
  return `<div class="bars">${data.map((d) => `<div class="bar" title="${esc(d.label)}: ${d.count} คัน"><i style="height:${(d.count / max) * 100}%"></i></div>`).join("")}</div><div class="axis">${data.map((d, i) => `<span>${i % step === 0 ? esc(d.label) : ""}</span>`).join("")}</div>`;
}

let companies = [];

const PALETTE = ["#0d9488", "#6366f1", "#f59e0b", "#ef4444", "#0ea5e9", "#8b5cf6", "#10b981", "#ec4899", "#f97316", "#64748b"];
// สีแบรนด์ที่ admin ตั้งไว้ · ถ้าไม่ตั้ง ระบบสุ่มสีคงที่จากชื่อบริษัท (ไม่เดาสีแบรนด์จริง) เพื่อให้แต่ละบริษัทแยกกันได้ง่าย
const coColor = (c) => /^#[0-9a-fA-F]{6}$/.test((c && c.brand_color) || "") ? c.brand_color
  : PALETTE[Array.from(String((c && c.company_name) || "")).reduce((h, ch) => (h * 31 + ch.codePointAt(0)) >>> 0, 7) % PALETTE.length];
const logoSrc = (p) => db.storage.from("company-logos").getPublicUrl(p).data.publicUrl;
function coMark(c, sz) {
  sz = sz || 36;
  const col = coColor(c), ch = Array.from(String(c.company_name || "").trim())[0] || "?", ini = /[\p{L}\p{N}]/u.test(ch) ? esc(ch.toUpperCase()) : "?";
  const box = `width:${sz}px;height:${sz}px`;
  const fb = `<div class="ini" style="${box};background:${col};font-size:${Math.round(sz * 0.45)}px">${ini}</div>`;
  if (!c.logo_url) return fb;
  return `<img class="lg" style="${box}" src="${esc(logoSrc(c.logo_url))}" alt="" loading="lazy" data-fb="${esc(fb)}" onerror="this.outerHTML=this.dataset.fb">`;
}
const coChip = (c, sz) => (c && (c.company_id || c.id || c.company_name))
  ? `<div class="co" style="border-left:4px solid ${coColor(c)};padding-left:8px">${coMark(c, sz || 28)}<span class="nm">${esc(c.company_name)}</span></div>`
  : '<span class="badge warn">ไม่ระบุบริษัท</span>';
const ST = { matched: ["รู้จัก", "ok"], verified: ["ตรวจสอบแล้ว", "ok"], new_vehicle: ["รถใหม่", ""], needs_review: ["ต้องตรวจสอบ", "warn"], unmatched: ["ยังไม่จับคู่", "warn"], legacy: ["ข้อมูลเดิม", ""] };
const stBadge = (s) => { const x = ST[s] || [s || "-", ""]; return `<span class="badge ${x[1]}" style="flex:none">${esc(x[0])}</span>`; };
async function loadCompanies() {

  let pick = null;
  body.innerHTML = `<p>รายการ <span class="plate wrapsafe">${esc(l.plate_number)}</span> ${esc(l.province || "")}</p><p class="muted">เลือกรถที่ตรงกัน ระบบจะไม่เลือกให้เอง</p>

  ${data.vehicle ? "" : `<div class="cand" data-id="new"><input type="radio" name="rl" tabindex="-1"><div><b>ลงทะเบียนเป็นรถคันใหม่</b><div class="muted">ใช้เลขทะเบียนและจังหวัดของรายการนี้</div></div></div>`}
  <div id="rlNew" class="card hide"><label>บริษัทขนส่ง</label><select id="rlc">${coOptions("")}</select><div id="rlcn" class="hide"><label>ชื่อบริษัทใหม่</label><input id="rlname" maxlength="80"></div></div>

  body.querySelectorAll(".cand").forEach((el) => (el.onclick = () => { pick = el.dataset.id; body.querySelectorAll(".cand").forEach((x) => { x.classList.toggle("on", x === el); x.querySelector("input").checked = x === el; }); $("#rlNew").classList.toggle("hide", pick !== "new"); upd(); }));
  $("#rlc").onchange = () => { $("#rlcn").classList.toggle("hide", $("#rlc").value !== NEW_CO); upd(); }; $("#rlname").oninput = upd;

    ev.target.disabled = true; const reg = pick === "new", s = $("#rlc").value;
    const { error: e2 } = await db.rpc("relink_visit", { p_log_id: l.id, p_vehicle_id: reg ? null : pick, p_register: reg, p_company_id: reg && s && s !== NEW_CO ? s : null, p_new_company_name: reg && s === NEW_CO ? $("#rlname").value.trim() : null, p_vehicle_type: l.vehicle_type });

/* ---------- history ---------- */
$("#fToggle").onclick = () => $("#filters").classList.toggle("hide");
const FIDS = ["fp", "fpv", "ff", "ft", "fm", "fy", "fco", "fst"];
let ft; FIDS.forEach((id) => ($("#" + id).oninput = () => { clearTimeout(ft); ft = setTimeout(() => loadHistory(true), 350); }));
$("#fclear").onclick = () => { FIDS.forEach((id) => ($("#" + id).value = "")); loadHistory(true); };
function applyF(q) {
  const v = (id) => $("#" + id).value.trim();
  if (v("fp")) q = q.ilike("plate_norm", `%${DS.norm(v("fp"))}%`);
  if (v("fpv")) q = q.ilike("province", `%${v("fpv")}%`);
  if (v("ff")) q = q.gte("capture_date", v("ff")); if (v("ft")) q = q.lte("capture_date", v("ft"));
  if (v("fm")) q = q.eq("month", +v("fm")); if (v("fy")) q = q.eq("year", +v("fy"));
  if (v("fco")) q = q.eq("company_id", v("fco"));
  const s = v("fst");
  if (s === "known") q = q.in("status", ["matched", "verified", "legacy"]);
  else if (s === "new") q = q.eq("status", "new_vehicle");
  else if (s === "nocompany") q = q.not("vehicle_id", "is", null).is("company_id", null);
  else if (s === "review") q = q.in("status", ["needs_review", "unmatched"]);
  return q;
}
async function loadHistory(reset) {
  if (reset) { $("#hlist").innerHTML = spin; rows = []; }
  const { data, count, error } = await applyF(db.from("visit_details").select("*", { count: "exact" }).order("capture_at", { ascending: false }).range(rows.length, rows.length + PAGE - 1));
  if (error) { $("#hlist").innerHTML = errBox(error.message, "loadHistory(true)"); return; }
  total = count || 0; rows = reset ? data : rows.concat(data);
  $("#hcount").textContent = `ทั้งหมด ${total.toLocaleString("th-TH")} รายการ`;
  $("#hlist").innerHTML = rows.length ? `<div class="card" style="padding:4px 14px">${rows.map(itemHtml).join("")}</div>` : '<div class="empty">ไม่พบรายการ<br>ลองเปลี่ยนตัวกรอง หรือเริ่มสแกนทะเบียน</div>';
  bindItems($("#hlist"), rows); $("#more").classList.toggle("hide", rows.length >= total); $("#more").textContent = `โหลดเพิ่ม (${rows.length}/${total})`;
}
$("#more").onclick = async (e) => { e.target.disabled = true; await loadHistory(false); e.target.disabled = false; };

/* ---------- จัดการบริษัท + โลโก้ (admin) ---------- */
function resizeLogo(file, max) {
  max = max || 256;
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)), w = Math.max(1, Math.round(img.width * s)), h = Math.max(1, Math.round(img.height * s));
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h; cv.getContext("2d").drawImage(img, 0, 0, w, h); URL.revokeObjectURL(u);
      cv.toBlob((b) => (b ? res(b) : rej(new Error("แปลงรูปไม่สำเร็จ"))), "image/png");
    };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error("อ่านไฟล์รูปไม่ได้ (รองรับ PNG, JPG, WebP)")); };
    img.src = u;
  });
}

  $("#cos").innerHTML = `<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">บริษัทขนส่ง</h3><button class="ghost" id="coAdd" style="flex:none">+ เพิ่ม</button></div>
  <p class="muted">ใส่โลโก้และเลือกสีของแต่ละบริษัท จะแสดงในประวัติและหน้ารายละเอียดรถ ให้เห็นชื่อบริษัทได้ง่าย</p>
  ${companies.length ? companies.map((c) => `<div class="item" data-id="${esc(c.id)}" style="padding:10px 0;border-top:1px solid var(--line);align-items:center">${coMark(c, 44)}<div style="flex:1;min-width:0"><b class="wrapsafe">${esc(c.company_name)}</b><div class="muted">${c.logo_url ? "มีโลโก้แล้ว" : "ยังไม่มีโลโก้ — แตะเพื่อเพิ่ม"}</div></div><span class="muted" style="flex:none">แก้ไข ›</span></div>`).join("") : '<div class="empty">ยังไม่มีบริษัท กด “+ เพิ่ม” เพื่อเริ่มต้น</div>'}</div>`;

function companyModal(c) {
  let file = null, removeLogo = false, colorSet = !!(c && /^#[0-9a-fA-F]{6}$/.test(c.brand_color || ""));
  const m = DS.modal(c ? "แก้ไขบริษัท" : "เพิ่มบริษัท", `<div id="cmPrev" class="row" style="justify-content:flex-start;gap:12px;margin-bottom:8px"></div>
  <label>ชื่อบริษัท</label><input id="cmName" maxlength="80" value="${esc(c ? c.company_name : "")}" autocomplete="off">
  <label>โลโก้ (PNG / JPG / WebP)</label><input id="cmFile" type="file" accept="image/png,image/jpeg,image/webp">
  <div class="row" style="margin-top:6px;flex-wrap:wrap">${c && c.logo_url ? '<button class="ghost" id="cmRm" type="button">ลบโลโก้</button>' : ""}</div>
  <label>สีประจำบริษัท</label><div class="row" style="justify-content:flex-start;gap:8px"><input id="cmColor" type="color" style="width:56px;height:44px;padding:2px;flex:none" value="${coColor(c || { company_name: "" })}"><button class="ghost" id="cmAuto" type="button" style="flex:none">ใช้สีอัตโนมัติ</button></div>
  <div class="row" style="margin-top:14px"><button class="ghost" id="cmX" type="button">ยกเลิก</button><button id="cmOk" type="button">บันทึก</button></div>`);
  const cur = () => ({ company_name: m.querySelector("#cmName").value.trim() || (c ? c.company_name : "?"), logo_url: removeLogo || file ? null : c && c.logo_url, brand_color: colorSet ? m.querySelector("#cmColor").value : null });
  const prev = (src) => { m.querySelector("#cmPrev").innerHTML = (src ? `<img class="lg" style="width:64px;height:64px" src="${src}" alt="">` : coMark(cur(), 64)) + '<div class="muted">ตัวอย่างที่แสดงในระบบ</div>'; };
  prev(null);
  m.querySelector("#cmName").oninput = () => { if (!file) prev(null); };
  m.querySelector("#cmColor").oninput = () => { colorSet = true; if (!file) prev(null); };
  m.querySelector("#cmAuto").onclick = () => { colorSet = false; m.querySelector("#cmColor").value = coColor({ company_name: m.querySelector("#cmName").value.trim() }); if (!file) prev(null); };
  if (m.querySelector("#cmRm")) m.querySelector("#cmRm").onclick = (e) => { removeLogo = true; file = null; m.querySelector("#cmFile").value = ""; e.target.remove(); prev(null); };
  m.querySelector("#cmFile").onchange = (e) => { const f = e.target.files[0]; if (!f) return; if (f.size > 10 * 1024 * 1024) { DS.toast("ไฟล์ใหญ่เกินไป (สูงสุด 10 MB)", "error"); e.target.value = ""; return; } file = f; removeLogo = false; prev(URL.createObjectURL(f)); };
  m.querySelector("#cmX").onclick = () => m.remove();
  m.querySelector("#cmOk").onclick = async (ev) => {
    const name = m.querySelector("#cmName").value.trim(); if (!name) return DS.toast("กรุณากรอกชื่อบริษัท", "error");
    const btn = ev.target; btn.disabled = true; btn.textContent = "กำลังบันทึก...";
    try {
      const color = colorSet ? m.querySelector("#cmColor").value : null; let id = c && c.id, oldLogo = c && c.logo_url;
      if (c) { const { error } = await db.from("companies").update({ company_name: name, brand_color: color }).eq("id", id); if (error) throw error; }
      else { const { data, error } = await db.from("companies").insert({ company_name: name, brand_color: color }).select("id").single(); if (error) throw error; id = data.id; }
      if (file) {
        const blob = await resizeLogo(file), path = `${id}/${Date.now()}.png`;
        const up = await db.storage.from("company-logos").upload(path, blob, { contentType: "image/png" }); if (up.error) throw up.error;
        const { error } = await db.from("companies").update({ logo_url: path }).eq("id", id);
        if (error) { await db.storage.from("company-logos").remove([path]); throw error; }
        if (oldLogo) await db.storage.from("company-logos").remove([oldLogo]);
      } else if (removeLogo && oldLogo) {
        const { error } = await db.from("companies").update({ logo_url: null }).eq("id", id); if (error) throw error;
        await db.storage.from("company-logos").remove([oldLogo]);
      }
      DS.toast("บันทึกบริษัทแล้ว"); m.remove(); renderCompaniesCard();
    } catch (e) {
      DS.toast(e.code === "23505" ? "มีบริษัทชื่อนี้อยู่แล้ว" : e.message, "error"); btn.disabled = false; btn.textContent = "บันทึก";
    }

}
